name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  launcher-test:
    name: Launcher CLI Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Assemble example
        run: node launcher/index.js assemble example

      - name: Check conflicts
        run: node launcher/index.js check example

      - name: Heal preview
        run: node launcher/index.js heal example

  macos-test:
    name: macOS Launcher Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Assemble example
        run: node launcher/index.js assemble example

      - name: Check conflicts
        run: node launcher/index.js check example

      - name: Heal preview
        run: node launcher/index.js heal example
  build-windows:
    name: Build Windows EXE + Setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Download WebView2 SDK (NuGet)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2 -OutFile webview2.zip
          Expand-Archive webview2.zip -DestinationPath webview2
          echo "WEBVIEW2_CORE_DLL=$env:GITHUB_WORKSPACE/webview2/lib/net462/Microsoft.Web.WebView2.Core.dll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "WEBVIEW2_WINFORMS_DLL=$env:GITHUB_WORKSPACE/webview2/lib/net462/Microsoft.Web.WebView2.WinForms.dll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "WEBVIEW2_LOADER_DLL=$env:GITHUB_WORKSPACE/webview2/runtimes/win-x64/native/WebView2Loader.dll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build desktop EXE
        shell: pwsh
        run: pwsh -File release/build-exe.ps1

      - name: Build installer
        shell: pwsh
        run: pwsh -File installer/build-installer.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-hotplug-hub-windows
          path: |
            release/DSH-Hotplug-Hub.exe
            installer/Setup.exe