const MARKET_PACK_CANDIDATES = ['hotpack.json', '.dshpack.json', 'dshpack.json'];
const MARKET_README_CANDIDATES = ['README.zh.md', 'README.md', 'readme.md', 'README_CN.md', 'README_ZH.md', 'Readme.md', 'README.txt'];
const MARKET_PAGE_SIZE = 10;
const MARKET_MAX_PAGE = 10; // 与后端 lib/core/paths.js MARKET_MAX_PAGE 一致（分页上限；漂移由 crosslang 断言锁定）
const MARKET_DETAIL_CONCURRENCY = 6;
const MARKET_DEFAULT_TOPIC = 'dsh-plugin';
let marketData = [];          // 抓取的条目 {repo,ref,name,author,stars,forks,license,description,topics,version,npmName,hasPack,intro,install,importable,importError,manifest}
let marketTotal = 0;          // 搜索命中总数
let marketLoading = false;    // 是否正在抓取
let marketError = '';         // 抓取错误（为空则无）
let marketSources = null;     // null=默认(官方+全部镜像)；否则为选中来源数组 ['github','ghfast.top',...]
let marketTopic = MARKET_DEFAULT_TOPIC; // GitHub 标签
let marketPage = 1;           // 当前分页
let marketCachedAt = '';      // 缓存时间（localStorage）
let marketTagsOpen = false;   // 标签面板是否展开（默认折叠）
let marketAppending = false; // 加载更多时保留已有卡片，仅底部显示加载中
let marketFetchedVia = '';   // 本次数据实际来源域名（官方 api.github.com 或命中的镜像站，如 ghfast.top）
let marketLastPageItems = 0; // 最近一页返回的条数（hasMore 终止判据：不满页=结果耗尽）

// 市场缓存（localStorage）：TTL 10 分钟（陈旧列表自动重抓）；按 FIFO 只保留最近
// 8 个键（每键一整页含 manifest，无上限会撑爆 ~5MB 配额——审计修复）。
const MARKET_CACHE_TTL_MS = 10 * 60 * 1000;
const MARKET_CACHE_MAX_KEYS = 8;
function marketCacheKey() { return 'dsh-market-' + marketTopic + '-' + (marketQuery || '').trim() + '-' + (marketSources && marketSources.length ? marketSources.join(',') : 'default'); }

/** 写入市场缓存并做 FIFO 淘汰（保留本键 + 最近 MARKET_CACHE_MAX_KEYS-1 个其他键）。 */
function marketCacheWrite(key, payload) {
  try {
    const entries = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('dsh-market-') && k !== key) {
        try {
          const v = JSON.parse(localStorage.getItem(k) || 'null');
          const parsedAt = v && v.cachedAt ? Date.parse(v.cachedAt) : NaN;
          entries.push({ k, at: Number.isFinite(parsedAt) ? parsedAt : 0 });
        } catch (_) { entries.push({ k, at: 0 }); }
      }
    }
    entries.sort((a, b) => a.at - b.at);
    const drop = entries.slice(0, Math.max(0, entries.length - (MARKET_CACHE_MAX_KEYS - 1)));
    for (const e of drop) { try { localStorage.removeItem(e.k); } catch (_) { /* 尽力而为 */ } }
    localStorage.setItem(key, JSON.stringify(payload));
  } catch (_) { /* file:// 模式无 localStorage / 配额满：忽略 */ }
}

/** 「加载更多」终止判定：最近一页满页 && 未达分页上限 && 未加载完全部命中。
 *  与后端 marketListAsync hasMore 契约一致（后端 page clamp MARKET_MAX_PAGE=10；
 *  此前只判 marketData.length 非空，结果耗尽后按钮永在、每次点击都发空页请求——审计修复）。 */
function marketHasMore(lastPageItems) {
  if (marketError || !marketData.length) return false;
  if (marketPage >= MARKET_MAX_PAGE) return false;
  // 审计修复（审查轮）：lastPageItems 此前从未接线——「不满页=结果耗尽」判据失效，
  // 小众标签（总数<页大小）的按钮永不消失、空页请求不断。
  const last = typeof lastPageItems === 'number' ? lastPageItems : marketLastPageItems;
  if (typeof last === 'number' && last < MARKET_PAGE_SIZE) return false;
  return marketData.length < Math.max(marketTotal, MARKET_PAGE_SIZE);
}

// topic 校验与后端 sanitizeTopic 语义一致：所有 token 合法才通过；空输入返回 ''
// （由 loadMarket 回落默认标签）；非法 token 返回 null（显式报错，不再静默过滤——
// 审计修复：此前静默丢弃非法 token 搜索条件与界面显示不一致）。
function sanitizeTopic(t) {
  const m = String(t || '').trim();
  if (!m) return '';
  // 与后端一致：逗号（中英文）/空白均可分隔（后端错误文案明示「逗号/空格分隔」——
  // 审计修复：此前仅 \s+ 分词，桌面壳输入逗号分隔多标签报错而 DSH Desktop 正常）
  const parts = m.split(/[,，\s]+/).map((s) => s.toLowerCase());
  const ok = [];
  for (const s of parts) {
    if (!/^[0-9a-z][0-9a-z._-]{0,31}$/.test(s)) return null;
    ok.push(s);
  }
  if (ok.length > 4) return null;
  return ok.slice(0, 4).join(' ');
}

/* ---- 1. 网络请求层：官方 API + 多镜像源（逐个域名多选，全并发测速取最快） ---- */
// 把「来源集合」（['github','ghfast.top',...]）映射为候选 URL；github=官方原始 URL
function candidatesFromSources(sources, officialUrl) {
  const list = Array.isArray(sources) && sources.length ? sources : MARKET_SOURCE_OPTIONS;
  const out = [];
  for (const s of list) {
    if (s === MARKET_SOURCE_GITHUB) { out.push(officialUrl); }
    else { out.push('https://' + String(s).replace(/^https?:\/\//, '').replace(/\/+$/, '') + '/' + officialUrl); }
  }
  return out;
}

function apiSearchUrls(topic, q, page, sources) {
  const terms = topic.split(/\s+/).map((t) => 'topic:' + t).join(' ');
  const query = 'q=' + encodeURIComponent(terms + (q ? ' ' + q : '')) +
    '&sort=stars&order=desc&per_page=' + MARKET_PAGE_SIZE + '&page=' + page;
  return candidatesFromSources(sources, 'https://api.github.com/search/repositories?' + query);
}

function rawFileUrls(repo, ref, path, sources) {
  return candidatesFromSources(sources, 'https://raw.githubusercontent.com/' + repo + '/' + ref + '/' + path);
}

function apiRepoUrls(repo, sources) {
  return candidatesFromSources(sources, 'https://api.github.com/repos/' + repo);
}

// 带超时的 fetch：浏览器 fetch 无自动超时，镜像挂起会永远不 settle，这里用 AbortController 兜底。
// extSignal（可选）：竞速胜出后由调用方 abort 败者通道，释放连接（移动端/弱网不再空跑）。
const FETCH_TIMEOUT_MS = 12000;
async function fetchTimeout(url, opts, extSignal) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
  const onAbort = () => ctrl.abort();
  if (extSignal) {
    if (extSignal.aborted) ctrl.abort();
    else extSignal.addEventListener('abort', onAbort);
  }
  try { return await fetch(url, Object.assign({}, opts, { signal: ctrl.signal })); }
  finally { clearTimeout(timer); if (extSignal) extSignal.removeEventListener('abort', onAbort); }
}

// 依次尝试多个 URL，全部失败返回最后一个错误信息
async function fetchAny(urls, opts) {
  let lastErr = '';
  for (const url of urls) {
    try {
      const res = await fetchTimeout(url, opts);
      if (!res.ok) { lastErr = 'HTTP ' + res.status; continue; }
      return { ok: true, status: res.status, text: await res.text(), url };
    } catch (e) { lastErr = e && e.message ? e.message : String(e); continue; }
  }
  return { ok: false, error: lastErr };
}

// 多通道竞速：官方与镜像同时发起请求，取第一个成功响应（"哪个快用哪个"）。
// 仅用于市场检索（searchMarketRepos）；raceFilesAny 处理原始文件全并发测速。
// 审计修复：结算后 abort 败者通道（不再空跑到各自超时）。
function raceFetchAny(urls, opts) {
  return new Promise((resolve) => {
    if (!Array.isArray(urls) || urls.length === 0) return resolve({ ok: false, error: '' });
    let settled = false;
    let failures = 0;
    const ctrl = new AbortController();
    const finish = (value) => {
      if (settled) return;
      settled = true;
      ctrl.abort(); // 取消败者通道
      resolve(value);
    };
    for (const url of urls) {
      fetchTimeout(url, opts, ctrl.signal).then(async (res) => {
        if (settled) return;
        if (res.ok) {
          const text = await res.text();
          finish({ ok: true, status: res.status, text, url, raced: true });
          return;
        }
        failures += 1;
        if (failures === urls.length) finish({ ok: false, error: 'HTTP ' + res.status });
      }).catch((e) => {
        if (settled) return;
        failures += 1;
        if (failures === urls.length) finish({ ok: false, error: e && e.message ? e.message : String(e) });
      });
    }
  });
}

async function fetchJson(urls) {
  const r = await fetchAny(urls, { headers: { Accept: 'application/vnd.github+json' } });
  if (!r.ok) return { ok: false, error: r.error };
  try { return { ok: true, json: JSON.parse(r.text), url: r.url }; }
  catch (e) { return { ok: false, error: '响应不是合法 JSON: ' + e.message }; }
}

/** 从成功响应的 url 提取域名（如 api.github.com / ghfast.top），用作"来源"展示。 */
function hostOf(url) {
  try { return new URL(url).host; } catch (e) { return ''; }
}

/**
 * 原始文件（README/package.json/hotpack 等）全并发测速：官方 + 所有镜像同时发起，
 * 取第一个「确定性结论」。确定性 = 成功(200) 或 明确不存在(404/410)——与后端
 * lib/core/market.js raceFiles 语义一致（403 是限流/封禁不是「不存在」，须等镜像 200，
 * 否则官方限流时镜像的合法结果被丢弃；审计修复：此前 404 也计入 failures 等全部通道，
 * 文件不存在时要等所有镜像超时，是原型市场详情慢的根因）。结算后 abort 败者通道。
 */
function raceFilesAny(urls, opts) {
  return new Promise((resolve) => {
    if (!Array.isArray(urls) || urls.length === 0) return resolve({ ok: false, error: '' });
    let settled = false;
    let failures = 0;
    let first = null;
    const ctrl = new AbortController();
    // 外部取消（fetchFirstOkAny 的预算/胜出联动）：abort 时连带取消全部候选通道
    const extSignal = opts && opts.signal;
    if (extSignal) {
      if (extSignal.aborted) ctrl.abort();
      else extSignal.addEventListener('abort', () => ctrl.abort(), { once: true });
    }
    const done = (value) => {
      if (settled) return;
      settled = true;
      ctrl.abort(); // 取消败者通道
      resolve(value);
    };
    const fetchOpts = opts ? { headers: opts.headers } : {};
    for (const url of urls) {
      fetchTimeout(url, fetchOpts, ctrl.signal).then(async (res) => {
        if (settled) return;
        if (res.ok) {
          const text = await res.text();
          done({ ok: true, status: res.status, text, url, raced: true });
          return;
        }
        if (res.status === 404 || res.status === 410) {
          done({ ok: false, status: res.status, url, error: 'HTTP ' + res.status });
          return;
        }
        if (!first) first = res;
        failures += 1;
        if (failures === urls.length) done({ ok: false, error: 'HTTP ' + first.status, url: first.url });
      }).catch((e) => {
        if (settled) return;
        failures += 1;
        if (failures === urls.length) done({ ok: false, error: e && e.message ? e.message : String(e), url: first ? first.url : '' });
      });
    }
  });
}

/* ---- 2. README 解析层：提取简介与安装方法 ---- */
function looksLikeNav(para) {
  if (!para) return false;
  const s = String(para).trim();
  if (!s) return true;
  if (/^\s*(English|中文|简体中文|繁體|한국어|日本語|Deutsch|Français|Español|Русский)\s*$/.test(s)) return true;
  const stripped = s.replace(/\[[^\]]*\]\([^)]*\)/g, '').replace(/[#*_>`|~]/g, '').trim();
  return stripped.length < 30 && /(english|中文|简|繁|한국어|日本語|deutsch|français|español|русский)/i.test(stripped);
}

function cleanMd(text) {
  return String(text || '')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')          // 图片
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')        // 链接→文本
    .replace(/`([^`]*)`/g, '$1')                    // 行内代码
    .replace(/[#*_>~|]+/g, ' ')                     // markdown 符号
    .replace(/<[^>]+>/g, '')                        // HTML 标签
    .replace(/[ \t]+/g, ' ')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function extractIntro(readme) {
  if (!readme) return '';
  const lines = String(readme).split('\n');
  const paras = [];
  let buf = '';
  for (const ln of lines) {
    if (!ln.trim()) { if (buf.trim()) paras.push(buf.trim()); buf = ''; continue; }
    buf += (buf ? ' ' : '') + ln.trim();
  }
  if (buf.trim()) paras.push(buf.trim());
  for (const para of paras) {
    const cleaned = cleanMd(para);
    if (!cleaned || looksLikeNav(cleaned)) continue;
    return cleaned.slice(0, 280);
  }
  return '';
}

function extractInstall(readme) {
  if (!readme) return '';
  const lines = String(readme).split('\n');
  let inSection = false;
  let out = [];
  const headRe = /^#{2,4}\s*(安装|安装方法|安装与使用|Installation|Quick Start|快速开始|使用|Usage|Getting Started)/i;
  for (const ln of lines) {
    const h = ln.match(/^#{1,6}\s+(.+)/);
    if (h) {
      if (inSection) break;
      if (headRe.test(ln)) { inSection = true; continue; }
      continue;
    }
    if (inSection) out.push(ln);
  }
  if (!inSection || !out.length) return '';
  const text = out.join('\n').replace(/```[a-z]*\n?/gi, '').replace(/<[^>]+>/g, '').trim();
  return text.slice(0, 1200);
}

// dshpack(.dshpack.json) → hotpack v1 结构
/* ---- 3. manifest 生成层：生成可导入的 hotpack v1 ---- */
// H-11b/c（v5 阶段 4）：id 由显式 bundle.id 派生（无则 role 清洗）；npm 缺精确 version
// 拒绝（不再默认为 'latest'）；与 shared-core dshpackToHotpack 行为等价（M-51 锁定）
function dshpackToHotpack(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { return null; }
  if (!data || typeof data !== 'object') return null;
  const bundles = Array.isArray(data.bundles) ? data.bundles : [];
  if (!data.packId || !data.name || !bundles.length) return null;
  const plugins = bundles.map((b) => {
    if (!b || typeof b !== 'object') return null;
    const name = b.package || b.name || '';
    if (!name) return null;
    const sourceType = (b.source && b.source.type) || 'npm';
    if (sourceType === 'npm' && !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(String(b.version || ''))) return null;
    const p = {
      id: (typeof b.id === 'string' && b.id !== '') ? b.id : String(b.role || 'main').toLowerCase().replace(/[^a-z0-9._-]/g, '-'),
      name,
      source: { type: sourceType }
    };
    if (p.source.type === 'npm') p.version = b.version;
    else if (p.source.type === 'github') {
      if (b.source && b.source.repo) p.source.repo = b.source.repo;
      if (b.source && b.source.ref) p.source.ref = b.source.ref;
    } else if (b.source && b.source.path) p.source.path = b.source.path;
    return p;
  });
  if (plugins.some((p) => p === null)) return null;
  return {
    hotpack: '1.0',
    id: data.packId,
    name: data.name,
    version: data.version || '0.0.0',
    description: data.description || '',
    plugins
  };
}

// 同步 SHA-1（UTF-8）——浏览器端无 node:crypto；跨语言等价由
// shared-core crosslang-html 测试以 golden 值锁定（与 lib/core/market.js packIdOf 一致）。
function sha1Hex(str) {
  function rotl(n, s) { return (n << s) | (n >>> (32 - s)); }
  const utf8 = unescape(encodeURIComponent(String(str)));
  const bytes = [];
  for (let i = 0; i < utf8.length; i++) bytes.push(utf8.charCodeAt(i));
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(Math.floor(bitLen / Math.pow(2, i * 8)) & 0xff);
  let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
  const w = new Array(80);
  for (let off = 0; off < bytes.length; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = (bytes[off + i * 4] << 24) | (bytes[off + i * 4 + 1] << 16) | (bytes[off + i * 4 + 2] << 8) | bytes[off + i * 4 + 3];
    for (let i = 16; i < 80; i++) w[i] = rotl(w[i - 3] ^ w[i - 8] ^ w[i - 14] ^ w[i - 16], 1);
    let a = h0, b = h1, c = h2, d = h3, e = h4;
    for (let i = 0; i < 80; i++) {
      let f, k;
      if (i < 20) { f = (b & c) | (~b & d); k = 0x5A827999; }
      else if (i < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
      else if (i < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
      else { f = b ^ c ^ d; k = 0xCA62C1D6; }
      const t = (rotl(a, 5) + f + e + k + w[i]) | 0;
      e = d; d = c; c = rotl(b, 30); b = a; a = t;
    }
    h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0;
  }
  const hex = (n) => (n >>> 0).toString(16).padStart(8, '0');
  return hex(h0) + hex(h1) + hex(h2) + hex(h3) + hex(h4);
}

// 与后端 lib/core/market.js packIdOf 完全一致：'/'→'-' 有损清洗 + 8 位 sha1 短哈希后缀
// （单射：a-b/c 与 a/b-c 清洗后同基名，靠哈希区分；≤64 字符）。
function packIdOf(repo) {
  const s = String(repo).toLowerCase();
  const base = ('pack.' + s).replace(/[^a-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '');
  const digest = sha1Hex(s).slice(0, 8);
  const head = base.length <= 55 ? base : base.slice(0, 55);
  return head + '-' + digest;
}

function buildGithubPluginPack(repo, ref, npmName, version, meta) {
  const v = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(String(version || '')) ? version : '0.0.0';
  return {
    hotpack: '1.0',
    id: packIdOf(repo),
    name: (meta && meta.name) || repo.split('/')[1] || repo,
    version: v,
    description: (meta && meta.description) || '',
    tags: (meta && meta.topics) || [],
    plugins: [{
      id: 'main',
      name: npmName || (repo.split('/')[1] || repo),
      // H-10：ref 过 validateSourceRef（非法回落 main）
      source: { type: 'github', repo, ref: validateSourceRef(ref) ? ref : 'main' }
    }]
  };
}

// 搜索结果的列表元数据条目：详情尚未抓取，由并发 fetchRepoDetail 逐条补齐
function metaEntry(m) {
  return {
    id: packIdOf(m.repo), repo: m.repo, ref: m.ref, repoUrl: 'https://github.com/' + m.repo,
    name: m.name, author: m.author, stars: m.stars, forks: m.forks, license: m.license,
    description: m.description, topics: m.topics || [], updatedAt: m.updatedAt,
    detailPending: true, importable: false, importError: '', intro: '', install: '',
    version: '', npmName: '', hasPack: false, manifest: null
  };
}

// 单条详情返回后，只替换对应卡片 DOM，不动工具栏/滚动位置（渐进式填充）
function patchMarketCard(entry) {
  if (!entry || !entry.repo) return;
  const sel = '#view-market [data-repo="' + String(entry.repo).replace(/"/g, '\\"') + '"]';
  const el = document.querySelector(sel);
  if (!el) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = renderMarketCard(entry).trim();
  const fresh = tmp.firstElementChild;
  if (!fresh) return;
  el.replaceWith(fresh);
  const btn = fresh.querySelector('[data-mkt-install]');
  if (btn) btn.addEventListener('click', () => installMarketEntry(btn.dataset.mktInstall));
}

// 拉取单个仓库的详情：包清单 + package.json + README，生成可导入 manifest
async function fetchRepoDetail(repo, ref, meta, sources) {
  const entry = {
    // H-10：ref 过 validateSourceRef（非法回落 main）
    repo, ref: validateSourceRef(ref) ? ref : 'main', name: meta.name, author: meta.author,
    stars: meta.stars, forks: meta.forks, license: meta.license,
    description: meta.description, topics: meta.topics || [],
    version: '', npmName: '', hasPack: false, intro: '', install: '',
    importable: false, importError: '', manifest: null, updatedAt: meta.updatedAt
  };
  let manifest = null;
  let manifestErr = '';
  let pkgName = '', pkgVersion = '';

  const packScans = MARKET_PACK_CANDIDATES.map((f) => rawFileUrls(repo, entry.ref, f, sources));
  const pkgUrl = rawFileUrls(repo, entry.ref, 'package.json', sources);
  const readmeUrls = MARKET_README_CANDIDATES.map((f) => rawFileUrls(repo, entry.ref, f, sources));

  // 竞速取第一个成功的候选文件：各候选（含其镜像 URL）并发发起，任一命中立即结算，
  // 不必等其余候选（否则 7 个 README 候选逐个串行会拖慢整页）。
  // 审计修复：done 后清理 budget timer 并 abort 全部候选竞速（败者不空跑、timer 不悬挂）。
  const fetchFirstOkAny = (candidateUrlLists, budgetMs) => {
    return new Promise((resolve) => {
      let settled = false;
      const ctrl = new AbortController();
      const done = (v) => {
        if (settled) return;
        settled = true;
        clearTimeout(budget);
        ctrl.abort();
        resolve(v);
      };
      const budget = setTimeout(() => done(null), budgetMs);
      let pending = 0;
      for (const urls of candidateUrlLists) {
        pending += 1;
        raceFilesAny(urls, { signal: ctrl.signal }).then((r) => {
          if (settled) return;
          if (r.ok) { done(r); return; }
          pending -= 1;
          if (pending === 0) done(null);
        });
      }
    });
  };

  const runPack = async () => {
    const r = await fetchFirstOkAny(packScans, FETCH_TIMEOUT_MS);
    if (!r || !r.ok) return;
    const hp = parseHotpackJson(r.text) || dshpackToHotpack(r.text);
    if (hp) { manifest = hp; entry.hasPack = true; return; }
    manifestErr = 'hotpack/.dshpack 解析失败';
  };
  const runPkg = async () => {
    const r = await raceFilesAny(pkgUrl, {});
    if (r.ok) {
      try {
        const j = JSON.parse(r.text);
        pkgName = j && j.name; pkgVersion = j && j.version;
      } catch (e) { /* 忽略 */ }
    }
  };
  const runReadme = async () => {
    const r = await fetchFirstOkAny(readmeUrls, FETCH_TIMEOUT_MS);
    if (r && r.ok) {
      entry.intro = extractIntro(r.text);
      entry.install = extractInstall(r.text);
    }
  };

  await Promise.all([runPack(), runPkg(), runReadme()]);

  entry.version = pkgVersion || (manifest && manifest.version) || '';
  entry.npmName = pkgName || '';
  if (!manifest) {
    if (pkgName) manifest = buildGithubPluginPack(repo, entry.ref, pkgName, pkgVersion, meta);
    else if (!manifestErr) manifestErr = '未找到 package.json 或 hotpack/.dshpack 清单，无法生成导入包';
  }
  entry.importable = Boolean(manifest);
  entry.importError = manifest ? '' : (manifestErr || '无法生成导入包');
  entry.manifest = manifest;
  return entry;
}

// 兼容宿主端 parseHotpack 的核心校验（prototype 内联精简版；核心子集与
// shared-core parseHotpack 等价——包/插件 id、精确版本、去重、源类型白名单等，
// 由 prototype-ai.test.mjs 跨语言断言锁定；包 id 与插件 name 的完整格式、
// path/github 源必填字段由服务端导入时权威复验）。
// 审计修复：包级 version 必须 semver（'latest' 不再放行——此前页面接受、后端拒绝，
// 产物"看起来有效"却在导入时失败）；npm 源插件 version 必填精确版本；插件 id/name
// 大小写不敏感去重；name 空白串拒绝——四处与权威解析器对齐。
function parseHotpackJson(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { return null; }
  if (!data || data.hotpack !== '1.0') return null;
  if (!data.id || !data.name || !data.version || !Array.isArray(data.plugins)) return null;
  if (!String(data.name).trim()) return null;
  if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$/.test(data.version)) return null;
  if (data.plugins.length < 1 || data.plugins.length > 5) return null;
  const seenIds = new Set();
  const seenNames = new Set();
  for (const p of data.plugins) {
    if (!p || typeof p !== 'object') return null;
    if (!p.id || !/^[a-z0-9][a-z0-9_-]{0,39}$/.test(p.id)) return null;
    if (!p.name || typeof p.name !== 'string' || !p.name.trim()) return null;
    // source.type 缺省= npm；显式空串/空白=拒绝（与权威解析器一致，不与缺省混同）
    const rawType = p.source && p.source.type !== undefined && p.source.type !== null ? p.source.type : undefined
    if (rawType !== undefined && String(rawType).trim() === '') return null;
    const type = rawType === undefined ? 'npm' : rawType;
    if (type !== 'npm' && type !== 'path' && type !== 'github') return null;
    const VER = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$/;
    if (type === 'npm' && !VER.test(p.version || '')) return null;
    if (p.version && !VER.test(p.version)) return null;
    const idKey = String(p.id).toLowerCase();
    const nameKey = String(p.name).toLowerCase();
    if (seenIds.has(idKey) || seenNames.has(nameKey)) return null;
    seenIds.add(idKey);
    seenNames.add(nameKey);
  }
  return data;
}

/* ---- 4. 仓库搜索：按标签分页拉取仓库列表 ---- */
async function searchMarketRepos(topic, q, page, sources) {
  // 选中的来源通道同时发起，取第一个成功响应（"哪个快用哪个"）
  const urls = apiSearchUrls(topic, q, page, sources);
  const r = await raceFetchAny(urls, { headers: { Accept: 'application/vnd.github+json' } });
  if (!r.ok) return { ok: false, error: r.error || '网络请求失败' };
  let json;
  try { json = JSON.parse(r.text); } catch (e) { return { ok: false, error: '响应不是合法 JSON' }; }
  if (!json || !Array.isArray(json.items)) return { ok: false, error: (json && json.message) || '响应结构异常' };
  const items = json.items.filter((it) => it && it.fork !== true);
  return {
    ok: true,
    total: json.total_count || items.length,
    url: r.url,
    fetchedVia: hostOf(r.url),
    items: items.map((it) => ({
      repo: it.full_name,
      // H-10（v5 阶段 4）：ref 过 validateSourceRef（允许合法 /，拒 .. / 纯点 / 控制字符）
      ref: validateSourceRef(it.default_branch || 'main') ? (it.default_branch || 'main') : 'main',
      name: it.name,
      author: it.owner && it.owner.login,
      stars: it.stargazers_count || 0,
      forks: it.forks_count || 0,
      license: it.license && it.license.spdx_id,
      description: it.description || '',
      topics: it.topics || [],
      updatedAt: it.updated_at
    }))
  };
}

// 并发受限地拉取前 N 个仓库的详情
/* ---- 5. 市场加载：搜索 → 并发详情 → 分页去重 → 缓存 ---- */
async function loadMarket(params) {
  const topic = sanitizeTopic(params && params.topic !== undefined ? params.topic : marketTopic);
  // 审计修复：非法 topic 显式报错（与后端 sanitizeTopic 一致），不再静默回退默认标签
  if (topic === null) {
    marketError = '标签只能包含字母数字 . _ -（每个最长 32 字符，最多 4 个，逗号/空格分隔）';
    renderMarket();
    return { ok: false, error: marketError };
  }
  const q = (params && params.q) || marketQuery || '';
  const page = (params && params.page) || 1;
  const sources = (params && params.sources) || marketSources || null;
  const refresh = Boolean(params && params.refresh);
  marketTopic = topic || MARKET_DEFAULT_TOPIC;
  marketQuery = q;
  marketSources = sources;
  marketPage = page;
  marketLoading = true;
  marketAppending = page > 1; // 加载更多时不清空已有卡片
  marketError = '';

  // 缓存：仅第一页可命中（TTL 内）；加载更多（page>1）与 refresh 都绕过缓存直接抓取
  const cacheKey = marketCacheKey();
  if (!refresh && page === 1) {
    try {
      const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
      const fresh = cached && cached.entries && cached.entries.length
        && cached.cachedAt && (Date.now() - Date.parse(cached.cachedAt)) < MARKET_CACHE_TTL_MS;
      if (fresh) {
        marketData = cached.entries;
        marketTotal = cached.total || marketData.length;
        marketCachedAt = cached.cachedAt || '';
        marketFetchedVia = cached.fetchedVia || '';
        marketLastPageItems = cached.entries.length;
        marketLoading = false;
        renderMarket();
        return { ok: true, cached: true, entries: marketData, total: marketTotal, sources, cachedAt: marketCachedAt, fetchedVia: marketFetchedVia };
      }
      // 过期缓存直接清除（不占配额）
      if (cached) { try { localStorage.removeItem(cacheKey); } catch (_) { /* 尽力而为 */ } }
    } catch (e) { /* 缓存读取失败忽略 */ }
  }

  renderMarket(); // 立即展示 loading
  const search = await searchMarketRepos(marketTopic, q, page, sources);
  if (!search.ok) {
    marketLoading = false;
    marketAppending = false;
    marketError = '抓取失败：' + search.error + '。已回退到内置示例目录。';
    renderMarket();
    return { ok: false, error: search.error };
  }

  // 分页去重：只抓取尚未加载的仓库，已加载的不再重复抓取
  // 第 1 页必须从空集开始去重，否则“刷新”时旧数据会把本次结果全部判为已加载，列表被清空
  const loadedRepos = new Set((page === 1 ? [] : marketData).map((e) => e.repo));
  const metas = search.items.filter((m) => !loadedRepos.has(m.repo));
  marketLastPageItems = search.items.length;

  // 立即渲染元数据卡片（详情占位），不等待详情返回
  const metaEntries = metas.map(metaEntry);
  marketData = page === 1 ? metaEntries : [...marketData, ...metaEntries];
  marketTotal = search.total;
  marketFetchedVia = search.fetchedVia || '';
  marketLoading = false;
  marketAppending = false;
  renderMarket(); // 列表已展示

  // 并发抓详情：谁先返回谁先填入对应卡片，不等待其余
  let idx = 0;
  const worker = async () => {
    while (idx < metas.length) {
      const m = metas[idx++];
      try {
        const entry = await fetchRepoDetail(m.repo, m.ref, m, sources);
        const i = marketData.findIndex((e) => e.repo === m.repo);
        if (i >= 0) marketData[i] = { ...marketData[i], ...entry, detailPending: false };
        patchMarketCard(marketData[i]);
      } catch (e) { /* 单条详情失败：保留列表占位，不阻塞其他 */ }
    }
  };
  const workers = [];
  for (let i = 0; i < Math.min(MARKET_DETAIL_CONCURRENCY, metas.length || 1); i++) workers.push(worker());
  Promise.all(workers).then(() => {
    if (page === 1) {
      marketCachedAt = new Date().toISOString(); // 本次会话状态行立即显示缓存时间
      marketCacheWrite(cacheKey, { topic: marketTopic, sources, entries: marketData, total: search.total, cachedAt: marketCachedAt, fetchedVia: marketFetchedVia });
      renderMarket();
    }
  });
  return { ok: true, cached: false, entries: marketData, total: search.total, sources, cachedAt: null, fetchedVia: marketFetchedVia };
}

// 搜索（refresh:false 命中 TTL 缓存秒回）/ 刷新（refresh:true 强制重抓）/ 加载更多（翻页）
function doMarketSearch() { currentView = 'market'; marketPage = 1; loadMarket({ topic: marketTopic, q: marketQuery, page: 1, sources: marketSources, refresh: false }); }
function doMarketRefresh() { currentView = 'market'; marketPage = 1; loadMarket({ topic: marketTopic, q: marketQuery, page: 1, sources: marketSources, refresh: true }); }
function doMarketMore() { currentView = 'market'; marketPage += 1; loadMarket({ topic: marketTopic, q: marketQuery, page: marketPage, sources: marketSources, refresh: true }); }

// 多选标签筛选：空数组=全部；否则命中任一选中标签即通过
function matchFilters(tags) {
  if (!marketFilters.length) return true;
  const set = tags || [];
  return marketFilters.some((f) => set.includes(f));
}

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2600);
}

function download(filename, text, mime = 'application/json') {
  const blob = new Blob([text], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 800);
}

function showDialog(title, bodyHtml, onOk, okLabel = '确认') {
  $('dlgTitle').textContent = title;
  $('dlgBody').innerHTML = bodyHtml;
  $('dlgOk').textContent = okLabel;
  dlgAction = onOk;
  $('dlgBackdrop').classList.add('show');
}
function hideDialog() {
  $('dlgBackdrop').classList.remove('show');
  dlgAction = null;
}
$('dlgCancel').addEventListener('click', hideDialog);
$('dlgOk').addEventListener('click', () => {
  const fn = dlgAction;
  hideDialog();
  if (fn) fn();
});
$('dlgBackdrop').addEventListener('click', (e) => { if (e.target === $('dlgBackdrop')) hideDialog(); });

/* ===== 顶部横排主导航（v3 · PCL 启动器风）：标题栏下方一排横向菜单项，当前项高亮 ===== */

/** 各视图的角标数据：统一来源（外壳注入的 window.__xxxData 优先，本地 state 兜底）。 */
function navCounts(id) {
  if (id === 'hub') return { n: state.installed.length };
  if (id === 'memory') return { n: (window.__memoryData || state.memories || []).length };
  if (id === 'skills') return { n: (window.__skillsData || state.skills || []).length };
  if (id === 'mcp') return { n: (window.__mcpsData || state.mcps || []).length };
  if (id === 'plugins') {
    const rows = pluginRows();
    return { n: rows.length, upd: rows.filter((r) => r.hasUpdate).length };
  }
  return {};
}

/** 渲染顶部横排菜单：9 视图项横排，当前项高亮，插件管理带更新角标。 */
function renderMainNav() {
  const nav = $('mainNav');
  if (!nav) return;
  nav.innerHTML = NAV.map((n) => {
    const c = navCounts(n.id);
    const countHtml = c.upd
      ? `<span class="n-count upd">${c.upd}</span>`
      : (c.n !== undefined ? `<span class="n-count">${c.n}</span>` : '');
    return `
      <button class="nav-item ${n.id === currentView ? 'active' : ''}" data-view="${n.id}" role="menuitem">
        ${ICONS[n.icon]}<span>${esc(n.label)}</span>${countHtml}
      </button>`;
  }).join('');
  nav.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => switchView(b.dataset.view)));
}

/* ===== 插件数据契约（v1.1）=====
 * pluginRows()          —— 插件行统一入口（WebView 用 __pluginsData，浏览器用 state.plugins）
 * postPluginOp(msg)     —— 插件变更类命令统一出口：置 pluginChangePending 后发消息；
 *                           外壳完成操作回推 __setPlugins → 页面钩子 __onPluginsData 触发重启提示
 * maybePromptDshRestart —— Skill/MCP 走 DSH 热加载无需重启；插件增删/启停/更新需重启 DSH（二次确认）
 */
function pluginRows() {
  return (window.chrome && window.chrome.webview) ? (window.__pluginsData || []) : (state.plugins || []);
}
let pluginChangePending = false;
function postPluginOp(msg) {
  pluginChangePending = true;
  if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(msg);
}
window.__onPluginsData = function () {
  if (currentView === 'home') renderHome();       // 主页更新面板刷新
  renderMainNav();                                  // 「插件管理」角标刷新
  if (pluginChangePending) {
    pluginChangePending = false;
    maybePromptDshRestart();
  }
};
function maybePromptDshRestart() {
  showDialog('插件已更改 · 需重启 DSH',
    `<div class="body">检测到插件发生了更改。<br>若 <b>DSH 程序</b>正在运行，需要重启后才能生效（Skill / MCP 修改由 DSH 热加载，不受影响）。</div>
     <div class="body" style="margin-top:6px">是否立即重启 DSH 程序？</div>`,
    () => {
      showDialog('二次确认',
        `<div class="body">重启会中断当前 DSH 会话，未保存的对话内容可能丢失。<br>确定要立即重启 DSH 吗？</div>`,
        () => {
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage('restartHarness');
            toast('正在重启 DSH…');
          } else {
            toast('请在 Dseam世界 桌面端重启 DSH');
          }
        }, '确认重启');

}

function switchView(id) {
  // v1.2：AI 装配间住在左侧女仆坞（仅主页）；从其他视图进入时先回主页再展开
  if (id === 'ai') {
    if (currentView !== 'home') switchView('home');
    openMaidDock(true);
    return;
  }
  currentView = id;
  state.currentView = id;
  save();
  // view-ai 归女仆坞管（openMaidDock 控制显隐），主区视图循环跳过它
  document.querySelectorAll('.view').forEach((v) => { if (v.id !== 'view-ai') v.classList.add('hidden'); });
  $('view-' + id).classList.remove('hidden');

  const dock = $('maidDock');
  if (dock) dock.classList.toggle('hidden', id !== 'home');
  renderShell(); renderCurrent();
  window.scrollTo(0, 0);
}

function renderCurrent() {
  if (currentView === 'home') renderHome();

  if (currentView === 'check') renderCheck();
    if (currentView === 'skills') renderSkills();

}

function themeVarsOf(skinId) {
  if (!skinId || skinId === 'default') return null;
  const preset = THEME_PRESETS.find((p) => p.id === skinId);
  if (preset) return preset.vars || null;
  if (skinId.startsWith('custom:')) {
    const name = skinId.slice(7);
    const sk = state.theme.skins.find((s) => s.name === name);
    return sk ? sk.vars : null;
  }
  return null;
}

let themeDraft = null;
let themeDraftName = '';

function applyThemeVars(vars) {
  const root = document.documentElement;
  if (window.__themeInjected) {
    window.__themeInjected.forEach((k) => root.style.removeProperty(k));
  }
  window.__themeInjected = [];
  if (!vars) return;
  Object.entries(vars).forEach(([k, v]) => {
    root.style.setProperty(k, v);
    window.__themeInjected.push(k);
  });
}

function applyTheme() {
  applyThemeVars(themeVarsOf(state.theme.activeSkin));
  // 主题切换后同步窗体背景色（消除四周 6px 白边框）
  if (window.chrome && window.chrome.webview) {
    try {
      window.chrome.webview.postMessage('themeBg:' + getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());
    } catch (e) { /* 忽略 */ }
  }
}

function currentDraftVars() {
  if (themeDraft === null) {
    themeDraft = Object.assign({}, themeVarsOf(state.theme.activeSkin) || {});
  }
  return themeDraft;
}

function displayVars() {
  if (themeDraft !== null) return themeDraft;
  return themeVarsOf(state.theme.activeSkin) || {};
}

function parseSizeVal(v) {
  const m = String(v).match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : 0;
}

function cssVarDefault(k) {
  return getComputedStyle(document.documentElement).getPropertyValue(k).trim();
}

function renderTheme() {
  const view = $('view-theme');
  const active = state.theme.activeSkin;
  const presetCards = THEME_PRESETS.map((p) => `
    <div class="skin-card ${active === p.id ? 'active' : ''}" data-skin="${p.id}">
      <div class="skin-swatch">${p.swatch.map((c) => `<i style="background:${c}"></i>`).join('')}</div>
      <div class="skin-name"><span>${esc(p.name)}</span>${p.id === 'default' ? '<span class="dot">原始</span>' : ''}</div>
    </div>`).join('');
  const customCards = state.theme.skins.map((s) => {
    const sid = 'custom:' + s.name;
    const sw = [s.vars['--bg'] || '#fff', s.vars['--panel'] || '#fff', s.vars['--teal'] || '#43a047'];
    return `
    <div class="skin-card ${active === sid ? 'active' : ''}" data-skin="${esc(sid)}">
      <div class="skin-swatch">${sw.map((c) => `<i style="background:${c}"></i>`).join('')}</div>
      <div class="skin-name"><span>${esc(s.name)}</span><span class="dot">自定义</span></div>
      <button class="btn sm danger" data-del="${esc(sid)}" title="删除皮肤" style="margin-top:6px;width:100%">删除</button>
    </div>`;
  }).join('');
  const isDirty = themeDraft !== null;
  const draft = displayVars();
  const colorRows = THEME_VARS.filter((v) => v.type === 'color').map((v) => {
    const cur = draft[v.key] !== undefined ? draft[v.key] : cssVarDefault(v.key);
    return `
    <div class="var-item">
      <label>${esc(v.label)}</label>
      <div class="color-field">
        <input type="color" data-var="${v.key}" value="${esc(cur)}">
        <input type="text" data-var-text="${v.key}" value="${esc(cur)}" spellcheck="false">
      </div>
    </div>`;
  }).join('');
  const sizeRows = THEME_VARS.filter((v) => v.type === 'size').map((v) => {
    const raw = draft[v.key] !== undefined ? draft[v.key] : cssVarDefault(v.key);
    const val = parseSizeVal(raw);
    return `
    <div class="var-item">
      <label>${esc(v.label)}<span style="opacity:.7">${val}${v.unit}</span></label>
      <input type="range" min="${v.min}" max="${v.max}" step="1" value="${val}" data-range="${v.key}">
    </div>`;
  }).join('');
  const fontRows = THEME_VARS.filter((v) => v.type === 'font').map((v) => {
    const cur = draft[v.key] !== undefined ? draft[v.key] : cssVarDefault(v.key);
    return `
    <div class="var-item">
      <label>${esc(v.label)}</label>
      <input type="text" data-var-text="${v.key}" value="${esc(cur)}" spellcheck="false">
    </div>`;
  }).join('');
  view.innerHTML = `
    <div class="theme-sect">
      <div class="section-head">
        <div>
          <h2>换肤</h2>
          <div class="sub">选择预设皮肤，或自定义后命名保存为专属皮肤</div>
        </div>
      </div>
      <div class="theme-grid" id="skinGrid">${presetCards}${customCards}</div>
    </div>
    <div class="theme-sect">
      <div class="section-head">
        <h3>自定义皮肤</h3>
        <div class="sub">调整下方变量后，命名并保存，即可在换肤区一键切换</div>
      </div>
      <div class="skin-row">
        <input type="text" id="skinName" placeholder="皮肤名称，例如：我的深色" maxlength="30" value="${esc(themeDraftName)}">
        <button class="btn primary" id="saveSkinBtn">${ICONS.plus} 保存为皮肤</button>
        <button class="btn" id="resetThemeBtn">${ICONS.refresh} 还原默认</button>
      </div>
    </div>
    <div class="theme-sect">
      <div class="section-head"><h3>颜色</h3><div class="sub">实时预览</div></div>
      <div class="var-grid">${colorRows}</div>
    </div>
    <div class="theme-sect">
      <div class="section-head"><h3>布局与尺寸</h3><div class="sub">圆角 / 字号 / 侧栏宽度</div></div>
      <div class="var-grid">${sizeRows}</div>
    </div>
    <div class="theme-sect">
      <div class="section-head"><h3>字体</h3></div>
      <div class="var-grid">${fontRows}</div>
    </div>
    ${isDirty ? '<div class="theme-reset">当前有未保存的修改（预览中）</div>' : ''}
  `;
  view.querySelectorAll('#skinGrid .skin-card').forEach((c) => c.addEventListener('click', () => {
    const sid = c.dataset.skin;
    state.theme.activeSkin = sid;
    themeDraft = null; themeDraftName = '';
    save(); applyTheme(); renderShell(); renderTheme();
    toast('已切换皮肤');
  }));
  view.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const sid = b.dataset.del;
    const name = sid.slice(7);
    state.theme.skins = state.theme.skins.filter((s) => s.name !== name);
    if (state.theme.activeSkin === sid) state.theme.activeSkin = 'default';
    themeDraft = null; themeDraftName = '';
    save(); applyTheme(); renderShell(); renderTheme();
    toast('已删除皮肤「' + name + '」');
  }));
  view.querySelectorAll('input[type="color"]').forEach((inp) => inp.addEventListener('input', () => {
    const k = inp.dataset.var;
    currentDraftVars()[k] = inp.value;
    applyThemeVars(currentDraftVars());
    const txt = view.querySelector(`[data-var-text="${k}"]`);
    if (txt) txt.value = inp.value;
  }));
  view.querySelectorAll('input[data-var-text]').forEach((inp) => inp.addEventListener('input', () => {
    const k = inp.dataset.varText;
    currentDraftVars()[k] = inp.value.trim();
    applyThemeVars(currentDraftVars());
    const color = view.querySelector(`[data-var="${k}"]`);
    if (color && /^#[0-9a-fA-F]{6}$/.test(inp.value.trim())) color.value = inp.value.trim();
  }));
  view.querySelectorAll('input[data-range]').forEach((inp) => inp.addEventListener('input', () => {
    const k = inp.dataset.range;
    const v = THEME_VARS.find((x) => x.key === k);
    currentDraftVars()[k] = inp.value + v.unit;
    applyThemeVars(currentDraftVars());
    const label = inp.closest('.var-item').querySelector('label span');
    if (label) label.textContent = inp.value + v.unit;
  }));
  const saveBtn = $('saveSkinBtn');
  if (saveBtn) saveBtn.addEventListener('click', () => {
    const name = ($('skinName').value || '').trim();
    if (!name) { toast('请输入皮肤名称'); return; }
    const vars = Object.assign({}, currentDraftVars());
    const existing = state.theme.skins.find((s) => s.name === name);
    if (existing) existing.vars = vars; else state.theme.skins.push({ name, vars });
    state.theme.activeSkin = 'custom:' + name;
    themeDraft = null; themeDraftName = '';
    save(); renderTheme();
    toast('已保存皮肤「' + name + '」');
  });
  const resetBtn = $('resetThemeBtn');
  if (resetBtn) resetBtn.addEventListener('click', () => {
    state.theme.activeSkin = 'default';
    themeDraft = null; themeDraftName = '';
    save(); applyTheme(); renderShell(); renderTheme();
    toast('已还原默认主题');
  });
}

/** 一键更新（v1.1）：确认清单后发 updateAllPlugins；结果由 __setPlugins 回推刷新。 */
function homeUpdateAll() {
  const targets = pluginRows().filter((r) => r.hasUpdate);
  if (!targets.length) { toast('没有需要更新的插件'); return; }
  showDialog('一键更新 ' + targets.length + ' 个插件',
    `<div class="body">将依次更新：${targets.map((t) => `<code>${esc(t.id)}</code>`).join('、')}<br>全部更新完成后需要重启 DSH 生效。</div>`,
    () => {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage('updateAllPlugins');
        pluginChangePending = true; // 更新属于插件变更：完成后同样进入重启提示流
        toast('正在依次更新 ' + targets.length + ' 个插件，可能需要几分钟…');

/* ---- 6. 市场渲染层：卡片与页面 ---- */
function installedPluginNames() {
  var out = {};
  var rows = (window.__pluginsData && window.__pluginsData.length ? window.__pluginsData : (state.plugins || []));
  rows.forEach(function (r) {
    if (!r) return;
    if (r.id) out[String(r.id).toLowerCase()] = true;
    if (r.name) out[String(r.name).toLowerCase()] = true;
  });
  return out;
}

// 已安装判定候选：npmName / 显示名 / manifest 插件名 / 仓库短名 / 仓库全名 +
// 从插件行 spec 提取的 codeload/github URL 里的仓库路径（URL 安装的权威比对通道）。
function marketEntryInstalled(e) {
  if (!e) return false;
  var rows = (window.__pluginsData && window.__pluginsData.length ? window.__pluginsData : (state.plugins || []));
  var repo = String(e.repo || '').toLowerCase();
  var repoShort = repo.split('/')[1] || '';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (!r) continue;
    var names = [r.id, r.name].map(function (x) { return x ? String(x).toLowerCase() : ''; }).filter(Boolean);
    if (repoShort && names.indexOf(repoShort) >= 0) return true;
    // spec 形如 https://codeload.github.com/<owner>/<repo>/tar.gz/refs/<ref>：
    // 含本仓库路径 → 同一仓库已按 URL 安装（审计修复：包名与仓库名不一致时此前恒 miss，
    // 同一仓库可被重复「安装」且按钮永不显示已安装）。
    var spec = r.spec ? String(r.spec).toLowerCase() : '';
    if (repo && spec.indexOf('codeload.github.com/' + repo + '/') >= 0) return true;
    if (repo && (spec === 'github:' + repo || spec === 'github:' + repo + '#main')) return true;
  }
  var names2 = installedPluginNames();
  var cands = [];
  if (e.npmName) cands.push(e.npmName);
  if (e.name) cands.push(e.name);
  var m = e.manifest || {};
  (m.plugins || []).forEach(function (p) { if (p && p.name) cands.push(p.name); });
  return cands.some(function (c) { return names2[String(c).toLowerCase()] === true; });
}

// codeload tarball URL：ref 为版本号形态走 tags/，否则走 heads/（default_branch 恒为分支）。
// 审计修复（审查轮 P1）：此前 `/tar.gz/refs/<ref>` 缺 heads|tags 段，codeload 实测 404
// （正确形态见 Main.cs EnsureDshHub 的 refs/heads/main 与后端 ensure.js githubZipUrls
// 的 heads/tags 双形态）——github 源安装全部失败的根因。
function codeloadTarUrl(repo, ref) {
  const r = ref || 'main';
  const kind = /^v?\d+\.\d+/.test(r) ? 'tags' : 'heads';
  return 'https://codeload.github.com/' + repo + '/tar.gz/refs/' + kind + '/' + r;
}

// 安装 spec 生成：manifest 源优先（github tarball / npm 精确版本），npmName 兜底。
// 审计修复：此前 npmName 优先——npmName 只是仓库 package.json 的 name（可能未发布到
// npm 或被第三方抢注同名包），按 npm spec 安装会拉到错误/恶意包；manifest 的
// source 才是市场详情生成的精确安装源。
function marketInstallSpec(e) {
  var m = e.manifest || {};
  var plugins = Array.isArray(m.plugins) ? m.plugins : [];
  for (var i = 0; i < plugins.length; i++) {
    var p = plugins[i] || {};
    var src = p.source || {};
    if (src.type === "github" && src.repo) {
      return codeloadTarUrl(src.repo, src.ref || e.ref);
    }
    if (src.type === "npm" && p.name) {
      return p.version && p.version !== "latest" ? p.name + "@" + p.version : p.name;
    }
    if (p.name && !src.type) return p.name;
  }
  if (e.repo) return codeloadTarUrl(e.repo, e.ref);
  if (e.npmName) return e.version ? e.npmName + "@" + e.version : e.npmName;
  return "";
}
function renderMarketCard(e) {
  const accent = 'var(--teal)';
  const letter = (e.name || e.repo).trim().slice(0, 1);
  const pending = e.detailPending === true;
  const metaBits = [];
  metaBits.push(e.author || '—');
  metaBits.push('⭐ ' + (e.stars || 0));
  if (e.version) metaBits.push('v' + e.version);
  if (e.license) metaBits.push(e.license);
  const installed = marketEntryInstalled(e);
  const hasPackBadge = installed
    ? '<span class="badge ok">已安装</span>'
    : (pending
    ? '<span class="badge neutral">加载中</span>'
    : (e.hasPack ? '<span class="badge ok">内置清单</span>' : '<span class="badge neutral">单插件</span>'));
  const installBtn = pending
    ? `<button class="btn sm" disabled>${ICONS.plus} 详情加载中…</button>`
    : (installed
      ? `<span class="badge ok">${ICONS.check} 已安装</span>`
      : (e.importable
      ? `<button class="btn sm primary" data-mkt-install="${esc(e.repo)}">${ICONS.plus} 安装</button>`
      : `<button class="btn sm" disabled title="${esc(e.importError || '无法生成导入包')}">${ICONS.plus} 不可导入</button>`));
  const installHtml = e.install
    ? `<details class="mkt-details"><summary>安装方法</summary><pre class="mkt-pre">${esc(e.install)}</pre></details>`
    : '';
  return `
    <div class="pack" data-repo="${esc(e.repo)}">
      <div class="pack-top">
        <div class="pack-icon" style="background:${accent}">${esc(letter)}</div>
        <div class="pack-title">
          <h3>${esc(e.name || e.repo)}</h3>
          <div class="meta">${metaBits.join(' · ')}</div>
        </div>
        ${hasPackBadge}
      </div>
      ${(e.topics || []).length ? `<div class="tags">${e.topics.slice(0, 6).map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
      <div class="mkt-desc">${esc(pending ? '详情加载中…' : (e.intro || e.description || '暂无简介'))}</div>

      <div class="pack-foot">

        <div class="spacer"></div>
        ${installBtn}
      </div>
    </div>`;
}

  $('marketSearch').addEventListener('input', (e) => { marketQuery = e.target.value; });

    else { marketFilters = marketFilters.includes(v) ? marketFilters.filter((x) => x !== v) : marketFilters.concat(v); }
    renderMarket();
  }));
  document.querySelectorAll('[data-mkt-install]').forEach((b) => b.addEventListener('click', () => installMarketEntry(b.dataset.mktInstall)));
}

/** 连接测试：standalone 直接 fetch 最小请求；EXE 经外壳 aiTest 消息（结果由 __aiTestResult 回传）。 */
async function aiTestConnection() {
  const preset = AI_PRESETS[aiProviderSel] || AI_PRESETS.deepseek;
  const baseURL = aiBaseUrlMem.trim() || preset.baseURL;
  const model = aiModelMem.trim() || preset.model;
  const apiKey = aiKeyMem.trim();
  const btn = $('aiTestBtn');
  if (btn) btn.disabled = true;
  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.postMessage('aiTest:' + JSON.stringify({ model, apiKey, baseURL }));
    return; // 结果经 __aiTestResult 回传（外壳用页面 Key/端点，未填时以外壳配置兜底）
  }
  if (!apiKey) { toast('未填写 API Key：无法测试（本地模拟不需要端点）'); if (btn) btn.disabled = false; return; }
  if (!/^https:\/\//i.test(baseURL)) { toast('Base URL 必须以 https:// 开头（TLS 铁律）'); if (btn) btn.disabled = false; return; }
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    let res;
    try {
      res = await fetch(baseURL.replace(/\/+$/, '') + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
        body: JSON.stringify({ model, messages: [{ role: 'user', content: 'ping' }], max_tokens: 8, temperature: 0 }),
        signal: ctrl.signal
      });
    } finally { clearTimeout(timer); }
    if (res.ok) toast('✓ 连接成功：' + model);
    else {
      const t = (await res.text()).slice(0, 160).split(apiKey).join('***');
      toast('连接失败 HTTP ' + res.status + '：' + t);
    }
  } catch (e) {
    toast('连接失败：' + String((e && e.message) || e));
  }
  if (btn) btn.disabled = false;
}
/** EXE 外壳测试结果回传（true=成功）。 */
window.__aiTestResult = (ok, msg) => {
  const btn = $('aiTestBtn');
  if (btn) btn.disabled = false;
  toast(ok ? ('✓ 连接成功' + (msg ? '：' + msg : '')) : ('连接失败：' + (msg || '请检查配置')));
};

/** 助理文本轻渲染：先 esc 再处理（代码围栏 > 行内代码 > 加粗 > 标题加粗；链接剥为纯文本）。
 *  顺序保证安全：<>& 已转义后匹配 "**" 不会产生新标签；围栏内容整体转义，绝不当 HTML。 */
function fmtAiText(text) {
  const blocks = [];
  let s = String(text == null ? '' : text)
    .replace(/```([\s\S]*?)```/g, (m, code) => {
      blocks.push(code);
      return '\u0000FB' + (blocks.length - 1) + '\u0000';
    });
  s = esc(s)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/^\|[\s:|-]+\|\s*$/gm, '') // 表格分隔行（|---|）降级丢弃
    .replace(/^\|(.+)\|\s*$/gm, (m, inner) => inner.split('|').map((x) => x.trim()).filter(Boolean).join(' · ')) // 表格行 → 纯文本
    .replace(/^#{1,3} (.+)$/gm, '<b>$1</b>');
  return s.replace(/\u0000FB(\d+)\u0000/g, (m, i) => '<pre><code>' + esc(blocks[+i]) + '</code></pre>');
}

/** 消息气泡 + 产物卡片 HTML（头像按每条消息的发信人设渲染：历史消息不随当前人设漂移）。 */
function msgHtml(m, persona) {
  if (m.role === 'user') {
    return `<div class="ai-msg user"><div class="ai-avatar">您</div><div class="ai-bubble">${esc(m.text)}</div></div>`;
  }
  const content = m.text;
  const packCard = m.pack ? packCardHtml(m.pack, m.diff, m.uid) : '';
  const av = m.error ? '!' : personaBadge(m.persona || persona);
  return `<div class="ai-msg assistant${m.error ? ' err' : ''}"${m.error ? ' role="alert"' : ''}><div class="ai-avatar${m.error ? ' av-err' : ''}">${av}</div><div class="ai-bubble">${fmtAiText(content)}</div></div>${packCard}`;
}

/** 产物卡片（频道内嵌：包名 + 插件清单 + diff 徽标 + 操作；data-pid 绑定消息 uid——按钮读自己的卡，刷新/多卡不错位）。 */
function packCardHtml(pack, diff, uid) {
  const d = diff || { added: [], removed: [], changed: [] };
  const diffHtml = (d.added.length + d.removed.length + d.changed.length) > 0
    ? `<div class="ai-diff">${d.added.length ? `<b class="add">+ 新增 ${d.added.length}</b>` : ''}${d.removed.length ? `<b class="del">- 移除 ${d.removed.length}</b>` : ''}${d.changed.length ? `<b class="chg">~ 调整 ${d.changed.length}</b>` : ''}</div>`
    : '';
  const plugs = (pack.plugins || []).map((p) => `<div class="p"><span class="dot"></span><span class="pn">${esc(p.name)}@${esc(p.version)}</span><span class="pv">${esc(p.id)}</span></div>`).join('');
  return `<div class="ai-pack-card" data-pid="${esc(uid || '')}">
    <div class="head"><span class="pack-mark">包</span><span class="name">${esc(pack.name)}</span><span class="meta">${(pack.plugins || []).length} 个插件 ${diffHtml}</span></div>
    <div class="ai-plugins">${plugs}</div>
    <div class="acts">
      <button class="btn primary sm ai-act-import">一键导入</button>
      <button class="btn sm ai-act-copy-manifest">复制 JSON</button>
      <button class="btn sm ai-act-copy-readme">复制 README</button>
      <button class="btn sm ai-act-export">导出到桌面</button>
    </div>
  </div>`;
}

function keywordHits(text) {
  const t = text.toLowerCase();
  const hits = [];
  const map = [
    ['文献', 'research'], ['论文', 'research'], ['科研', 'research'], ['引用', 'research'], ['综述', 'research'],
    ['视频', 'video'], ['剪辑', 'video'], ['字幕', 'video'], ['分镜', 'video'], ['封面', 'video'],
    ['自媒体', 'social'], ['选题', 'social'], ['文案', 'social'], ['热点', 'social'],
    ['考研', 'kaoyan'], ['背诵', 'kaoyan'], ['闪卡', 'kaoyan'], ['真题', 'kaoyan'], ['语法', 'kaoyan'],
    ['开发', 'fullstack'], ['代码', 'fullstack'], ['测试', 'fullstack'], ['部署', 'fullstack'], ['全栈', 'fullstack'],
    ['笔记', 'notes'], ['知识库', 'notes'], ['书摘', 'notes'], ['收藏', 'notes']
  ];
  for (const [kw, id] of map) if (t.includes(kw.toLowerCase())) hits.push(id);
  return [...new Set(hits)];
}

/** 从 LLM 响应提取 JSON（容忍 ```json 代码围栏与说明文字）。 */
function extractJson(text) {
  if (typeof text !== 'string' || text.trim() === '') return null;
  let t = text.trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fence) t = fence[1].trim();
  try {
    return JSON.parse(t);
  } catch {
    const start = t.indexOf('{');
    const end = t.lastIndexOf('}');
    if (start >= 0 && end > start) {
      try { return JSON.parse(t.slice(start, end + 1)); } catch { /* 落空 */ }
    }
  }
  return null;
}

/** hotpack 1.0 → dshpack manifest（导入/导出所用形态）。 */
function toDshpack(hp) {
  return {
    packId: hp.id,
    name: hp.name,
    version: hp.version,
    description: hp.description || '',
    tags: hp.tags || [],
    scene: (hp.id || 'custom').replace(/^pack\.ai\./, '').slice(0, 40) || 'custom',
    bundles: (hp.plugins || []).map((p) => ({
      name: p.name,
      version: p.version,
      role: p.id || '工具',
      ...(p.source && p.source.type !== 'npm' ? { source: p.source } : {})
    })),
    conflicts: [],
    memory: [],
    market: { author: 'AI Pack Assembler', license: 'MIT', stars: 0, generatedBy: 'dsh-pack-hub prototype' }
  };
}

/** 轮次开始（原型与 EXE 注入共用：会话续接/按钮锁定/欢迎卡移除/typing/清空输入一条龙）。 */
function beginTurn(text, persona) {
  if (!aiSession) aiSession = { id: 'ai-' + Date.now().toString(36), persona, messages: [], pack: null };
  else aiSession.persona = persona;
  aiSession.messages.push({ role: 'user', content: text });
  aiMessages.push({ role: 'user', text });
  const wl = document.querySelector('.ai-welcome');
  if (wl) wl.remove();
  const ph = $('reqInput');
  if (ph) ph.placeholder = '继续说…（Enter 发送，Shift+Enter 换行）';
  appendMsgEl({ role: 'user', text }, persona);
  aiRunning = true;
  const sb = $('composeBtn'); if (sb) sb.disabled = true;
  const nsb = $('aiNewSessionBtn'); if (nsb) nsb.disabled = true;
  showTyping();
}
/** 轮次结束状态恢复（发送/新会话解锁、轮次徽标、持久化、回焦输入框）。 */
function endTurnState() {
  aiRunning = false;
  const sb = $('composeBtn'); if (sb) sb.disabled = false;
  const nsb = $('aiNewSessionBtn'); if (nsb) nsb.disabled = false;
  const psel = $('aiPersona'); if (psel) psel.disabled = false; // 轮次中 renderAi 可能把下拉带上 disabled
  const badge = $('aiTurnBadge');
  if (badge) badge.textContent = '第 ' + aiMessages.filter((m) => m.role === 'user').length + ' 轮';
  aiPersist();
  const inp = $('reqInput'); if (inp) inp.focus();
}
/** 成功轮：助手消息（可带产物）+ 状态恢复。result={manifest,readme} 随消息持久化（刷新后按钮仍可用）。 */
function finishAssistTurn(text, packHp, diff, persona, result) {
  hideTyping();
  aiSession.messages.push({ role: 'assistant', content: text });
  const msg = { role: 'assistant', text, persona, pack: packHp || null, diff: diff || null, uid: 'm' + (++msgSeq) };
  if (result) msg.result = result;
  aiMessages.push(msg);
  appendMsgEl(msg, persona);
  endTurnState();
}
/** 失败轮：错误气泡 + 状态恢复（不污染 LLM 会话上下文）。 */
function failAssistTurn(text, persona) {
  hideTyping();
  aiMessages.push({ role: 'assistant', text, persona, error: true, uid: 'm' + (++msgSeq) });
  appendMsgEl(aiMessages[aiMessages.length - 1], persona);
  endTurnState();
}

/** LLM 原文分类（对齐后端 aiChat 的三态判定；等价守卫属后端会话层逻辑，页面演示路径不重复实现）：
 *  'product'=过权威校验的清单；'chat'=对话轮纯文本；
 *  'invalid'=有 JSON 但校验失败 或 首轮无 JSON（可纠错重试的失败形态）。 */
function classifyAiRaw(content, isFirstTurn) {
  const manifest = extractJson(content);
  const hp = manifest ? parseHotpackJson(JSON.stringify(manifest)) : null;
  if (hp) return { status: 'product', manifest, hp };
  if (manifest || isFirstTurn) return { status: 'invalid', manifest };
  return { status: 'chat' };
}

/** LLM 原文 → 权威校验 → 产物/回复（原型与 EXE 注入共用同一套校验与话术）。 */
function processAiRaw(content, persona, isFirstTurn, input) {
  const box = $('logBox');
  const manifest = extractJson(content);
  const hp = manifest ? parseHotpackJson(JSON.stringify(manifest)) : null;
  if (hp) {
    const dsh = toDshpack(hp);
    const readme = aiReadme(dsh, input);
    const diff = diffHotpack(aiSession.pack, hp);
    aiSession.pack = hp;
    aiResult = { name: dsh.name, tags: dsh.tags, manifest: dsh, readme };
    logLine(box, isFirstTurn
      ? '[2/2] 校验通过，生成 pack + README…'
      : '产物已更新：新增 ' + diff.added.length + ' · 移除 ' + diff.removed.length + ' · 调整 ' + diff.changed.length, 'ok');
    finishAssistTurn(aiReaction(persona, dsh.name, dsh.bundles.length), hp, diff, persona, { manifest: dsh, readme });
    return;
  }
  const invalid = 'AI 产物未通过 hotpack 1.0 校验（plugins 必须非空）';
  if (manifest || isFirstTurn) {
    // 有 JSON 但校验失败（含对话轮"改清单失败"——不静默回退成闲聊）；首轮无 JSON 同样报错
    logLine(box, '失败：' + invalid, 'err');
    failAssistTurn(aiErrorText(persona, invalid, true), persona);
    return;
  }
  // 对话轮无产物：纯文本回复（LLM 自带人设语气）
  logLine(box, '对话回复（无产物变更）', 'ok');
  finishAssistTurn(content.trim(), null, null, persona);
}

async function compose() {
  const input = $('reqInput').value.trim();
  if (!input || aiRunning) return;
  const apiKey = aiKeyMem.trim();
  const providerId = aiProviderSel;
  const preset = AI_PRESETS[providerId] || AI_PRESETS.deepseek;
  const baseURL = aiBaseUrlMem.trim() || preset.baseURL;
  const model = aiModelMem.trim() || preset.model;
  const persona = ($('aiPersona').value || 'maid');
  const isFirstTurn = !aiSession || aiSession.messages.length === 0 || !aiSession.pack;
  beginTurn(input, persona);
  $('reqInput').value = '';
  $('reqInput').style.height = 'auto';
  const box = $('logBox');

  if (apiKey !== '') {
    // ---- 真实 LLM（首轮组装 / 对话轮，多厂商 OpenAI 兼容协议；人设注入） ----
    if (!/^https:\/\//i.test(baseURL)) {
      logLine(box, '失败：Base URL 必须 https://（TLS 铁律）', 'err');
      failAssistTurn(aiErrorText(persona, 'Base URL 必须 https:// 才能装配（TLS 铁律）', true), persona);
      return;
    }
    logLine(box, (isFirstTurn ? '[1/2] ' : '[1/1] ') + '调用 ' + (providerId === 'custom' ? baseURL : providerId) + ' 装配师（' + model + '，人设=' + persona + '）…', 'warn');
    try {
      const messages = [{ role: 'system', content: buildAiSystem(persona, isFirstTurn ? 'assembly' : 'chat') }];
      if (isFirstTurn) {
        messages.push({ role: 'user', content: '用户需求：' + input + '\n请输出对应的 hotpack 1.0 插件包清单 JSON。' });
      } else {
        for (const m of aiSession.messages.slice(0, -1)) messages.push({ role: m.role, content: m.content });
        const packCtx = aiSession.pack ? '当前已装配的 hotpack 1.0 清单：\n' + JSON.stringify(aiSession.pack) + '\n\n' : '';
        messages.push({ role: 'user', content: packCtx + '用户新指令：' + input + '\n（如需修改清单，输出完整新 JSON；否则正常对话回复）' });
      }
      // 产物校验失败 → 带纠错反馈重试一次（与后端 aiChat 对齐；盲重发对结构违规命中
      // 率低）。重试只改本次请求，不落会话历史。
      const chatOnce = async (msgs) => {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 90000);
        try {
          const res = await fetch(baseURL.replace(/\/+$/, '') + '/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
            body: JSON.stringify({
              model,
              messages: msgs,
              temperature: 0.8, // 与桌面端统一：0.8 更自然
              max_tokens: 4096,
              stream: false
            }),
            signal: ctrl.signal
          });
          if (!res.ok) {
            const body = (await res.text()).slice(0, 300).split(apiKey).join('***');
            throw new Error('AI 服务 HTTP ' + res.status + '：' + body);
          }
          const json = await res.json();
          const content = json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content;
          if (typeof content !== 'string' || content.trim() === '') throw new Error('AI 响应缺少内容');
          logLine(box, '  LLM 响应 ' + content.length + ' 字符（model=' + (json.model || model) + '）', 'ok');
          return content;
        } finally {
          clearTimeout(timer);
        }
      };
      let retryMessages = messages;
      for (let attempt = 0; ; attempt += 1) {
        const content = await chatOnce(retryMessages);
        const v = classifyAiRaw(content, isFirstTurn);
        if (v.status !== 'invalid' || attempt >= 1) {
          processAiRaw(content, persona, isFirstTurn, input);
          break;
        }
        const why = v.manifest
          ? '清单结构不符合 hotpack 1.0（plugins 1-5 个、插件 id/精确版本格式、id/name 去重、包版本 semver）'
          : '未输出 JSON 对象';
        logLine(box, '  产物未通过 hotpack 1.0 校验（' + why + '），带纠错反馈重试一次…', 'warn');
        retryMessages = [...messages,
          { role: 'assistant', content: Array.from(String(content)).slice(0, 500).join('') },
          { role: 'user', content: '上一次输出未通过 hotpack 1.0 校验：' + why + '。请严格按结构规则重新输出，只输出修正后的 JSON，不要任何解释文字。' }];
      }
    } catch (e) {
      logLine(box, '失败：' + String(e.message || e), 'err');
      failAssistTurn(aiErrorText(persona, String(e.message || e), true), persona);
    }
    return;
  }

  // ---- 本地模拟（无 Key；产物标注） ----
  if (!isFirstTurn) {
    logLine(box, '本地模拟模式不支持对话修改；配置 API Key 后可体验真实对话式装配', 'err');
    failAssistTurn(aiErrorText(persona, '本地模拟模式只能做首次装配～配置 API Key 后，小织才能陪您继续对话调整呢。', false), persona);
    return;
  }
  const rootPacks = CATALOG.filter((p) => keywordHits(input).includes(p.id.replace('pack-', '')));
  const steps = [
    ['拆解需求', `场景关键词：${keywordHits(input).join(', ') || '通用工具'}`],
    ['检索目录', `匹配 ${rootPacks.length} 个候选包（本地模拟，未配置 API Key）`],
    ['筛选版本', '过滤精确稳定版本、license 与维护状态'],
    ['冲突消解', '处理重复 role，生成冲突矩阵'],
    ['生成文件', '输出 pack manifest + README']
  ];
  let i = 0;
  const tick = () => {
    if (!aiRunning) return;
    if (i < steps.length) {
      logLine(box, `[${i + 1}/5] ${steps[i][0]}`, 'warn');
      logLine(box, '  ' + steps[i][1], 'ok');
      i++;
      setTimeout(tick, 420);
    } else {
      const picked = rootPacks.length ? rootPacks : [CATALOG[0]];
      const bundles = [];
      picked.forEach((p) => p.bundles.forEach((b) => { if (!bundles.some((x) => x.name === b.name)) bundles.push(b); }));
      // 与装配规则一致：合并去重后最多 5 个插件（此前双场景命中可产 7 个非法清单）
      if (bundles.length > 5) bundles.length = 5;
      const packId = 'pack.ai.' + Date.now().toString(36);
      const manifest = {
        packId,
        name: 'AI 定制' + picked.map((p) => p.name.replace('插座包', '')).join('·') + '插座包',
        version: '0.1.0',
        scene: picked[0].id.replace('pack-', '') || 'custom',
        tags: [...new Set(picked.flatMap((p) => p.tags))],
        requires: { dsh: state.dshVersion, node: '>=22.19.0', profile: 'desktop' },
        bundles,
        conflicts: [],
        memory: picked[0].memory || [],
        configDir: 'packs/' + packId,
        market: { author: 'AI Pack Assembler', license: 'MIT', stars: 0, generatedBy: 'dsh-pack-hub prototype（本地模拟）' }
      };
      const readme = [
        '# ' + manifest.name,
        '',
        '由 DSH AI 装配间（本地模拟，未配置 API Key）根据需求生成：' + input,
        '',
        '## Bundles',
        '',
        ...bundles.map((b) => '- `' + b.name + '@' + b.version + '` · ' + b.role),
        '',
        '## Memory',
        '',
        ...(manifest.memory || []).map((m) => '- ' + m),
        '',
        '## 安装',
        '',
        '1. 在 DSH 插件市场或插件中枢导入本包。',
        '2. 确认版本与冲突信息后安装。',
        '3. 重启 DSH 生效。'
      ].join('\n');
      const hp = {
        hotpack: '1.0',
        id: packId,
        name: manifest.name,
        version: '0.1.0',
        description: '',
        tags: manifest.tags,
        plugins: bundles.map((b) => ({ id: b.pid || b.role, name: b.name, version: b.version, source: { type: 'npm' }, config: {} }))
      };
      aiSession.pack = hp;
      aiResult = { name: manifest.name, tags: manifest.tags, manifest, readme };
      logLine(box, '完成：pack + README 已就绪（本地模拟）', 'ok');
      finishAssistTurn(aiReaction(persona, manifest.name, bundles.length), hp, diffHotpack(null, hp), persona, { manifest, readme });
    }
  };
  tick();
  return;
}

/** 新旧 hotpack 产物差异（按插件 id 匹配）。 */
function diffHotpack(oldHp, newHp) {
  const oldList = oldHp && oldHp.plugins ? oldHp.plugins : [];
  const newList = newHp && newHp.plugins ? newHp.plugins : [];
  const oldById = new Map(oldList.map((p) => [p.id, p]));
  const newById = new Map(newList.map((p) => [p.id, p]));
  const added = [];
  const removed = [];
  const changed = [];
  const kept = [];
  for (const p of newList) {
    const prev = oldById.get(p.id);
    if (!prev) { added.push(p); continue; }
    if (prev.name !== p.name || prev.version !== p.version) changed.push({ id: p.id, from: prev.version, to: p.version });
    else kept.push(p);
  }
  for (const p of oldList) if (!newById.has(p.id)) removed.push(p);
  return { added, removed, changed, kept };
}

function simulateConflicts(rows) {
  const out = [];
  const activeBundles = new Map();
  rows.filter((i) => i.active).forEach((row) => {
    const p = packOf(row.packId);
    if (!p) return;
    p.bundles.forEach((b) => {
      if (activeBundles.has(b.name)) {
        const prev = activeBundles.get(b.name);
        if (prev.version !== b.version) out.push({ packId: p.id, reason: `${b.name} 版本冲突 ${prev.version} vs ${b.version}`, suggest: '停用其中一个包或更新到同一版本' });
      } else {
        activeBundles.set(b.name, b);
      }
    });
  });
  const contentCollision = new Set();
  rows.filter((i) => i.active).forEach((row) => {
    const p = packOf(row.packId);
    if (!p) return;
    p.bundles.forEach((b) => {
      if (!contentCollision.has(b.role)) contentCollision.add(b.role);
      else if (!out.some((c) => c.packId === p.id && c.reason.includes('重复角色'))) out.push({ packId: p.id, reason: `重复角色：${b.role}`, suggest: '保留角色更完整的包' });
    });
  });
  return [...new Map(out.map((o) => [o.packId + o.reason, o])).values()];
}
function getConflicts() {
  return simulateConflicts(state.installed);
}

function togglePack(id, el) {
  const row = installedRow(id);
  if (!row) return;
  const next = !row.active;
  const p = packOf(id);
  if (next && p) {
    const tmp = [...state.installed.filter((x) => x.packId !== id), { ...row, active: true }];
    const conflicts = simulateConflicts(tmp).filter((c) => c.packId === id);
    if (conflicts.length) {
      showDialog('存在冲突', `<div class="body">${conflicts.map((c) => '<div>' + esc(c.reason) + '</div>').join('')}<div>建议先停用冲突包或选择替换版本。</div></div>`, () => {});
      return;
    }
  }
  row.active = next;
  state.pendingRestart += 1;
  save(); renderAll();
  toast(next ? p.name + ' 已激活' : p.name + ' 已停用');
}

function importPacks(list) {
  const ok = [];
  const bad = [];
  list.forEach((data) => {
    if (!data || typeof data !== 'object' || !data.packId || !data.bundles || !Array.isArray(data.bundles) || !data.name) {
      bad.push(data && data.name ? data.name : '未知包');
      return;
    }
    const id = data.packId;
    if (isInstalled(id) || state.imported.some((p) => p.id === id)) { bad.push(data.name + '（已存在）'); return; }
    const norm = {
      id,
      name: data.name,
      author: data.market && data.market.author ? data.market.author : '本地导入',
      stars: data.market && data.market.stars ? data.market.stars : 0,
      version: data.version || '0.0.0',
      tags: data.tags || [],
      desc: data.description || '',
      bundles: data.bundles.map((b) => ({ name: b.package || b.name, role: b.role || '工具', version: b.version || '0.0.0' })),
      memory: data.memory || [],
      accent: '#3d5a6c',
      imported: true
    };
    state.imported.push(norm);
    ok.push(norm);
  });
  if (ok.length) {
    state.installed.push(...ok.map((p) => ({ packId: p.id, active: true, installedAt: today(), status: 'healthy' })));
    state.pendingRestart += ok.length;
    save(); renderAll(); switchView('hub');
    toast(ok.map((p) => p.name).join('、') + ' 已导入');
  }
  if (bad.length) toast('跳过：' + bad.join('、'));
}

function today() {
  return new Date().toISOString().slice(0, 10);
}

document.addEventListener('DOMContentLoaded', () => {
  aiRestore(); // AI 装配间会话续接（刷新/重启）
  bindGlobal();
  applyTheme();
  bindWindowControls();
  bindClientCenterBackdrop();
  bindMaidDock();
  renderAll();
  // v1.2：女仆坞仅存在于主页——非主页进入时隐藏玻璃标签；主页则恢复上次开合状态
  const dockInit = document.getElementById('maidDock');
  if (dockInit && state.currentView !== 'home') dockInit.classList.add('hidden');
  openMaidDock(state.maidDockOpen === true);
});

// 左侧女仆坞交互（v1.2）：悬停自动延伸玻璃条（260ms 防抖回缩）；点击头像弹出/收起界面；Esc 收起
function bindMaidDock() {
  const dock = document.getElementById('maidDock');
  if (!dock) return;
  let peekTimer = null;
  const avatar = document.getElementById('maidAvatar');
  if (avatar) avatar.addEventListener('click', () => openMaidDock(!maidOpen));
  dock.addEventListener('mouseenter', () => {
    clearTimeout(peekTimer);
    if (!maidOpen) dock.classList.add('peek');
  });
  dock.addEventListener('mouseleave', () => {
    peekTimer = setTimeout(() => { if (!maidOpen) dock.classList.remove('peek'); }, 260);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && maidOpen) openMaidDock(false);
  });
  // 点击遮罩 = 仅收起（遮罩已拦截全部鼠标事件，底下按钮无任何悬停/按压/聚焦副作用）
  const scrim = document.getElementById('maidScrim');
  if (scrim) scrim.addEventListener('click', () => { if (maidOpen) openMaidDock(false); });
}

function bindWindowControls() {
  // 双保险拖拽：WebView2 原生 app-region: drag 为主，JS mousedown 桥接为兜底。
  // mousedown 只在顶栏空白处触发（按钮/导航/输入框除外），通知 C# 执行系统拖拽。
  const topnav = document.querySelector('.topnav');
  if (topnav) {
    topnav.addEventListener('mousedown', (e) => {
      const t = e.target;
      if (t.closest('button, input, select, a, .nav, .win-ctrls, .side-foot')) return;
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage('winDrag');
      }
    });
  }
  const minBtn = document.getElementById('winMin');
  if (minBtn) minBtn.addEventListener('click', () => {
    if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage('winMin');
  });
  const maxBtn = document.getElementById('winMax');
  if (maxBtn) maxBtn.addEventListener('click', () => {
    if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage('winMax');
  });
  const closeBtn = document.getElementById('winClose');
  if (closeBtn) closeBtn.addEventListener('click', () => {
    if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage('winClose');
  });
}
</script>
