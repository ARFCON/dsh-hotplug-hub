<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH 插座中枢 · 原型</title>
<style>
:root {
  /* ===== 设计系统 v3 · PCL 启动器风（浅色卡片 + 绿色启动 + 顶部横排菜单） =====
   * 强调色 --teal 仍驱动导航/链接/选中（随主题切换）；--launch 系列专给「启动 DSH」大键（PCL 特征绿）。 */
  --accent: var(--teal);
  --accent-strong: var(--teal-hover);
  --accent-soft: var(--teal-soft);
  --accent-ink: #ffffff;

  --bg: #f2f3f5;
  --panel: #ffffff;
  --ink: #1a1f26;
  --muted: #6b7280;
  --line: #e6e8ec;

  /* 默认主题强调色（PCL 草绿；切主题时被 THEME_PRESETS 覆盖） */
  --teal: #43a047;
  --teal-dark: #2e7d32;
  --teal-soft: #e8f5e9;
  --teal-hover: #388e3c;

  /* PCL 启动绿：启动主键专用（与 --teal 同源，语义化别名） */
  --launch: var(--teal);
  --launch-hover: var(--teal-hover);
  --launch-soft: var(--teal-soft);
  --launch-deep: var(--teal-dark);

  --amber: #d97706;
  --amber-soft: #fdf3e3;
  --red: #dc2626;
  --red-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --neutral-soft: #f3f4f6;

  --sidebar-ink: #1a1f26;
  --nav-ink: #6b7280;
  --surface-dark: #1f2937;
  --surface-dark-ink: #e5e7eb;

  /* 字体栈：Windows WebView2 优先 Segoe UI + Microsoft YaHei UI（UI 变体字重渲染更干净），macOS 走 PingFang；
     等宽栈优先 Cascadia Mono（Win10/11 现代等宽，0/O、1/l 区分清晰）再退 Consolas */
  --font-sans: ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --rad-sm: 6px;
  --rad: 10px;
  --rad-lg: 12px;
  --rad-full: 999px;
  /* 卡片柔和阴影（PCL 特征：轻投影而非硬边框） */
  --shadow-card: 0 1px 3px rgba(17,24,39,.06), 0 1px 2px rgba(17,24,39,.04);
  --shadow-card-hover: 0 4px 12px rgba(17,24,39,.1);
  --shadow-toast: 0 8px 24px rgba(17,24,39,.18);
  --fs: 14px;
  --nav-h: 56px;
  --menu-h: 42px;   /* 顶部横排菜单栏高度（标题栏之下） */
}
* { box-sizing: border-box; }
/* 全局滚动条美化（细、圆角、语义色，暗色主题也协调） */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-corner { background: transparent; }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font-sans);
  font-size: var(--fs);
  /* 中文排版基准：正文 1.65 行高（雅黑/苹方在 1.2 默认行高下笔画拥挤）；
     全局表格数字（数据面板所有计数/版本/端口对齐成列）+ 常规字偶距 */
  line-height: 1.65;
  font-variant-numeric: tabular-nums;
  font-kerning: normal;
  text-rendering: optimizeLegibility;
  background: var(--bg);
  color: var(--ink);
  letter-spacing: 0;
}
button { font: inherit; color: inherit; }
.hidden { display: none !important; }
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
/* 顶部标题栏（PCL 启动器风：标题行 + 下方横排菜单栏两层，整体 sticky） */
.topnav {
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 20;
  user-select: none;
  cursor: default;
}
.topnav-title {
  display: flex; align-items: center; gap: 20px;
  height: var(--nav-h);
  padding: 0 22px;
}
/* 窗口控制按钮（无边框自绘） */
.win-ctrls { display: flex; align-items: center; gap: 2px; margin-left: auto; flex: 0 0 auto; }
.win-btn {
  display: grid; place-items: center; width: 34px; height: 34px;
  border: 0; border-radius: 8px; background: transparent; color: var(--muted);
  cursor: pointer; transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.win-btn:hover { background: var(--neutral-soft); color: var(--ink); }
.win-btn.win-close:hover { background: var(--red); color: #fff; }
.brand {
  display: flex; align-items: center; gap: 10px;
  flex: 0 0 auto;
}
.brand-mark {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  background: var(--accent);
  border-radius: 8px;
  color: #fff;
}
.brand-name { font-weight: 700; font-size: 15px; line-height: 1.2; letter-spacing: .01em; }
.brand-sub { display: none; }
/* v3：顶部横排主导航（.mainnav + .nav-item，见主样式区） */
.side-foot {
  display: flex; align-items: center; gap: 14px;
  flex: 0 0 auto;
  font-size: 12px; color: var(--muted);
}
.side-row { display: flex; align-items: center; gap: 6px; }
/* 版本号等技术值用等宽：数字宽度恒定，随自检刷新不抖动 */
.side-row .v { color: var(--ink); font-weight: 600; font-family: var(--font-mono); font-size: 11.5px; }
.side-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--amber); color: #fff;
  border-radius: var(--rad-lg); padding: 4px 10px; font-size: 12px; font-weight: 600;
}
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 22px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  position: sticky; top: calc(var(--nav-h) + var(--menu-h)); z-index: 10;
  transition: padding-left .26s var(--ease);
}
/* 主页态：给左侧女仆坞玻璃标签让位（34px），标题与中控台/启动卡左缘对齐成一条竖线
   （86 = wrap 22 + home-shell 左让位 64；其他视图标题 22 同样与其内容对齐，惯例一致） */
body.on-home .topbar { padding-left: 86px; }
.topbar h1 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; letter-spacing: .01em; }
.topbar .ctx { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.topbar .spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--neutral-soft);
  color: var(--muted); border-radius: var(--rad-full); padding: 5px 12px; font-size: 12px;
}
.pill.good { color: var(--green); background: var(--green-soft); border-color: var(--green-soft); }
.pill.warn { color: var(--amber); background: var(--amber-soft); border-color: var(--amber-soft); }
.wrap { padding: 22px; display: grid; gap: 18px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--rad); padding: 14px 16px;
}
.stat .label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; letter-spacing: .02em; }
.stat .num { font-size: 26px; font-weight: 600; margin-top: 8px; font-family: var(--font-mono); line-height: 1.15; }
.stat .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.section-head h2 { margin: 0; font-size: 15px; }
.section-head .sub { font-size: 12px; color: var(--muted); }
.toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--rad); padding: 12px;
}
.search {
  flex: 1 1 240px; min-width: 180px;
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); border-radius: var(--rad);
  padding: 8px 10px; background: var(--panel);
}
.search input {
  border: 0; outline: 0; background: transparent; width: 100%; font: inherit;
  color: var(--ink);
}
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  border-radius: var(--rad-full); padding: 6px 12px; font-size: 12px; cursor: pointer;
}
.chip.on { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: var(--rad); padding: 8px 12px; font-size: 13px; font-weight: 500; cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--muted); background: var(--neutral-soft); }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 600; }
.btn.primary:hover { background: var(--teal-hover); }
.btn.danger { color: var(--red); border-color: var(--red-soft); }
.btn.danger:hover { background: var(--red-soft); }
.btn.sm { padding: 5px 9px; font-size: 12px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.pack-list, .pack-grid, .mem-list, .check-list { display: grid; gap: 10px; }
.pack-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pack {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--rad); padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.pack-top, .mem-top { display: flex; align-items: flex-start; gap: 10px; }
.pack-icon {
  width: 38px; height: 38px; border-radius: var(--rad); flex: 0 0 auto;
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px;
}
.pack-title { flex: 1; min-width: 0; }
.pack-title h3 { margin: 0; font-size: 15px; line-height: 1.35; }
.pack-title .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  font-size: 11px; color: var(--muted);
  background: var(--neutral-soft); border: 1px solid var(--line);
  padding: 2px 8px; border-radius: var(--rad-lg);
}
.plugins { display: grid; gap: 4px; }
.plugin-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--muted);
  padding: 5px 8px; background: var(--neutral-soft); border: 1px solid var(--line); border-radius: var(--rad-sm);
}
.plugin-row .role { margin-left: auto; color: var(--ink); }
.pack-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; }
.pack-foot .spacer { flex: 1; }
.switch {
  width: 42px; height: 24px; border-radius: 16px;
  border: 1px solid var(--line); background: var(--neutral-soft);
  position: relative; cursor: pointer; transition: background 0.15s;
  flex: 0 0 auto;
}
.switch::after {
  content: ""; position: absolute; width: 18px; height: 18px;
  border-radius: 50%; background: #fff; top: 2px; left: 2px;
  transition: left 0.15s; box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
.switch[aria-checked="true"] { background: var(--teal); border-color: var(--teal); }
.switch[aria-checked="true"]::after { left: 20px; }
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; border-radius: var(--rad-lg); padding: 3px 9px; font-weight: 600;
}
.badge.ok { background: var(--green-soft); color: var(--green); }
.badge.warn { background: var(--amber-soft); color: var(--amber); }
.badge.err { background: var(--red-soft); color: var(--red); }
.badge.neutral { background: var(--neutral-soft); color: var(--muted); }
.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--rad); padding: 16px;
}
/* ===== 沉浸式聊天（AI 装配间 v2.1：为女仆坞 400px 窄栏重设计——单行工具栏/单列表单/轻量欢迎） ===== */
/* 女仆坞内主题统一为「小织粉」：覆盖强调色变量，坞内全部控件（按钮/焦点环/气泡/徽标）随之和谐 */
.maid-dock {
  --teal: #db2777;
  --teal-dark: #be1e64;
  --accent: #db2777;
  --accent-strong: #be1e64;
}
.ai-zone { display: flex; flex-direction: column; height: 100%; min-height: 460px; }
/* 工具栏：单行不换行——徽标 + 人设名 + 轮次 … 人设切换/模型/新会话；文案与图标瘦身保证 400px 内一行收纳 */
.ai-topbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
  padding: 8px 12px; background: var(--panel);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 6;
}
.ai-topbar .spacer { flex: 1; }
.ai-chip-btn {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
  padding: 5px 10px; font-size: 12px; color: var(--ink); cursor: pointer; white-space: nowrap;
  transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.ai-chip-btn:hover { border-color: var(--teal); color: var(--teal); }
.ai-chip-btn.active { border-color: var(--teal); background: rgba(219,39,119,.08); color: var(--teal); }
.ai-chip-btn:disabled { opacity: .45; cursor: default; }
select.ai-chip-btn { flex: 0 0 auto; max-width: 118px; padding-right: 6px; }
.ai-chip-btn.ai-icon-btn { padding: 5px 0; width: 30px; justify-content: center; font-size: 13px; }
.ai-turn-badge {
  font-size: 10.5px; color: var(--muted); white-space: nowrap; flex: 0 0 auto; letter-spacing: .02em;
  border: 1px solid var(--line); border-radius: var(--rad-full); padding: 1px 8px;
}
.ai-turn-badge:empty { display: none; }
/* 连接设置面板 v4（窄栏版）：标题行 + 每行「标签 | 单控件」独占整行，杜绝同行溢出错位 */
.ai-settings {
  width: 100%; padding: 10px 12px 0;
  display: grid; gap: 0;
}
.ai-settings-panel {
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
  padding: 12px 12px 10px; display: grid; gap: 9px;
  box-shadow: 0 6px 24px rgba(15,23,42,.06);
}
.ai-cfg-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; font-weight: 700; color: var(--ink); letter-spacing: .01em;
}
.ai-settings-panel .row {
  display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; align-items: center;
}
.ai-settings-panel .row .ai-label { font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; letter-spacing: .02em; }
.ai-settings-panel .row .ctl-line { display: flex; gap: 8px; min-width: 0; }
.ai-settings-panel .row .ctl-line > * { flex: 1 1 0; min-width: 0; }  /* 单行单控件，宽度天然一致 */
.ai-ctl {
  box-sizing: border-box; width: 100%; height: 32px; padding: 0 10px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
  font: inherit; font-size: 12.5px; color: var(--ink); min-width: 0;
  transition: border-color .15s, box-shadow .15s;
}
.ai-ctl::placeholder { color: var(--muted); }
.ai-ctl:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(219,39,119,.13); }
.ai-ctl:disabled { background: var(--neutral-soft); color: var(--muted); cursor: not-allowed; }
select.ai-ctl { cursor: pointer; padding-right: 8px; }
.ai-ctl-btn {
  height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--ink); font-size: 12.5px; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
}
.ai-ctl-btn:hover { border-color: var(--teal); color: var(--teal); }
.ai-ctl-btn:disabled { opacity: .55; cursor: default; }
.ai-hint { font-size: 11px; color: var(--muted); line-height: 1.7; padding: 0 2px; }
.ai-hint b { color: var(--teal-dark); font-weight: 600; }
.ai-log {
  max-height: 110px; overflow: auto; font: 12px/1.6 Consolas, monospace;
  color: #667085; background: #f6f8fa; border: 1px solid #e5e7eb;
  border-radius: 8px; padding: 8px; margin: 8px 12px 0;
}
.ai-scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.ai-scroll::-webkit-scrollbar { width: 8px; }
.ai-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
.ai-scroll::-webkit-scrollbar-thumb:hover { background: var(--muted); }
.ai-scroll::-webkit-scrollbar-track { background: transparent; }
.ai-col { width: 100%; margin: 0 auto; padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 14px; }
/* 空态欢迎（轻量版）：无边框卡，留白呼吸；问候 + 一句描述 + 三枚示例芯片 */
.ai-welcome {
  padding: 26px 8px 10px; display: grid; gap: 10px; text-align: center; justify-items: center;
}
.ai-welcome .wv-mark {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(135deg, #db2777, #f472b6); color: #fff;
  font-size: 15px; font-weight: 800; box-shadow: 0 6px 16px rgba(219,39,119,.3);
}
.ai-welcome .greet { font-size: 16.5px; font-weight: 800; color: var(--teal-dark); line-height: 1.4; letter-spacing: .01em; }
.ai-welcome .desc { font-size: 12.5px; color: var(--muted); line-height: 1.75; max-width: 300px; margin: 0 auto; }
.ai-welcome .pv-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
.ai-welcome .pv {
  display: inline-flex; gap: 6px; align-items: center;
  border: 1px solid var(--line); border-radius: 999px; background: var(--panel);
  padding: 6px 12px; font-size: 12px; cursor: pointer; color: var(--ink); max-width: 100%;
  transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
}
.ai-welcome .pv:hover { transform: translateY(-1px); border-color: var(--teal); box-shadow: 0 5px 14px rgba(219,39,119,.14); }
.ai-welcome .pv svg { width: 12px; height: 12px; flex: 0 0 12px; }
/* 消息气泡 */
.ai-msg { display: flex; gap: 9px; align-items: flex-start; animation: aiIn .24s ease; }
.ai-msg.user { flex-direction: row-reverse; }
@keyframes aiIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.ai-avatar {
  flex: 0 0 28px; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; font-size: 13px; font-weight: 700;
  border: 1px solid var(--line); background: var(--panel);
}
.ai-avatar.av-err { background: var(--red-soft); border-color: var(--red); color: var(--red); }
.ai-msg.user .ai-avatar { background: var(--teal-dark); border-color: var(--teal-dark); color: #fff; font-size: 11px; }
.ai-bubble {
  max-width: 82%; border-radius: 14px; padding: 10px 13px;
  font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
}
.ai-msg.assistant .ai-bubble {
  background: var(--panel); border: 1px solid var(--line);
  border-top-left-radius: 5px; color: var(--ink);
  box-shadow: 0 2px 10px rgba(15,23,42,.05);
}
/* 气泡内轻量 markdown（先转义后渲染，安全） */
.ai-bubble code {
  background: var(--neutral-soft); border: 1px solid var(--line); border-radius: 4px;
  padding: 1px 5px; font-family: var(--font-mono); font-size: 12px;
}
.ai-bubble pre {
  background: var(--surface-dark); color: var(--line); border-radius: 10px;
  padding: 10px 12px; overflow-x: auto; margin: 8px 0;
  font-family: var(--font-mono); font-size: 12px; line-height: 1.6; white-space: pre;
}
.ai-bubble pre code { background: none; border: none; padding: 0; color: inherit; font-size: inherit; }
.ai-bubble b { font-weight: 700; }
.ai-msg.user .ai-bubble {
  background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #fff;
  border-top-right-radius: 5px;
}
.ai-msg.err .ai-bubble { background: var(--red-soft); border-color: var(--red); color: var(--red); }
/* 打字指示器 */
.ai-typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 2px; }
.ai-typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: aiDot 1.1s infinite; }
.ai-typing i:nth-child(2) { animation-delay: .18s; }
.ai-typing i:nth-child(3) { animation-delay: .36s; }
@keyframes aiDot { 0%,60%,100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
/* 产物卡片（窄栏版）：与助理气泡左对齐，插件清单 mono 紧凑，操作按钮 2×2 等宽网格 */
.ai-pack-card {
  border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
  padding: 12px; display: grid; gap: 9px; margin-left: 37px; max-width: calc(100% - 37px);
  box-shadow: 0 4px 16px rgba(15,23,42,.05); animation: aiIn .28s ease;
}
.ai-pack-card .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pack-mark {
  width: 20px; height: 20px; display: grid; place-items: center; flex: 0 0 20px;
  background: var(--teal-dark); color: #fff; border-radius: 6px;
  font-size: 10.5px; font-weight: 800;
}
.ai-pack-card .name { font-weight: 700; font-size: 13.5px; color: var(--ink); }
.ai-pack-card .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--muted); }
.ai-diff { display: flex; gap: 5px; flex-wrap: wrap; }
.ai-diff b { font-weight: 600; border-radius: 999px; padding: 1px 8px; font-size: 11px; }
.ai-diff .add { background: var(--green-soft); color: var(--green); }
.ai-diff .del { background: var(--red-soft); color: var(--red); }
.ai-diff .chg { background: var(--amber-soft); color: var(--amber); }
.ai-plugins { display: flex; flex-direction: column; gap: 3px; }
.ai-plugins .p { display: flex; gap: 7px; align-items: center; font-size: 12px; min-width: 0; }
.ai-plugins .p .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); flex: 0 0 6px; }
.ai-plugins .p .pn { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ai-plugins .p .pv { color: var(--muted); font-size: 11px; white-space: nowrap; }
.ai-pack-card .acts {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  border-top: 1px solid var(--line); padding-top: 9px;
}
.ai-pack-card .acts .btn { width: 100%; justify-content: center; }
/* 底部输入坞 */
.ai-dock {
  border-top: 1px solid var(--line); background: var(--panel);
  padding: 10px 12px 10px; position: sticky; bottom: 0; z-index: 6;
}
.ai-dock-inner { width: 100%; margin: 0 auto; display: grid; gap: 6px; }
.ai-input-wrap {
  display: flex; align-items: flex-end; gap: 10px;
  border: 1.5px solid var(--line); border-radius: 18px; background: var(--panel);
  padding: 10px 10px 10px 16px; transition: border-color .15s ease, box-shadow .15s ease;
}
.ai-input-wrap:focus-within { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(219,39,119,.13); }
.ai-input-wrap textarea {
  flex: 1; border: 0; outline: 0; resize: none; background: transparent;
  font: inherit; font-size: 13.5px; line-height: 1.6; max-height: 150px; min-height: 24px;
  padding: 2px 0; color: var(--ink);
}
.ai-send {
  flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%; border: 0;
  background: var(--teal); color: #fff; cursor: pointer; display: grid; place-items: center;
  transition: background .15s ease, transform .12s ease;
}
.ai-send:hover { background: var(--teal-dark); }
.ai-send:active { transform: scale(.94); }
.ai-send:disabled { background: var(--line); cursor: default; }
.ai-send svg { width: 18px; height: 18px; }
.ai-dock-note { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--muted); flex-wrap: wrap; padding: 0 2px; letter-spacing: .02em; }
.ai-dock-note .k { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: 11px; }
.ai-label { font-size: 13px; color: var(--ink-dim); white-space: nowrap; }
.req-box {
  width: 100%; min-height: 120px; resize: vertical;
  border: 1px solid var(--line); border-radius: var(--rad); background: var(--panel);
  padding: 12px; font: inherit; color: var(--ink);
}
.req-box:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
.log-box {
  background: var(--surface-dark); color: var(--surface-dark-ink); border-radius: var(--rad);
  font-family: var(--font-mono);
  font-size: 12px; line-height: 1.7; padding: 12px 14px;
  min-height: 220px; max-height: 360px; overflow-y: auto;
  white-space: pre-wrap;
}
.log-box .ok { color: var(--green); }
.log-box .warn { color: var(--amber); }
.result {
  display: none;
  border: 1px solid var(--teal); background: var(--green-soft); border-radius: var(--rad); padding: 14px;
}
.result.show { display: block; }
.result h3 { margin: 0 0 8px; font-size: 14px; }
.json-pre {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--rad);
  padding: 10px; font-family: var(--font-mono);
  font-size: 11px; max-height: 220px; overflow: auto; white-space: pre;
  margin: 0;
}
.check-row {
  display: flex; align-items: center; gap: 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--rad);
  padding: 12px 14px;
}
.check-row .name { font-size: 13px; font-weight: 600; }
.check-row .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.check-row .val { margin-left: auto; font-size: 13px; font-family: var(--font-mono); }
.check-row .act { margin-left: 4px; }
.mem-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.mem { background: var(--panel); border: 1px solid var(--line); border-radius: var(--rad); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.kw { font-size: 11px; color: var(--teal); background: var(--teal-soft); border-radius: var(--rad-lg); padding: 2px 8px; }
.empty { color: var(--muted); font-size: 13px; padding: 12px; text-align: center; }
.dialog-backdrop {
  position: fixed; inset: 0; background: rgba(10, 24, 20, 0.45);
  display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px;
}
.dialog-backdrop.show { display: flex; }
.dialog {
  width: min(520px, 100%);
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--rad);
  padding: 18px;
  display: grid; gap: 12px;
}
.dialog h3 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .01em; line-height: 1.4; }
.dialog .body { font-size: 13px; color: var(--muted); line-height: 1.7; }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--surface-dark); color: #fff; border-radius: var(--rad); padding: 10px 16px;
  font-size: 13px; letter-spacing: .01em; z-index: 70; box-shadow: var(--shadow-toast);
  opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
.footnote { font-size: 11px; color: var(--muted); }

/* ===== 插件市场（真实 GitHub 数据源）样式 ===== */
.mkt-banner { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; }
.mkt-banner.err { background: var(--red-soft, rgba(220,38,38,0.12)); color: var(--red, var(--red)); }
.mkt-banner.ok { background: var(--green-soft, rgba(16,185,129,0.12)); color: var(--green, var(--green)); }
.mkt-tags { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.mkt-tags-toggle { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line, rgba(128,128,128,0.35)); background: transparent; color: var(--ink); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; align-self: flex-start; }
.mkt-tags-toggle:hover { border-color: var(--teal); }
.mkt-tags-label { font-weight: 600; }
.mkt-tags-count { font-size: 12px; color: var(--teal); background: rgba(37,99,235,0.12); padding: 1px 8px; border-radius: 999px; }
.mkt-tags-count.muted { color: var(--muted); background: rgba(128,128,128,0.12); }
.mkt-tags-caret { font-size: 11px; color: var(--muted); transition: transform 0.15s; }
.mkt-tags-panel { display: none; }
.mkt-tags-panel.open { display: flex; }
.mkt-topic-wrap { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.mkt-topic { width: 130px; padding: 7px 10px; border: 1px solid var(--border, rgba(128,128,128,0.35)); border-radius: 8px; background: transparent; color: inherit; font-size: 13px; }
.mkt-topic:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
.mkt-select { padding: 7px 10px; border: 1px solid var(--border, rgba(128,128,128,0.35)); border-radius: 8px; background: transparent; color: inherit; font-size: 13px; }
.mkt-select:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
.mkt-source { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.mkt-source-label { font-size: 12px; color: var(--muted); margin-right: 2px; }
.mkt-desc { font-size: 13px; color: var(--muted); line-height: 1.55; margin: 8px 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.mkt-link { font-size: 12px; color: var(--teal); text-decoration: none; }
.mkt-link:hover { text-decoration: underline; }
.mkt-details { margin: 6px 0; font-size: 12px; }
.mkt-details summary { cursor: pointer; color: var(--teal); font-size: 12px; }
.mkt-pre { background: rgba(0,0,0,0.06); border: 1px solid var(--border, rgba(128,128,128,0.3)); border-radius: 8px; padding: 10px; font-family: var(--font-mono); font-size: 11px; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; line-height: 1.5; }
@media (max-width: 1000px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pack-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  .topnav-title { padding: 0 12px; gap: 12px; }
  .brand-name, .side-foot { display: none; }
  .nav-item { padding: 0 10px; }
  .grid-4, .pack-grid, .mem-list { grid-template-columns: 1fr; }
  .pcl-home { grid-template-columns: 1fr; }          /* 启动卡与卡片列纵向堆叠 */
  .home-tiles { grid-template-columns: 1fr; }        /* 快捷入口单列 */
  .home-shell { padding: 14px 14px 32px 52px; }
  body.on-home .topbar { padding-left: 66px; } /* 与 52px 面板左缘对齐（wrap 14 + 52） */
  .wrap { padding: 14px; }
  .topbar { padding: 12px 14px; }
}

.mem-body{font-size:12.5px;color:var(--muted);line-height:1.6;white-space:pre-wrap;word-break:break-word}
.mem-edit{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin-top:14px}
.mem-ta{width:100%;min-height:120px;margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--rad-sm);font:inherit;font-size:12.5px;resize:vertical;background: var(--panel);color:var(--ink)}
.mem-ta:focus,.search:focus{outline:2px solid var(--teal);outline-offset:0}
/* ===== 主题设置页签（换肤 / 色板 / 布局细节 / 命名保存） ===== */
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.skin-card {
  background: var(--panel); border: 2px solid var(--line); border-radius: var(--rad);
  padding: 12px; cursor: pointer; transition: border-color .15s, transform .1s;
}
.skin-card:hover { transform: translateY(-2px); }
.skin-card.active { border-color: var(--teal); }
.skin-swatch { display: flex; height: 42px; border-radius: var(--rad-sm); overflow: hidden; margin-bottom: 8px; border: 1px solid var(--line); }
.skin-swatch i { flex: 1; }
.skin-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
.skin-name .dot { font-size: 11px; color: var(--muted); }
.theme-sect { display: grid; gap: 10px; }
.theme-sect h3 { margin: 0 0 2px; font-size: 14px; }
.theme-sect .sub { font-size: 12px; color: var(--muted); }
.var-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.var-item { display: grid; gap: 6px; min-width: 0; }
.var-item label { font-size: 12px; color: var(--muted); display: flex; align-items: center; justify-content: space-between; }
.var-item .color-field { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: var(--rad-sm); padding: 4px 6px; background: var(--panel); min-width: 0; }
.var-item input[type="color"] { width: 34px; height: 26px; border: 0; padding: 0; background: none; cursor: pointer; }
/* hex 输入显式可收缩（覆盖 size=20 固有宽度，防止顶破色板网格轨道造成页面横向滚动） */
.var-item input[type="text"] { flex: 1; width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 12px; color: var(--ink); }
.var-item input[type="range"] { width: 100%; }
.var-item input[type="number"], .var-item select { width: 100%; border: 1px solid var(--line); border-radius: var(--rad-sm); padding: 6px 8px; font: inherit; font-size: 12px; background: var(--panel); color: var(--ink); }
.theme-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.skin-row { display: flex; align-items: center; gap: 10px; }
.skin-row input[type="text"] { flex: 1; border: 1px solid var(--line); border-radius: var(--rad-sm); padding: 7px 10px; font: inherit; font-size: 13px; background: var(--panel); color: var(--ink); }
.theme-reset { color: var(--muted); font-size: 12px; }

/* ============================================================
   统一过渡令牌 & 折叠式卡片（重构：好看简洁 · 折叠 · 过渡自然）
   ============================================================ */
:root {
  --ease: cubic-bezier(.4, 0, .2, 1);
  --dur: .22s;
}
/* 通用过渡：卡片 hover / 按钮 / 开关，统一缓动 */
.pack, .mem, .check-row, .panel, .toolbar, .stat {
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease);
}
/* PCL 卡片皮肤：通用卡片统一柔和投影（轻投影而非硬边框堆叠） */
.stat, .pack, .mem, .panel, .toolbar, .fold, .search {
  box-shadow: var(--shadow-card);
}
.pack:hover, .mem:hover { box-shadow: var(--shadow-card-hover); }
.btn { transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease); }
.btn:active { transform: scale(.97); }
.chip, .tag, .pill, .badge { transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.switch { transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease); }

/* ---- 折叠卡片：头部常显核心信息，详情/低频操作折叠 ---- */
.fold { border: 1px solid var(--line); border-radius: var(--rad); background: var(--panel); overflow: hidden; }
.fold-head {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; cursor: pointer; user-select: none;
  transition: background var(--dur) var(--ease);
}
.fold-head:hover { background: var(--neutral-soft, var(--neutral-soft)); }
.fold-head .fold-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
.fold-chevron {
  flex: 0 0 auto; width: 20px; height: 20px; color: var(--muted);
  display: grid; place-items: center;
  transition: transform var(--dur) var(--ease);
}
.fold-chevron svg { width: 15px; height: 15px; }
.fold.open .fold-chevron { transform: rotate(180deg); }
.fold-body {
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows var(--dur) var(--ease);
}
.fold.open .fold-body { grid-template-rows: 1fr; }
.fold-inner { overflow: hidden; min-height: 0; }
.fold-inner > * { margin: 0; }
.fold-inner .fold-content { padding: 2px 16px 16px; border-top: 1px dashed var(--line); }

/* 折叠头部里的开关：点击不触发折叠 */
.fold-head .switch, .fold-head .btn { pointer-events: auto; }

/* 空状态统一 */
.empty {
  border: 1px dashed var(--line); border-radius: var(--rad);
  color: var(--muted); font-size: 13px; padding: 20px 12px; text-align: center;
}

/* 状态点：语义色小圆点，替代纯文字 badge 的单调 */
.status-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
.status-dot.ok { background: var(--green); }
.status-dot.warn { background: var(--amber); }
.status-dot.err { background: var(--red); }
.status-dot.neutral { background: var(--muted); opacity: .5; }

/* 折叠内列表项（插件行/子项）微调 */
.fold-content .plugin-row { margin-bottom: 4px; }
.fold-content .plugin-row:last-child { margin-bottom: 0; }

/* ===== 左右分区 + 分类导航（小白友好） ===== */
.split-view { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; align-items: start; }
.split-side { position: sticky; top: calc(var(--nav-h) + var(--menu-h) + 60px); }
.split-side .cat-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 0 12px 8px; }
.cat-list { display: grid; gap: 3px; }
.cat-item {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 8px 12px; border: 0; border-radius: var(--rad);
  background: transparent; color: var(--muted); cursor: pointer;
  font-size: 13px; text-align: left;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.cat-item svg { width: 15px; height: 15px; flex: 0 0 auto; }
.cat-item:hover { background: var(--neutral-soft); color: var(--ink); }
.cat-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.cat-item .c-count { margin-left: auto; font-size: 11px; background: var(--neutral-soft); border-radius: var(--rad-full); padding: 1px 8px; color: var(--muted); }
.cat-item.active .c-count { background: var(--panel); color: var(--accent); }
.split-main { min-width: 0; display: grid; gap: 14px; align-content: start; }
.guide-hint {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; border: 1px dashed var(--line); border-radius: var(--rad);
  color: var(--muted); font-size: 12.5px; background: var(--panel);
}
.guide-hint b { color: var(--accent); font-weight: 600; }
@media (max-width: 720px) {
  .split-view { grid-template-columns: 1fr; }
  .split-side { position: static; }
  .cat-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .cat-item { width: auto; }
}

/* ===== 主页（v3 · PCL 启动器风）：左启动卡（大绿启动键 + 环境自检）+ 右卡片列（更新/快捷入口） ===== */
.home-shell {
  box-sizing: border-box;
  /* 左 64px 让位女仆坞玻璃标签；底部小留白（无悬浮簇后不再需 130px） */
  padding: 20px 22px 40px 64px;
  min-height: calc(100vh - 172px);
}
.pcl-home {
  display: grid;
  grid-template-columns: minmax(300px, 5fr) minmax(340px, 7fr);
  gap: 20px; align-items: start;
  max-width: 1120px;
}
/* —— 启动卡：PCL「启动游戏」区，白卡 + 大绿按钮 —— */
.launch-card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--rad-lg); box-shadow: var(--shadow-card);
  padding: 26px 22px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  text-align: center;
}
.launch-brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; letter-spacing: .01em; }
.launch-brand .brand-mark { width: 36px; height: 36px; margin: 0; }
.launch-btn {
  width: 100%; max-width: 340px; height: 62px;
  border: 0; border-radius: 14px;
  background: linear-gradient(180deg, var(--launch), var(--launch-hover));
  color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .05em;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(46, 125, 50, .34);
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), filter var(--dur) var(--ease);
}
.launch-btn:hover { filter: brightness(1.05); transform: translateY(-1px); box-shadow: 0 9px 22px rgba(46, 125, 50, .42); }
.launch-btn:active { transform: translateY(0) scale(.99); }
.launch-btn .fl-play { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.24); display: grid; place-items: center; font-size: 11px; }
.launch-ver { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.launch-state { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.launch-state .ls-label { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.launch-env { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.launch-env .env { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.launch-env .hc-dot { width: 7px; height: 7px; }
.launch-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* —— 右侧卡片列 —— */
.home-cards { display: grid; gap: 14px; align-content: start; }
/* 插件更新卡：有更新时琥珀提示条，无更新时绿色安心卡 */
.home-update-card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--rad); box-shadow: var(--shadow-card);
  padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
  cursor: pointer;
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.home-update-card:hover { box-shadow: var(--shadow-card-hover); }
.home-update-card.has-upd { border-color: color-mix(in srgb, var(--amber) 45%, var(--line)); background: var(--amber-soft); }
.home-update-card .hu-top { display: flex; align-items: center; gap: 8px; }
.home-update-card .hu-top .hu-title { font-size: 13.5px; font-weight: 700; }
.home-update-card .hu-top .hu-count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--amber); font-variant-numeric: tabular-nums; }
.home-update-card.ok .hu-top .hu-count { color: var(--green); }
.home-update-card .hu-sub { font-size: 12.5px; color: var(--muted); line-height: 1.55; }
.home-update-card .hu-names { display: flex; gap: 6px; flex-wrap: wrap; }
.home-update-card .hu-names .tag { font-family: var(--font-mono); font-size: 11px; }
.home-update-card .hu-actions { display: flex; gap: 8px; }
/* 快捷入口 2×3 */
.home-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.home-tile {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--rad);
  box-shadow: var(--shadow-card); padding: 13px 15px; cursor: pointer; text-align: left;
  display: flex; flex-direction: column; gap: 6px;
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.home-tile:hover { border-color: var(--accent); box-shadow: var(--shadow-card-hover); transform: translateY(-1px); }
.home-tile .ht-top { display: flex; align-items: center; gap: 8px; }
.home-tile .ht-icon { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: 0 0 auto; }
.home-tile .ht-icon.ti-blue { background: var(--accent); }
.home-tile .ht-icon.ti-green { background: var(--green); }
.home-tile .ht-icon.ti-amber { background: var(--amber); }
.home-tile .ht-icon.ti-pink { background: linear-gradient(135deg, #db2777, #f472b6); }
.home-tile .ht-icon.ti-slate { background: var(--surface-dark); }
.home-tile .ht-name { font-size: 13.5px; font-weight: 700; }
.home-tile .ht-num { font-size: 11px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }
.home-tile .ht-num.upd { color: var(--amber); font-weight: 600; }
.home-tile .ht-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
/* 台尾操作条 */
.home-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.home-foot .spacer { flex: 1; }

/* 通用等宽注记 */
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: .08em; }
/* ===== 客户端中心面板（内嵌官方 harness 选项 + 汇总 + 开关显示 + 环境自检） ===== */
.client-center-backdrop {
  position: fixed; inset: 0; background: rgba(17,24,39,.45);
  display: none; align-items: center; justify-content: center; z-index: 60; padding: 20px;
}
.client-center-backdrop.show { display: flex; }
.client-center {
  width: min(760px, 100%); max-height: 86vh; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--rad-lg);
  padding: 22px; display: grid; gap: 16px;
  box-shadow: 0 24px 60px rgba(17,24,39,.28);
}
.cc-head { display: flex; align-items: center; gap: 12px; }
.cc-head h2 { margin: 0; font-size: 17px; font-weight: 700; flex: 1; }
.cc-close { border: 0; background: var(--neutral-soft); color: var(--muted); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; }
.cc-close:hover { background: var(--red-soft); color: var(--red); }
.cc-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.cc-section { border: 1px solid var(--line); border-radius: var(--rad); overflow: hidden; }
.cc-section-head { display: flex; align-items: center; gap: 8px; padding: 11px 14px; background: var(--neutral-soft); font-weight: 600; font-size: 13px; cursor: pointer; }
.cc-section-head .cc-count { margin-left: auto; font-size: 11px; color: var(--muted); background: var(--panel); border-radius: var(--rad-full); padding: 1px 9px; }
.cc-section-head .cc-caret { transition: transform var(--dur) var(--ease); color: var(--muted); }
.cc-section.open .cc-caret { transform: rotate(180deg); }
.cc-section-body { display: none; padding: 10px 14px; }
.cc-section.open .cc-section-body { display: block; }
.cc-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12.5px; border-bottom: 1px dashed var(--line); }
.cc-item:last-child { border-bottom: 0; }
.cc-item .cc-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cc-item .cc-tag { font-size: 11px; color: var(--muted); background: var(--neutral-soft); border-radius: var(--rad-full); padding: 1px 8px; }
.cc-empty { color: var(--muted); font-size: 12px; padding: 6px 0; }
.cc-env-status { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.cc-env-status .hc-dot { width: 8px; height: 8px; border-radius: 50%; }
.cc-env-status .hc-dot.ok { background: var(--green); }
.cc-env-status .hc-dot.err { background: var(--red); }
.cc-env-status .hc-dot.warn { background: var(--amber); }
.cc-env-switch { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.cc-env-label { font-size: 12.5px; color: var(--muted); margin-right: 4px; }
.env-toggle {
  padding: 5px 12px; font-size: 12px; border-radius: var(--rad-sm);
  border: 1px solid var(--line); background: transparent; color: var(--muted);
  cursor: pointer; transition: all var(--dur) var(--ease);
}
.env-toggle:hover { border-color: var(--accent); color: var(--accent); }
.env-toggle.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
/* v3：.hc-dot 保留（客户端中心/主页环境自检复用） */
.hc-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
.hc-dot.ok { background: var(--green); }
.hc-dot.err { background: var(--red); }

/* ===== v3 顶部横排主导航（PCL 启动器风）：标题栏下方一排横向菜单项，当前项底部指示条高亮 ===== */
.topnav-spacer { flex: 1 1 auto; }
.mainnav {
  display: flex; align-items: stretch; gap: 2px;
  height: 42px; padding: 0 14px;
  border-top: 1px solid var(--line);
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none; user-select: none;
}
.mainnav::-webkit-scrollbar { display: none; }
.nav-item {
  position: relative;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 0 15px; border: 0; background: transparent;
  color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer;
  white-space: nowrap; flex: 0 0 auto;
  transition: color var(--dur) var(--ease);
}
.nav-item svg { width: 15px; height: 15px; flex: 0 0 auto; opacity: .8; }
.nav-item:hover { color: var(--ink); }
.nav-item.active { color: var(--accent); font-weight: 600; }
.nav-item.active svg { opacity: 1; }
/* 当前项底部指示条（PCL 式，非胶囊） */
.nav-item::after {
  content: ""; position: absolute; left: 13px; right: 13px; bottom: -1px; height: 2px;
  border-radius: 2px 2px 0 0; background: var(--accent);
  transform: scaleX(0); transform-origin: center;
  transition: transform var(--dur) var(--ease);
}
.nav-item.active::after { transform: scaleX(1); }
.nav-item .n-count {
  font-size: 10px; line-height: 1; padding: 2px 6px; border-radius: var(--rad-full);
  background: var(--neutral-soft); color: var(--muted);
}
.nav-item .n-count.upd { background: var(--amber-soft); color: var(--amber); font-weight: 700; }

/* ===== v1.2 左侧女仆坞（仅主页）：左缘玻璃标签 → 悬停延伸玻璃条（无文字）→ 点击弹出 AI 装配间 ===== */
.app-body { flex: 1 1 auto; min-height: 0; display: flex; }
.app-body > .main { flex: 1 1 auto; }
.maid-dock {
  position: fixed; left: 0; top: calc(var(--nav-h) + var(--menu-h)); bottom: 0; z-index: 18;
  width: 34px;
  display: flex; flex-direction: column; align-items: center;
  overflow: hidden;
  border-radius: 0 16px 16px 0;
  border: 1px solid transparent;
  /* 玻璃质感：半透明底 + 背景模糊（color-mix 随主题自适应；不支持时回退浅色半透明） */
  background: rgba(255, 255, 255, .55);
  background: color-mix(in srgb, var(--panel) 55%, transparent);
  backdrop-filter: blur(16px) saturate(1.35);
  -webkit-backdrop-filter: blur(16px) saturate(1.35);
  box-shadow: 2px 0 18px rgba(17, 24, 39, .08);
  transition: width .3s cubic-bezier(.33, 1, .68, 1), background .3s ease, border-radius .3s ease, box-shadow .3s ease;
}
/* 悬停热区：向右多探 30px，鼠标靠近即延伸（不需要精确命中 34px 细条）；展开态隐藏，避免挡住右侧内容的点击 */
.maid-hit { position: absolute; left: 100%; top: 0; bottom: 0; width: 30px; }
.maid-dock.open .maid-hit { display: none; }
.maid-dock.peek { width: 78px; }
.maid-dock.open {
  width: 400px; align-items: stretch; border-radius: 0;
  background: rgba(255, 255, 255, .8);
  background: color-mix(in srgb, var(--panel) 80%, transparent);
  border-right: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
  box-shadow: 14px 0 44px rgba(17, 24, 39, .2);
}
/* 收起/悬停态：仅头像标记（垂直居中）+ 悬停态三枚小圆点装饰——按要求无任何文字提示 */
.maid-avatar {
  margin: auto 0; width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 800; font-size: 11px; color: #fff;
  background: linear-gradient(135deg, #db2777, #f472b6);
  box-shadow: 0 3px 10px rgba(219, 39, 119, .4);
  cursor: pointer; border: 0; font-family: inherit; flex: 0 0 auto;
  transition: transform var(--dur) var(--ease), width .3s cubic-bezier(.33,1,.68,1), height .3s cubic-bezier(.33,1,.68,1), font-size .3s;
}
.maid-dock.peek .maid-avatar { width: 40px; height: 40px; font-size: 15px; margin: auto 0; }
/* 展开态：悬浮头像隐去（头部行内已有 .maid-head-ava），不再多占一整行 */
.maid-dock.open .maid-avatar { display: none; }
.maid-avatar:hover { transform: scale(1.08); }
.maid-dots { display: none; gap: 5px; margin-top: 14px; }
.maid-dock.peek .maid-dots { display: flex; }
.maid-dots i { width: 4px; height: 4px; border-radius: 50%; background: #db2777; opacity: .35; }
.maid-dots i:nth-child(2) { opacity: .6; }
.maid-dots i:nth-child(3) { opacity: .9; }
/* 弹出界面（仅 .open 可见）：头部 + AI 装配间 */
.maid-open-ui { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; width: 100%; }
.maid-dock.open .maid-open-ui { display: flex; }
.maid-open-head {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px 10px 14px; flex: 0 0 auto;
  border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
}
/* 头部行内头像：与标题同排（应用标题栏惯例），替代展开态的悬浮大头像 */
.maid-head-ava {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(135deg, #db2777, #f472b6); color: #fff;
  font-size: 14px; font-weight: 800; flex: 0 0 34px;
  box-shadow: 0 4px 12px rgba(219, 39, 119,.32);
}
.maid-head-info { min-width: 0; flex: 1 1 auto; }
.maid-name { font-size: 14px; font-weight: 700; color: #db2777; line-height: 1.3; letter-spacing: .01em; white-space: nowrap; }
.maid-sub { font-size: 10.5px; color: var(--muted); white-space: nowrap; margin-top: 2px; letter-spacing: .03em; }
.maid-dock-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; position: relative; }
.maid-dock .ai-zone { height: 100%; min-height: 0; flex: 1 1 auto; }
.maid-dock #view-ai { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
/* ===== 遮罩（scrim）统一模型：女仆坞展开时，顶栏之下的页面区域由透明遮罩接管，
 * 点击遮罩 = 仅收起浮层（零副作用）。显隐由 CSS 兄弟选择器驱动，与浮层状态永不失步。
 * z 序 48：盖住页面内容；让位于对话框(50)/客户端中心(60)/Toast(70)。 ===== */
.maid-scrim {
  display: none; position: fixed; top: calc(var(--nav-h) + var(--menu-h)); right: 0; bottom: 0;
  z-index: 48; cursor: default; -webkit-user-select: none; user-select: none;
}
/* 女仆坞遮罩：坞右侧（left 贴坞右缘 400px） */
.maid-dock.open:not(.hidden) ~ .maid-scrim { display: block; left: 400px; }

/* v3：旧插件更新格（.home-update）已由 .home-update-card 取代 */

/* ===== v3 PCL 全视图组件精修（统一视觉语言：绿强调 + 卡片质感 + 标题竖条） ===== */
/* 统计卡（插件中枢首页）：顶部绿色渐变条 + 绿色数字 + 图标着色 */
.stat { position: relative; overflow: hidden; padding: 16px; box-shadow: var(--shadow-card); }
.stat::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--teal), var(--teal-hover)); }
.stat .label svg { color: var(--teal); }
.stat .num { font-size: 28px; font-weight: 700; color: var(--teal-dark); margin-top: 10px; }
/* 区块标题：左侧绿色竖条（所有视图统一） */
.section-head h2 { position: relative; padding-left: 13px; font-size: 16px; }
.section-head h2::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 4px; height: 18px; border-radius: 2px; background: var(--teal); }
/* 提示条（Skill/MCP 分类引导）：绿色浅底亲和 */
.guide-hint { background: var(--teal-soft); border-color: color-mix(in srgb, var(--teal) 28%, var(--line)); color: var(--teal-dark); }
/* 自检行 / 折叠卡 / 工具栏：卡片阴影统一 */
.check-row, .fold, .toolbar { box-shadow: var(--shadow-card); }
/* 折叠卡悬停：左侧绿色刻度 + 阴影浮起 */
.fold { transition: box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.fold:hover { border-color: color-mix(in srgb, var(--teal) 35%, var(--line)); box-shadow: var(--shadow-card-hover); }
.fold-head:hover { background: var(--teal-soft); }
/* 图标块：柔和投影提升质感 */
.pack-icon { box-shadow: 0 2px 6px rgba(17,24,39,.14); }
/* 对话框：PCL 弹窗（顶部绿色条 + 大圆角 + 深投影） */
.dialog { border-radius: var(--rad-lg); box-shadow: 0 24px 60px rgba(17,24,39,.28); border-top: 3px solid var(--teal); }
.dialog h3 { color: var(--teal-dark); }
/* 主题卡：阴影 + 选中绿色描边加粗 */
.skin-card { box-shadow: var(--shadow-card); }
.skin-card.active { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
/* 市场标签计数：去硬编码蓝，走主题变量 */
.mkt-tags-count { background: var(--teal-soft); color: var(--teal-dark); }

/* 无障碍：用户系统开启「减弱动态效果」时，收掉过渡与动画（保留状态切换本身） */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topnav">
    <div class="topnav-title">
      <div class="brand">
        <div class="brand-mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2v7a3 3 0 0 1-3 3H4"/><path d="M15 2v7a3 3 0 0 0 3 3h2"/><path d="M6 12v2a6 6 0 0 0 6 6h0a6 6 0 0 0 6-6v-2"/><path d="M12 20v2"/></svg>
        </div>
        <div class="brand-name">Dseam世界</div>
      </div>
      <div class="topnav-spacer"></div>
      <div class="side-foot" id="sideFoot"></div>
      <div class="win-ctrls">
        <button class="win-btn" id="winMin" title="最小化" aria-label="最小化"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button class="win-btn" id="winMax" title="最大化/还原" aria-label="最大化"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></button>
        <button class="win-btn win-close" id="winClose" title="关闭" aria-label="关闭"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
    </div>
    <!-- 顶部横排主导航（PCL 启动器风）：9 视图项横排，当前项底部指示条高亮，由 renderMainNav() 渲染 -->
    <nav class="mainnav" id="mainNav" aria-label="主导航"></nav>
  </header>
  <div class="app-body">
    <!-- 左侧女仆坞（v1.2，仅主页显示）：左缘玻璃标签 → 悬停延伸玻璃条（无文字）→ 点击弹出 AI 装配间 -->
    <aside class="maid-dock" id="maidDock" aria-label="DeepSeek Harness 女仆 · AI 装配间">
      <span class="maid-hit" aria-hidden="true"></span>
      <button class="maid-avatar" id="maidAvatar" title="小织 · 点击打开 AI 装配间">织</button>
      <div class="maid-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="maid-open-ui">
        <div class="maid-open-head">
          <span class="maid-head-ava" aria-hidden="true">织</span>
          <div class="maid-head-info">
            <div class="maid-name"><span id="aiTitleName">小织女仆</span> · AI 装配间</div>
            <div class="maid-sub">DeepSeek Harness 女仆</div>
          </div>
        </div>
        <div class="maid-dock-body">
          <section id="view-ai" class="view hidden"></section>
        </div>
      </div>
    </aside>
    <!-- 女仆坞展开时的交互遮罩：右侧页面完全不响应鼠标（悬停/按压/聚焦特效都不可能出现），
         点击任意处 = 仅收起坞。z 序在菜单(45)之上、对话框(50)与客户端中心(60)之下，模态层不受影响 -->
    <div class="maid-scrim" id="maidScrim" aria-hidden="true"></div>
  <main class="main">
    <header class="topbar"></header>
    <div class="wrap">
      <section id="view-home" class="view"></section>
      <section id="view-hub" class="view hidden"></section>
      <section id="view-market" class="view hidden"></section>
      <section id="view-memory" class="view hidden"></section>
      <section id="view-check" class="view hidden"></section>
        <section id="view-skills" class="view hidden"></section>
        <section id="view-plugins" class="view hidden"></section>
        <section id="view-mcp" class="view hidden"></section>
        <section id="view-theme" class="view hidden"></section>
    </div>
  </main>
  </div>
</div>
<div class="dialog-backdrop" id="dlgBackdrop">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h3 id="dlgTitle"></h3>
    <div class="body" id="dlgBody"></div>
    <div class="actions">
      <button class="btn" id="dlgCancel">取消</button>
      <button class="btn primary" id="dlgOk">确认</button>
    </div>

const MCP_CMD_SAFE_RE = /^[0-9A-Za-z._~:/@+=%?#-]+$/;
function sanitizeMcpCommand(command, args) {

  if (/[\u0000-\u001f\u007f&|;`$()<>"'\\\s]/.test(cmd)) return { ok: false, error: 'MCP 命令含 shell 元字符或空白' };
  const argList = [];

      if (a.length > 256 || !MCP_CMD_SAFE_RE.test(a) || /[\u0000-\u001f\u007f&|;`$()<>"'\\]/.test(a)) {
        return { ok: false, error: 'MCP 参数含非法字符（仅字母数字 . _ ~ : / @ + = % ? # -）' };
