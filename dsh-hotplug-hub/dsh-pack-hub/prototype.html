<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH 插座中枢 · 原型</title>
<style>
:root {
  --bg: #f1f2ec;
  --panel: #fffef9;
  --ink: #17201d;
  --muted: #66736e;
  --line: #d9ddd4;
  --teal: #0e7c6b;
  --teal-dark: #0f2f2a;
  --teal-soft: #dceeea;
  --teal-hover: #0a6a5c;
  --amber: #b45309;
  --amber-soft: #fbeede;
  --red: #b3261e;
  --red-soft: #fbe7e4;
  --green: #1a7f4b;
  --sidebar-ink: #e7f0ec;
  --nav-ink: #d9e7e0;
  --surface-dark: #10241f;
  --surface-dark-ink: #cde8dd;
  --green-soft: #e7f5eb;
  --neutral-soft: #f0f2ec;
  --font-sans: ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --rad-sm: 6px;
  --rad: 8px;
  --rad-lg: 10px;
  --rad-full: 20px;
  --shadow-toast: 0 8px 24px rgba(0,0,0,.2);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  letter-spacing: 0;
}
button { font: inherit; color: inherit; }
.app {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  min-height: 100vh;
}
.sidebar {
  background: var(--teal-dark);
  color: var(--sidebar-ink);
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.14);
}
.brand-mark {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  background: var(--sidebar-ink);
  border-radius: var(--rad);
  color: var(--teal-dark);
}
.brand-name { font-weight: 700; font-size: 15px; line-height: 1.2; }
.brand-sub { font-size: 11px; opacity: 0.72; margin-top: 3px; }
.nav { display: grid; gap: 4px; }
.nav button {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 10px 12px;
  border: 0; border-radius: var(--rad);
  background: transparent; color: var(--nav-ink);
  text-align: left; cursor: pointer;
  font-size: 14px;
}
.nav button:hover { background: rgba(255, 255, 255, 0.08); }
.nav button.active { background: var(--teal); color: #fff; }
.nav .n-count {
  margin-left: auto; font-size: 11px;
  background: rgba(255,255,255,.16); border-radius: var(--rad-lg); padding: 2px 8px;
}
.nav button.active .n-count { background: rgba(255,255,255,.24); }
.side-foot {
  margin-top: auto;
  background: rgba(255,255,255,0.07);
  border-radius: var(--rad);
  padding: 12px;
  display: grid;
  gap: 8px;
  font-size: 12px;
}
.side-row { display: flex; justify-content: space-between; gap: 8px; }
.side-row .v { color: #fff; font-weight: 600; }
.side-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--amber); color: #fff;
  border-radius: var(--rad-lg); padding: 4px 10px; font-size: 12px; font-weight: 600;
}
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 22px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
.topbar h1 { margin: 0; font-size: 18px; }
.topbar .ctx { font-size: 12px; color: var(--muted); }
.topbar .spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: #f7f8f3;
  color: var(--muted); border-radius: var(--rad-full); padding: 5px 12px; font-size: 12px;
}
.pill.good { color: var(--green); background: var(--green-soft); border-color: #bfe0c6; }
.pill.warn { color: var(--amber); background: var(--amber-soft); border-color: #efd3ae; }
.wrap { padding: 22px; display: grid; gap: 18px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--rad); padding: 14px 16px;
}
.stat .label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.stat .num { font-size: 26px; font-weight: 700; margin-top: 8px; }
.stat .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.section-head h2 { margin: 0; font-size: 15px; }
.section-head .sub { font-size: 12px; color: var(--muted); }
.toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--rad); padding: 12px;
}
.search {
  flex: 1 1 240px; min-width: 180px;
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); border-radius: var(--rad);
  padding: 8px 10px; background: #fff;
}
.search input {
  border: 0; outline: 0; background: transparent; width: 100%; font: inherit;
  color: var(--ink);
}
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: #fff; color: var(--muted);
  border-radius: var(--rad-full); padding: 6px 12px; font-size: 12px; cursor: pointer;
}
.chip.on { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  border-radius: var(--rad); padding: 8px 12px; font-size: 13px; cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: #b8c1b6; background: #f8faf6; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.primary:hover { background: var(--teal-hover); }
.btn.danger { color: var(--red); border-color: #e6b7b1; }
.btn.danger:hover { background: var(--red-soft); }
.btn.sm { padding: 5px 9px; font-size: 12px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.pack-list, .pack-grid, .mem-list, .check-list { display: grid; gap: 10px; }
.pack-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pack {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--rad); padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.pack-top, .mem-top { display: flex; align-items: flex-start; gap: 10px; }
.pack-icon {
  width: 38px; height: 38px; border-radius: var(--rad); flex: 0 0 auto;
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px;
}
.pack-title { flex: 1; min-width: 0; }
.pack-title h3 { margin: 0; font-size: 15px; line-height: 1.35; }
.pack-title .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  font-size: 11px; color: var(--muted);
  background: #f1f3ed; border: 1px solid var(--line);
  padding: 2px 8px; border-radius: var(--rad-lg);
}
.plugins { display: grid; gap: 4px; }
.plugin-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--muted);
  padding: 5px 8px; background: #f6f8f3; border: 1px solid #e9ece4; border-radius: var(--rad-sm);
}
.plugin-row .role { margin-left: auto; color: var(--ink); }
.pack-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; }
.pack-foot .spacer { flex: 1; }
.switch {
  width: 42px; height: 24px; border-radius: 16px;
  border: 1px solid var(--line); background: #d6dbd2;
  position: relative; cursor: pointer; transition: background 0.15s;
  flex: 0 0 auto;
}
.switch::after {
  content: ""; position: absolute; width: 18px; height: 18px;
  border-radius: 50%; background: #fff; top: 2px; left: 2px;
  transition: left 0.15s; box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
.switch[aria-checked="true"] { background: var(--teal); border-color: var(--teal); }
.switch[aria-checked="true"]::after { left: 20px; }
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; border-radius: var(--rad-lg); padding: 3px 9px; font-weight: 600;
}
.badge.ok { background: var(--green-soft); color: var(--green); }
.badge.warn { background: var(--amber-soft); color: var(--amber); }
.badge.err { background: var(--red-soft); color: var(--red); }
.badge.neutral { background: var(--neutral-soft); color: var(--muted); }
.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--rad); padding: 16px;
}
.ai-pane { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 14px; }
.ai-main, .ai-side { display: grid; gap: 12px; align-content: start; }
.req-box {
  width: 100%; min-height: 120px; resize: vertical;
  border: 1px solid var(--line); border-radius: var(--rad); background: #fff;
  padding: 12px; font: inherit; color: var(--ink);
}
.req-box:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
.log-box {
  background: var(--surface-dark); color: var(--surface-dark-ink); border-radius: var(--rad);
  font-family: var(--font-mono);
  font-size: 12px; line-height: 1.7; padding: 12px 14px;
  min-height: 220px; max-height: 360px; overflow-y: auto;
  white-space: pre-wrap;
}
.log-box .ok { color: #7fd6a8; }
.log-box .warn { color: #f3c076; }
.result {
  display: none;
  border: 1px solid var(--teal); background: #f2faf7; border-radius: var(--rad); padding: 14px;
}
.result.show { display: block; }
.result h3 { margin: 0 0 8px; font-size: 14px; }
.json-pre {
  background: #fff; border: 1px solid var(--line); border-radius: var(--rad);
  padding: 10px; font-family: var(--font-mono);
  font-size: 11px; max-height: 220px; overflow: auto; white-space: pre;
  margin: 0;
}
.check-row {
  display: flex; align-items: center; gap: 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--rad);
  padding: 12px 14px;
}
.check-row .name { font-size: 13px; font-weight: 600; }
.check-row .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.check-row .val { margin-left: auto; font-size: 13px; font-family: var(--font-mono); }
.check-row .act { margin-left: 4px; }
.mem-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.mem { background: var(--panel); border: 1px solid var(--line); border-radius: var(--rad); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.kw { font-size: 11px; color: var(--teal); background: var(--teal-soft); border-radius: var(--rad-lg); padding: 2px 8px; }
.empty { color: var(--muted); font-size: 13px; padding: 12px; text-align: center; }
.dialog-backdrop {
  position: fixed; inset: 0; background: rgba(10, 24, 20, 0.45);
  display: none; align-items: center; justify-content: center; z-index: 30; padding: 16px;
}
.dialog-backdrop.show { display: flex; }
.dialog {
  width: min(520px, 100%);
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--rad);
  padding: 18px;
  display: grid; gap: 12px;
}
.dialog h3 { margin: 0; font-size: 16px; }
.dialog .body { font-size: 13px; color: var(--muted); line-height: 1.6; }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--surface-dark); color: #fff; border-radius: var(--rad); padding: 10px 16px;
  font-size: 13px; z-index: 40; box-shadow: var(--shadow-toast);
  opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
.footnote { font-size: 11px; color: var(--muted); }
@media (max-width: 1000px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pack-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ai-pane { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .app { grid-template-columns: 72px minmax(0, 1fr); }
  .brand-name, .brand-sub, .nav span, .nav .n-count, .side-foot { display: none; }
  .sidebar { padding: 12px 10px; }
  .nav button { justify-content: center; padding: 10px 0; }
  .grid-4, .pack-grid, .mem-list { grid-template-columns: 1fr; }
  .wrap { padding: 14px; }
  .topbar { padding: 12px 14px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2v7a3 3 0 0 1-3 3H4"/><path d="M15 2v7a3 3 0 0 0 3 3h2"/><path d="M6 12v2a6 6 0 0 0 6 6h0a6 6 0 0 0 6-6v-2"/><path d="M12 20v2"/></svg>

      <div>
        <div class="brand-name">Dseam世界</div>

  <main class="main">

</div>

</div>
<input type="file" id="importFile" hidden accept=".json,application/json">
<div class="toast" id="toast"></div>

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2600);
}

function download(filename, text, mime = 'application/json') {
  const blob = new Blob([text], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 800);
}

function hideDialog() {

}

function packCard(p, showManage = false) {
  const row = installedRow(p.id);
  const active = row ? row.active : false;
  const installed = Boolean(row);
  const conflict = getConflicts().some((c) => c.packId === p.id);
  const statusBadge = installed
    ? (conflict ? '<span class="badge err">冲突</span>' : '<span class="badge ok">健康</span>')
    : '<span class="badge neutral">未装</span>';
  const letter = (p.name || '包').trim().slice(0, 1);
  const accent = p.accent || '#0e7c6b';
  return `
    <div class="pack">
      <div class="pack-top">
        <div class="pack-icon" style="background:${accent}">${esc(letter)}</div>
        <div class="pack-title">
          <h3>${esc(p.name)}</h3>
          <div class="meta">${esc(p.author || '社区')} · ⭐ ${p.stars || 0} · v${esc(p.version || '0.0.0')}</div>
        </div>
        ${statusBadge}
      </div>
      <div class="tags">${(p.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      <div class="plugins">
        ${(p.bundles || []).slice(0, 5).map((b) => `
          <div class="plugin-row">
            <span>${esc(b.name)}</span>
            <span class="role">${esc(b.role)} · v${esc(b.version)}</span>
          </div>`).join('')}
      </div>
      <div class="pack-foot">
        <span style="font-size:11px;color:var(--muted)">${(p.bundles || []).length} 插件</span>
        <div class="spacer"></div>
        ${showManage && installed
          ? `<button class="btn sm danger" data-uninstall="${p.id}">${ICONS.trash} 卸载</button>
             <button class="switch" role="switch" aria-checked="${active}" aria-label="切换 ${esc(p.name)}" data-toggle="${p.id}"></button>`
          : installed
            ? `<span class="badge ok">${ICONS.check} 已装</span>
               <button class="switch" role="switch" aria-checked="${active}" aria-label="切换 ${esc(p.name)}" data-toggle="${p.id}"></button>`
            : `<button class="btn sm primary" data-install="${p.id}">${ICONS.plus} 一键安装</button>`}
      </div>
    </div>`;
}

function logLine(box, text, cls = '') {
  box.insertAdjacentHTML('beforeend', `<div class="${cls}">${esc(text)}</div>`);
  box.scrollTop = box.scrollHeight;
}

function keywordHits(text) {
  const t = text.toLowerCase();
  const hits = [];
  const map = [
    ['文献', 'research'], ['论文', 'research'], ['科研', 'research'], ['引用', 'research'], ['综述', 'research'],
    ['视频', 'video'], ['剪辑', 'video'], ['字幕', 'video'], ['分镜', 'video'], ['封面', 'video'],
    ['自媒体', 'social'], ['选题', 'social'], ['文案', 'social'], ['热点', 'social'],
    ['考研', 'study'], ['背诵', 'study'], ['闪卡', 'study'], ['真题', 'study'], ['语法', 'study'],
    ['开发', 'dev'], ['代码', 'dev'], ['测试', 'dev'], ['部署', 'dev'], ['全栈', 'dev'],
    ['笔记', 'notes'], ['知识库', 'notes'], ['书摘', 'notes'], ['收藏', 'notes']
  ];
  for (const [kw, id] of map) if (t.includes(kw.toLowerCase())) hits.push(id);
  return [...new Set(hits)];
}

function compose() {
  const input = $('reqInput').value.trim();
  if (!input || aiRunning) return;
  aiRunning = true;
  aiResult = null;
  renderAi();
  const box = $('logBox');
  const rootPacks = CATALOG.filter((p) => keywordHits(input).includes(p.id.replace('pack-', '')));
  const steps = [
    ['拆解需求', `场景关键词：${keywordHits(input).join(', ') || '通用工具'}`],
    ['检索目录', `匹配 ${rootPacks.length} 个候选包，按 star 排序`],
    ['筛选版本', '过滤精确稳定版本、license 与维护状态'],
    ['冲突消解', '处理重复 role，生成冲突矩阵'],
    ['生成文件', '输出 pack manifest + README']
  ];
  let i = 0;
  const tick = () => {
    if (!aiRunning) return;
    if (i < steps.length) {
      logLine(box, `[${i + 1}/5] ${steps[i][0]}`, 'warn');
      logLine(box, '  ' + steps[i][1], 'ok');
      i++;
      setTimeout(tick, 420);
    } else {
      const picked = rootPacks.length ? rootPacks : [CATALOG[0]];
      const bundles = [];
      picked.forEach((p) => p.bundles.forEach((b) => { if (!bundles.some((x) => x.name === b.name)) bundles.push(b); }));
      state.aiCount += 1;
      const packId = 'pack.ai.' + Date.now().toString(36);
      const manifest = {
        packId,
        name: 'AI 定制' + picked.map((p) => p.name.replace('插座包', '')).join('·') + '插座包',
        version: '0.1.0',
        scene: picked[0].id.replace('pack-', '') || 'custom',
        tags: [...new Set(picked.flatMap((p) => p.tags))],
        requires: { dsh: state.dshVersion, node: '>=22.19.0', profile: 'desktop' },
        bundles,
        conflicts: [],
        memory: picked[0].memory || [],
        configDir: 'packs/' + packId,
        market: { author: 'AI Pack Assembler', license: 'MIT', stars: 0, generatedBy: 'dsh-pack-hub prototype' }
      };
      const readme = [
        '# ' + manifest.name,
        '',
        '由 DSH AI 组装器根据需求生成：' + input,
        '',
        '## Bundles',
        '',
        ...bundles.map((b) => '- `' + b.name + '@' + b.version + '` · ' + b.role),
        '',
        '## Memory',
        '',
        ...(manifest.memory || []).map((m) => '- ' + m),
        '',
        '## 安装',
        '',
        '1. 在 DSH 插件市场或插件中枢导入本包。',
        '2. 确认版本与冲突信息后安装。',
        '3. 重启 DSH 生效。'
      ].join('\n');
      aiResult = { name: manifest.name, tags: manifest.tags, manifest, readme };
      logLine(box, '完成：pack + README 已就绪', 'ok');
      aiRunning = false;
      renderAi();
      const exp = $('exportPack');
      if (exp) exp.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  };
  tick();
}

function simulateConflicts(rows) {
  const out = [];
  const activeBundles = new Map();
  rows.filter((i) => i.active).forEach((row) => {
    const p = packOf(row.packId);
    if (!p) return;
    p.bundles.forEach((b) => {
      if (activeBundles.has(b.name)) {
        const prev = activeBundles.get(b.name);
        if (prev.version !== b.version) out.push({ packId: p.id, reason: `${b.name} 版本冲突 ${prev.version} vs ${b.version}`, suggest: '停用其中一个包或更新到同一版本' });
      } else {
        activeBundles.set(b.name, b);
      }
    });
  });
  const contentCollision = new Set();
  rows.filter((i) => i.active).forEach((row) => {
    const p = packOf(row.packId);
    if (!p) return;
    p.bundles.forEach((b) => {
      if (!contentCollision.has(b.role)) contentCollision.add(b.role);
      else if (!out.some((c) => c.packId === p.id && c.reason.includes('重复角色'))) out.push({ packId: p.id, reason: `重复角色：${b.role}`, suggest: '保留角色更完整的包' });
    });
  });
  return [...new Map(out.map((o) => [o.packId + o.reason, o])).values()];
}
function getConflicts() {
  return simulateConflicts(state.installed);
}

function renderAll() {
  renderShell();
  renderCurrent();
}

function bindGlobal() {
  document.addEventListener('click', (e) => {
    const inst = e.target.closest('[data-install]');
    if (inst) { installPack(inst.dataset.install); return; }
    const tog = e.target.closest('[data-toggle]');
    if (tog) { togglePack(tog.dataset.toggle, tog); return; }
    const un = e.target.closest('[data-uninstall]');
    if (un) { uninstallPack(un.dataset.uninstall); return; }
    const mem = e.target.closest('[data-mem]');
    if (mem) { toast('记忆包保持全局激活'); return; }
      const sk = e.target.closest('[data-skill]');
      if (sk) { const row = (state.skills||[]).find((s) => s.id === sk.dataset.skill); if (row) { row.enabled = !row.enabled; save(); renderSkills(); } return; }
      const mc = e.target.closest('[data-mcp]');
      if (mc) { const row = (state.mcps||[]).find((m) => m.id === mc.dataset.mcp); if (row) { row.enabled = !row.enabled; save(); renderMcp(); } return; }
  });
  $('importFile').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        importPacks([data]);
      } catch (err) {
        toast('文件不是合法 JSON');
      }
    };
    reader.readAsText(file);
  });
}

function installPack(id) {
  const p = packOf(id);
  if (!p || isInstalled(id)) { if (isInstalled(id)) toast('该包已安装'); return; }
  const conflicts = getConflicts().filter((c) => c.packId === id);
  showDialog('安装 ' + p.name,
    `<div class="body">
      <div>packId：<code>${esc(p.id)}</code></div>
      <div>版本：<code>${esc(p.version)}</code></div>
      <div>插件：${(p.bundles || []).map((b) => `<code>${esc(b.name)}</code>`).join('、')}</div>
      ${conflicts.length ? `<div style="color:var(--red)">已检测到 ${conflicts.length} 项冲突，安装后需处理。</div>` : ''}
      <div>安装会修改当前 profile，完成后需要重启。</div>
    </div>`,
    () => {
      state.installed.push({ packId: id, active: true, installedAt: today(), status: 'healthy' });
      state.pendingRestart += 1;
      save(); renderAll(); switchView('hub');
      toast(p.name + ' 已安装，重启后生效');
    }, '确认安装');
}

function togglePack(id, el) {
  const row = installedRow(id);
  if (!row) return;
  const next = !row.active;
  const p = packOf(id);
  if (next && p) {
    const tmp = [...state.installed.filter((x) => x.packId !== id), { ...row, active: true }];
    const conflicts = simulateConflicts(tmp).filter((c) => c.packId === id);
    if (conflicts.length) {
      showDialog('存在冲突', `<div class="body">${conflicts.map((c) => '<div>' + esc(c.reason) + '</div>').join('')}<div>建议先停用冲突包或选择替换版本。</div></div>`, () => {});
      return;
    }
  }
  row.active = next;
  state.pendingRestart += 1;
  save(); renderAll();
  toast(next ? p.name + ' 已激活' : p.name + ' 已停用');
}

function uninstallPack(id) {
  const p = packOf(id);
  if (!p) return;
  showDialog('卸载 ' + p.name,
    `<div class="body">将移除该包关联的插件与 receipt。此操作需要重启后完全生效。</div>`,
    () => {
      state.installed = state.installed.filter((i) => i.packId !== id);
      state.pendingRestart += 1;
      save(); renderAll();
      toast(p.name + ' 已卸载');
    }, '卸载');
}

function importPacks(list) {
  const ok = [];
  const bad = [];
  list.forEach((data) => {
    if (!data || typeof data !== 'object' || !data.packId || !data.bundles || !Array.isArray(data.bundles) || !data.name) {
      bad.push(data && data.name ? data.name : '未知包');
      return;
    }
    const id = data.packId;
    if (isInstalled(id) || state.imported.some((p) => p.id === id)) { bad.push(data.name + '（已存在）'); return; }
    const norm = {
      id,
      name: data.name,
      author: data.market && data.market.author ? data.market.author : '本地导入',
      stars: data.market && data.market.stars ? data.market.stars : 0,
      version: data.version || '0.0.0',
      tags: data.tags || [],
      desc: data.description || '',
      bundles: data.bundles.map((b) => ({ name: b.package || b.name, role: b.role || '工具', version: b.version || '0.0.0' })),
      memory: data.memory || [],
      accent: '#3d5a6c',
      imported: true
    };
    state.imported.push(norm);
    ok.push(norm);
  });
  if (ok.length) {
    state.installed.push(...ok.map((p) => ({ packId: p.id, active: true, installedAt: today(), status: 'healthy' })));
    state.pendingRestart += ok.length;
    save(); renderAll(); switchView('hub');
    toast(ok.map((p) => p.name).join('、') + ' 已导入');
  }
  if (bad.length) toast('跳过：' + bad.join('、'));
}

function today() {
  return new Date().toISOString().slice(0, 10);
}

document.addEventListener('DOMContentLoaded', () => {
  bindGlobal();
  renderAll();
});
