<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH 插座中枢 · 原型</title>
<style>
:root {
  --bg: #f1f2ec;
  --panel: #fffef9;
  --ink: #17201d;
  --muted: #66736e;
  --line: #d9ddd4;
  --teal: #0e7c6b;
  --teal-dark: #0f2f2a;
  --teal-soft: #dceeea;
  --teal-hover: #0a6a5c;
  --amber: #b45309;
  --amber-soft: #fbeede;
  --red: #b3261e;
  --red-soft: #fbe7e4;
  --green: #1a7f4b;
  --sidebar-ink: #e7f0ec;
  --nav-ink: #d9e7e0;
  --surface-dark: #10241f;
  --surface-dark-ink: #cde8dd;
  --green-soft: #e7f5eb;
  --neutral-soft: #f0f2ec;
  --font-sans: ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --rad-sm: 6px;
  --rad: 8px;
  --rad-lg: 10px;
  --rad-full: 20px;
  --shadow-toast: 0 8px 24px rgba(0,0,0,.2);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  letter-spacing: 0;
}
button { font: inherit; color: inherit; }
.hidden { display: none !important; }
.app {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  min-height: 100vh;
}
.sidebar {
  background: var(--teal-dark);
  color: var(--sidebar-ink);
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.14);
}
.brand-mark {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  background: var(--sidebar-ink);
  border-radius: var(--rad);
  color: var(--teal-dark);
}
.brand-name { font-weight: 700; font-size: 15px; line-height: 1.2; }
.brand-sub { font-size: 11px; opacity: 0.72; margin-top: 3px; }
.nav { display: grid; gap: 4px; }
.nav button {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 10px 12px;
  border: 0; border-radius: var(--rad);
  background: transparent; color: var(--nav-ink);
  text-align: left; cursor: pointer;
  font-size: 14px;
}
.nav button:hover { background: rgba(255, 255, 255, 0.08); }
.nav button.active { background: var(--teal); color: #fff; }
.nav .n-count {
  margin-left: auto; font-size: 11px;
  background: rgba(255,255,255,.16); border-radius: var(--rad-lg); padding: 2px 8px;
}
.nav button.active .n-count { background: rgba(255,255,255,.24); }
.side-foot {
  margin-top: auto;
  background: rgba(255,255,255,0.07);
  border-radius: var(--rad);
  padding: 12px;
  display: grid;
  gap: 8px;
  font-size: 12px;
}
.side-row { display: flex; justify-content: space-between; gap: 8px; }
.side-row .v { color: #fff; font-weight: 600; }
.side-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--amber); color: #fff;
  border-radius: var(--rad-lg); padding: 4px 10px; font-size: 12px; font-weight: 600;
}
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 22px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
.topbar h1 { margin: 0; font-size: 18px; }
.topbar .ctx { font-size: 12px; color: var(--muted); }
.topbar .spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: #f7f8f3;
  color: var(--muted); border-radius: var(--rad-full); padding: 5px 12px; font-size: 12px;
}
.pill.good { color: var(--green); background: var(--green-soft); border-color: #bfe0c6; }
.pill.warn { color: var(--amber); background: var(--amber-soft); border-color: #efd3ae; }
.wrap { padding: 22px; display: grid; gap: 18px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--rad); padding: 14px 16px;
}
.stat .label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.stat .num { font-size: 26px; font-weight: 700; margin-top: 8px; }
.stat .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.section-head h2 { margin: 0; font-size: 15px; }
.section-head .sub { font-size: 12px; color: var(--muted); }
.toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--rad); padding: 12px;
}
.search {
  flex: 1 1 240px; min-width: 180px;
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); border-radius: var(--rad);
  padding: 8px 10px; background: #fff;
}
.search input {
  border: 0; outline: 0; background: transparent; width: 100%; font: inherit;
  color: var(--ink);
}
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: #fff; color: var(--muted);
  border-radius: var(--rad-full); padding: 6px 12px; font-size: 12px; cursor: pointer;
}
.chip.on { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  border-radius: var(--rad); padding: 8px 12px; font-size: 13px; cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: #b8c1b6; background: #f8faf6; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.primary:hover { background: var(--teal-hover); }
.btn.danger { color: var(--red); border-color: #e6b7b1; }
.btn.danger:hover { background: var(--red-soft); }
.btn.sm { padding: 5px 9px; font-size: 12px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.pack-list, .pack-grid, .mem-list, .check-list { display: grid; gap: 10px; }
.pack-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pack {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--rad); padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.pack-top, .mem-top { display: flex; align-items: flex-start; gap: 10px; }
.pack-icon {
  width: 38px; height: 38px; border-radius: var(--rad); flex: 0 0 auto;
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px;
}
.pack-title { flex: 1; min-width: 0; }
.pack-title h3 { margin: 0; font-size: 15px; line-height: 1.35; }
.pack-title .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  font-size: 11px; color: var(--muted);
  background: #f1f3ed; border: 1px solid var(--line);
  padding: 2px 8px; border-radius: var(--rad-lg);
}
.plugins { display: grid; gap: 4px; }
.plugin-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--muted);
  padding: 5px 8px; background: #f6f8f3; border: 1px solid #e9ece4; border-radius: var(--rad-sm);
}
.plugin-row .role { margin-left: auto; color: var(--ink); }
.pack-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; }
.pack-foot .spacer { flex: 1; }
.switch {
  width: 42px; height: 24px; border-radius: 16px;
  border: 1px solid var(--line); background: #d6dbd2;
  position: relative; cursor: pointer; transition: background 0.15s;
  flex: 0 0 auto;
}
.switch::after {
  content: ""; position: absolute; width: 18px; height: 18px;
  border-radius: 50%; background: #fff; top: 2px; left: 2px;
  transition: left 0.15s; box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
.switch[aria-checked="true"] { background: var(--teal); border-color: var(--teal); }
.switch[aria-checked="true"]::after { left: 20px; }
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; border-radius: var(--rad-lg); padding: 3px 9px; font-weight: 600;
}
.badge.ok { background: var(--green-soft); color: var(--green); }
.badge.warn { background: var(--amber-soft); color: var(--amber); }
.badge.err { background: var(--red-soft); color: var(--red); }
.badge.neutral { background: var(--neutral-soft); color: var(--muted); }
.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--rad); padding: 16px;
}
.ai-pane { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 14px; }
.ai-main, .ai-side { display: grid; gap: 12px; align-content: start; }
/* ===== 沉浸式聊天（AI 装配间 v2：聊天为主视觉，底部输入坞，产品化细节） ===== */
/* AI 视图激活（body.ai-view-active）：锁定整页滚动 + 隐藏页面级顶栏——唯一顶栏 + 单屏
   （页面可滚时 ai-zone 固定高度会与整页滚动错位；双顶栏视觉重复，一并消除） */
body.ai-view-active { overflow: hidden; }
body.ai-view-active .topbar { display: none; }
.ai-zone { display: flex; flex-direction: column; height: 100vh; min-height: 460px; }
.ai-topbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 22px; background: var(--panel);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 6;
}
.ai-title { display: flex; align-items: baseline; gap: 8px; font-weight: 700; font-size: 15px; }
.ai-brandmark {
  width: 22px; height: 22px; display: grid; place-items: center; align-self: center;
  background: var(--teal-dark); color: #fff; border-radius: 7px;
  font-size: 12px; font-weight: 800; flex: 0 0 22px;
}
.ai-title .sub { font-size: 12px; color: var(--muted); font-weight: 400; }
.ai-topbar .spacer { flex: 1; }
.ai-chip-btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: #fff; border-radius: 999px;
  padding: 6px 12px; font-size: 13px; color: var(--ink); cursor: pointer;
}
.ai-chip-btn:hover { border-color: var(--teal); color: var(--teal); }
.ai-chip-btn.active { border-color: var(--teal); background: rgba(16,124,107,.08); color: var(--teal); }
.ai-turn-badge { font-size: 12px; color: var(--muted); white-space: nowrap; }
/* 连接设置面板 v3：干净栅格 + 统一控件 + 明确分组（与 AI 装配间整体风格一致） */
.ai-settings {
  width: min(720px, calc(100% - 44px)); margin: 0 auto; padding: 12px 0 2px;
  display: grid; gap: 8px;
}
.ai-settings-panel {
  border: 1px solid var(--line); border-radius: 14px; background: #fff;
  padding: 14px 16px; display: grid; gap: 10px;
  box-shadow: 0 6px 24px rgba(15,23,42,.06);
}
.ai-cfg-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 700; color: var(--ink);
}
.ai-cfg-title .k {
  width: 20px; height: 20px; display: grid; place-items: center; align-self: center;
  background: var(--teal-dark); color: #fff; border-radius: 6px;
  font-size: 11px; font-weight: 800;
}
.ai-cfg-note { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 400; }.ai-settings-panel .row {
  display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: center;
}
.ai-settings-panel .row .ai-label { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.ai-settings-panel .row .ctl-line { display: flex; gap: 10px; min-width: 0; flex-wrap: wrap; }
.ai-ctl {
  box-sizing: border-box; width: 100%; height: 34px; padding: 0 10px;
  border: 1px solid #d8dee6; border-radius: 9px; background: #fff;
  font: inherit; font-size: 13px; color: var(--ink); min-width: 0;
  transition: border-color .15s, box-shadow .15s;
}
.ai-ctl::placeholder { color: #9aa6b5; }
.ai-ctl:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(16,124,107,.12); }
.ai-ctl:disabled { background: #f4f6f2; color: var(--muted); cursor: not-allowed; }
select.ai-ctl { cursor: pointer; padding-right: 8px; }
.ai-ctl-btn {
  height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: 9px;
  background: #fff; color: var(--ink); font-size: 13px; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
}
.ai-ctl-btn:hover { border-color: var(--teal); color: var(--teal); }
.ai-ctl-btn:disabled { opacity: .55; cursor: default; }
.ai-ctl-btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.ai-ctl-btn.primary:hover { background: var(--teal-dark); }
.ai-shell-note { font-size: 12px; color: var(--muted); }
.ai-hint { font-size: 11.5px; color: var(--muted); line-height: 1.7; padding: 0 2px; }
.ai-hint b { color: var(--teal-dark); font-weight: 600; }
.ai-scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
.ai-scroll::-webkit-scrollbar { width: 8px; }
.ai-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
.ai-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
.ai-scroll::-webkit-scrollbar-track { background: transparent; }
.ai-col { max-width: 780px; margin: 0 auto; padding: 22px 24px 12px; display: flex; flex-direction: column; gap: 16px; }
/* 空态欢迎 */
.ai-welcome {
  border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(160deg, #f0fdfa 0%, #f8fafc 60%, #fff 100%);
  padding: 30px 26px; display: grid; gap: 12px; text-align: center;
}
.ai-welcome .greet { font-size: 22px; font-weight: 800; color: var(--teal-dark); }
.ai-welcome .desc { font-size: 14px; color: var(--ink-dim); line-height: 1.8; max-width: 520px; margin: 0 auto; }
.ai-welcome .pv-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.ai-welcome .pv {
  display: inline-flex; gap: 8px; align-items: center;
  border: 1px solid var(--line); border-radius: 12px; background: #fff;
  padding: 10px 16px; font-size: 13px; cursor: pointer; color: var(--ink);
  transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
}
.ai-welcome .pv:hover { transform: translateY(-1px); border-color: var(--teal); box-shadow: 0 6px 18px rgba(16,124,107,.12); }
.ai-welcome .pv svg { width: 16px; height: 16px; }
/* 消息气泡 */
.ai-msg { display: flex; gap: 10px; align-items: flex-start; animation: aiIn .24s ease; }
.ai-msg.user { flex-direction: row-reverse; }
@keyframes aiIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.ai-avatar {
  flex: 0 0 34px; width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center; font-size: 15px; font-weight: 700;
  border: 1px solid var(--line); background: #fff;
}
.ai-avatar.av-err { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
.ai-msg.user .ai-avatar { background: var(--teal-dark); border-color: var(--teal-dark); color: #fff; font-size: 12px; }
.ai-bubble {
  max-width: 78%; border-radius: 16px; padding: 11px 15px;
  font-size: 14px; line-height: 1.75; white-space: pre-wrap; word-break: break-word;
}
.ai-msg.assistant .ai-bubble {
  background: #fff; border: 1px solid var(--line);
  border-top-left-radius: 5px; color: var(--ink);
  box-shadow: 0 2px 10px rgba(15,23,42,.05);
}
/* 气泡内轻量 markdown（先转义后渲染，安全） */
.ai-bubble code {
  background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 4px;
  padding: 1px 5px; font-family: var(--font-mono); font-size: 12.5px;
}
.ai-bubble pre {
  background: #0f172a; color: #e2e8f0; border-radius: 10px;
  padding: 10px 12px; overflow-x: auto; margin: 8px 0;
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; white-space: pre;
}
.ai-bubble pre code { background: none; border: none; padding: 0; color: inherit; font-size: inherit; }
.ai-bubble b { font-weight: 700; }
.ai-msg.user .ai-bubble {
  background: linear-gradient(135deg, #0e7c6b, #115e59); color: #fff;
  border-top-right-radius: 5px;
}
.ai-msg.err .ai-bubble { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
/* 打字指示器 */
.ai-typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 2px; }
.ai-typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: aiDot 1.1s infinite; }
.ai-typing i:nth-child(2) { animation-delay: .18s; }
.ai-typing i:nth-child(3) { animation-delay: .36s; }
@keyframes aiDot { 0%,60%,100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
/* 产物卡片（聊天流内嵌） */
.ai-pack-card {
  border: 1px solid var(--line); border-radius: 16px; background: #fff;
  padding: 14px 16px; display: grid; gap: 10px; margin-left: 44px; max-width: calc(100% - 44px);
  box-shadow: 0 4px 16px rgba(15,23,42,.05); animation: aiIn .28s ease;
}
.ai-pack-card .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pack-mark {
  width: 22px; height: 22px; display: grid; place-items: center; flex: 0 0 22px;
  background: var(--teal-dark); color: #fff; border-radius: 7px;
  font-size: 11px; font-weight: 800;
}
.ai-pack-card .name { font-weight: 700; font-size: 15px; color: var(--ink); }
.ai-pack-card .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.ai-diff { display: flex; gap: 6px; flex-wrap: wrap; }
.ai-diff b { font-weight: 600; border-radius: 8px; padding: 2px 8px; font-size: 12px; }
.ai-diff .add { background: #ecfdf5; color: #047857; }
.ai-diff .del { background: #fef2f2; color: #b91c1c; }
.ai-diff .chg { background: #fffbeb; color: #b45309; }
.ai-plugins { display: flex; flex-direction: column; gap: 4px; }
.ai-plugins .p { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.ai-plugins .p .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); flex: 0 0 7px; }
.ai-plugins .p .pn { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; color: var(--ink); }
.ai-plugins .p .pv { color: var(--muted); font-size: 12px; }
.ai-pack-card .acts { display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 10px; }
/* 底部输入坞 */
.ai-dock {
  border-top: 1px solid var(--line); background: var(--panel);
  padding: 12px 22px 14px; position: sticky; bottom: 0; z-index: 6;
}
.ai-dock-inner { max-width: 780px; margin: 0 auto; display: grid; gap: 8px; }
.ai-samples { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.ai-samples::-webkit-scrollbar { display: none; }
.ai-samples .chip { white-space: nowrap; font-size: 12.5px; }
.ai-input-wrap {
  display: flex; align-items: flex-end; gap: 10px;
  border: 1.5px solid var(--line); border-radius: 18px; background: #fff;
  padding: 10px 10px 10px 16px; transition: border-color .15s ease, box-shadow .15s ease;
}
.ai-input-wrap:focus-within { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(16,124,107,.12); }
.ai-input-wrap textarea {
  flex: 1; border: 0; outline: 0; resize: none; background: transparent;
  font: inherit; font-size: 14px; line-height: 1.6; max-height: 150px; min-height: 24px;
  padding: 2px 0; color: var(--ink);
}
.ai-send {
  flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%; border: 0;
  background: var(--teal); color: #fff; cursor: pointer; display: grid; place-items: center;
  transition: background .15s ease, transform .12s ease;
}
.ai-send:hover { background: var(--teal-dark); }
.ai-send:active { transform: scale(.94); }
.ai-send:disabled { background: #cbd5e1; cursor: default; }
.ai-send svg { width: 18px; height: 18px; }
.ai-dock-note { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }

const MCP_CMD_SAFE_RE = /^[0-9A-Za-z._~:/@+=%?#-]+$/;
function sanitizeMcpCommand(command, args) {
  const cmd = String(command || '').trim();

      if (a === '') continue;
      if (a.length > 256 || !MCP_CMD_SAFE_RE.test(a) || /[\u0000-\u001f\u007f&|;`$()<>"'\\]/.test(a)) {
        return { ok: false, error: 'MCP 参数含非法字符（仅字母数字 . _ ~ : / @ + = % ? # -）' };
      }
      argList.push(a);
    }
  }
  return { ok: true, command: cmd, args: argList };
}
// H-10（v5 阶段 4）：git ref 校验（允许合法 /，拒绝 .. / 纯点 / 控制字符 / 空段）
function validateSourceRef(ref) {

  if (ref.includes('..') || /^[.]+$/.test(ref)) return false;
  return /^[0-9A-Za-z._-]+(\/[0-9A-Za-z._-]+)*$/.test(ref);
}

// 把「来源集合」（['github','ghfast.top',...]）映射为候选 URL；github=官方原始 URL
function candidatesFromSources(sources, officialUrl) {

    if (s === MARKET_SOURCE_GITHUB) { out.push(officialUrl); }

function apiSearchUrls(topic, q, page, sources) {

  return candidatesFromSources(sources, 'https://api.github.com/search/repositories?' + query);
}

function rawFileUrls(repo, ref, path, sources) {

// 带超时的 fetch：浏览器 fetch 无自动超时，镜像挂起会永远不 settle，这里用 AbortController 兜底
const FETCH_TIMEOUT_MS = 12000;
async function fetchTimeout(url, opts) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
  try { return await fetch(url, Object.assign({}, opts, { signal: ctrl.signal })); }
  finally { clearTimeout(timer); }
}

// 依次尝试多个 URL，全部失败返回最后一个错误信息
async function fetchAny(urls, opts) {
  let lastErr = '';
  for (const url of urls) {
    try {
      const res = await fetchTimeout(url, opts);
      if (!res.ok) { lastErr = 'HTTP ' + res.status; continue; }
      return { ok: true, status: res.status, text: await res.text(), url };
    } catch (e) { lastErr = e && e.message ? e.message : String(e); continue; }
  }
  return { ok: false, error: lastErr };
}

// 多通道竞速：官方与镜像同时发起请求，取第一个成功响应（"哪个快用哪个"）。
// 仅用于市场检索（searchMarketRepos）；raceFilesAny 处理原始文件全并发测速。
function raceFetchAny(urls, opts) {
  return new Promise((resolve) => {
    if (!Array.isArray(urls) || urls.length === 0) return resolve({ ok: false, error: '' });
    let settled = false;
    let failures = 0;
    for (const url of urls) {
      fetchTimeout(url, opts).then(async (res) => {
        if (settled) return;
        if (res.ok) {
          settled = true;
          const text = await res.text();
          resolve({ ok: true, status: res.status, text, url, raced: true });
          return;
        }
        failures += 1;
        if (failures === urls.length) resolve({ ok: false, error: 'HTTP ' + res.status });
      }).catch((e) => {
        if (settled) return;
        failures += 1;
        if (failures === urls.length) resolve({ ok: false, error: e && e.message ? e.message : String(e) });
      });
    }
  });
}

async function fetchJson(urls) {
  const r = await fetchAny(urls, { headers: { Accept: 'application/vnd.github+json' } });
  if (!r.ok) return { ok: false, error: r.error };
  try { return { ok: true, json: JSON.parse(r.text), url: r.url }; }
  catch (e) { return { ok: false, error: '响应不是合法 JSON: ' + e.message }; }
}

/** 从成功响应的 url 提取域名（如 api.github.com / ghfast.top），用作"来源"展示。 */
function hostOf(url) {
  try { return new URL(url).host; } catch (e) { return ''; }
}

/**
 * 原始文件（README/package.json/hotpack 等）全并发测速：官方 + 所有镜像同时发起，
 * 取第一个成功响应（"哪个快用哪个"）。原 scanFiles 是顺序试（官方先、镜像逐个试）——
 * 是市场加载慢的主因。全失败则取第一个失败（404=文件不存在）。
 */
function raceFilesAny(urls, opts) {
  return new Promise((resolve) => {
    if (!Array.isArray(urls) || urls.length === 0) return resolve({ ok: false, error: '' });
    let settled = false;
    let failures = 0;
    let first = null;
    for (const url of urls) {
      fetchTimeout(url, opts).then(async (res) => {
        if (settled) return;
        if (res.ok) {
          settled = true;
          const text = await res.text();
          resolve({ ok: true, status: res.status, text, url, raced: true });
          return;
        }
        if (!first) first = res;
        failures += 1;
        if (failures === urls.length) resolve({ ok: false, error: 'HTTP ' + first.status, url: first.url });
      }).catch((e) => {
        if (settled) return;
        failures += 1;
        if (failures === urls.length) resolve({ ok: false, error: e && e.message ? e.message : String(e), url: first ? first.url : '' });
      });
    }
  });
}

/* ---- 2. README 解析层：提取简介与安装方法 ---- */
function looksLikeNav(para) {
  if (!para) return false;
  const s = String(para).trim();
  if (!s) return true;
  if (/^\s*(English|中文|简体中文|繁體|한국어|日本語|Deutsch|Français|Español|Русский)\s*$/.test(s)) return true;
  const stripped = s.replace(/\[[^\]]*\]\([^)]*\)/g, '').replace(/[#*_>`|~]/g, '').trim();
  return stripped.length < 30 && /(english|中文|简|繁|한국어|日本語|deutsch|français|español|русский)/i.test(stripped);
}

function cleanMd(text) {
  return String(text || '')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')          // 图片
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')        // 链接→文本
    .replace(/`([^`]*)`/g, '$1')                    // 行内代码
    .replace(/[#*_>~|]+/g, ' ')                     // markdown 符号
    .replace(/<[^>]+>/g, '')                        // HTML 标签
    .replace(/[ \t]+/g, ' ')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function extractIntro(readme) {
  if (!readme) return '';
  const lines = String(readme).split('\n');
  const paras = [];
  let buf = '';
  for (const ln of lines) {
    if (!ln.trim()) { if (buf.trim()) paras.push(buf.trim()); buf = ''; continue; }
    buf += (buf ? ' ' : '') + ln.trim();
  }
  if (buf.trim()) paras.push(buf.trim());
  for (const para of paras) {
    const cleaned = cleanMd(para);
    if (!cleaned || looksLikeNav(cleaned)) continue;
    return cleaned.slice(0, 280);
  }
  return '';
}

function extractInstall(readme) {
  if (!readme) return '';
  const lines = String(readme).split('\n');
  let inSection = false;
  let out = [];
  const headRe = /^#{2,4}\s*(安装|安装方法|安装与使用|Installation|Quick Start|快速开始|使用|Usage|Getting Started)/i;
  for (const ln of lines) {
    const h = ln.match(/^#{1,6}\s+(.+)/);
    if (h) {
      if (inSection) break;
      if (headRe.test(ln)) { inSection = true; continue; }
      continue;
    }
    if (inSection) out.push(ln);
  }
  if (!inSection || !out.length) return '';
  const text = out.join('\n').replace(/```[a-z]*\n?/gi, '').replace(/<[^>]+>/g, '').trim();
  return text.slice(0, 1200);
}

// dshpack(.dshpack.json) → hotpack v1 结构
/* ---- 3. manifest 生成层：生成可导入的 hotpack v1 ---- */
// H-11b/c（v5 阶段 4）：id 由显式 bundle.id 派生（无则 role 清洗）；npm 缺精确 version
// 拒绝（不再默认为 'latest'）；与 shared-core dshpackToHotpack 行为等价（M-51 锁定）
function dshpackToHotpack(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { return null; }
  if (!data || typeof data !== 'object') return null;
  const bundles = Array.isArray(data.bundles) ? data.bundles : [];
  if (!data.packId || !data.name || !bundles.length) return null;
  const plugins = bundles.map((b) => {
    if (!b || typeof b !== 'object') return null;
    const name = b.package || b.name || '';
    if (!name) return null;
    const sourceType = (b.source && b.source.type) || 'npm';
    if (sourceType === 'npm' && !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(String(b.version || ''))) return null;
    const p = {
      id: (typeof b.id === 'string' && b.id !== '') ? b.id : String(b.role || 'main').toLowerCase().replace(/[^a-z0-9._-]/g, '-'),
      name,
      source: { type: sourceType }
    };
    if (p.source.type === 'npm') p.version = b.version;
    else if (p.source.type === 'github') {
      if (b.source && b.source.repo) p.source.repo = b.source.repo;
      if (b.source && b.source.ref) p.source.ref = b.source.ref;
    } else if (b.source && b.source.path) p.source.path = b.source.path;
    return p;
  });
  if (plugins.some((p) => p === null)) return null;
  return {
    hotpack: '1.0',
    id: data.packId,
    name: data.name,
    version: data.version || '0.0.0',
    description: data.description || '',
    plugins
  };
}

function packIdOf(repo) {
  return 'pack.' + String(repo).toLowerCase().replace(/[^a-z0-9._-]/g, '-').slice(0, 64);
}

function buildGithubPluginPack(repo, ref, npmName, version, meta) {
  const v = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(String(version || '')) ? version : '0.0.0';
  return {
    hotpack: '1.0',
    id: packIdOf(repo),
    name: (meta && meta.name) || repo.split('/')[1] || repo,
    version: v,
    description: (meta && meta.description) || '',
    tags: (meta && meta.topics) || [],
    plugins: [{
      id: 'main',
      name: npmName || (repo.split('/')[1] || repo),
      // H-10：ref 过 validateSourceRef（非法回落 main）
      source: { type: 'github', repo, ref: validateSourceRef(ref) ? ref : 'main' }
    }]
  };
}

// 搜索结果的列表元数据条目：详情尚未抓取，由并发 fetchRepoDetail 逐条补齐

// 单条详情返回后，只替换对应卡片 DOM，不动工具栏/滚动位置（渐进式填充）

// 拉取单个仓库的详情：包清单 + package.json + README，生成可导入 manifest
async function fetchRepoDetail(repo, ref, meta, sources) {
  const entry = {
    // H-10：ref 过 validateSourceRef（非法回落 main）
    repo, ref: validateSourceRef(ref) ? ref : 'main', name: meta.name, author: meta.author,
    stars: meta.stars, forks: meta.forks, license: meta.license,
    description: meta.description, topics: meta.topics || [],
    version: '', npmName: '', hasPack: false, intro: '', install: '',
    importable: false, importError: '', manifest: null, updatedAt: meta.updatedAt
  };
  let manifest = null;
  let manifestErr = '';
  let pkgName = '', pkgVersion = '';

  const packScans = MARKET_PACK_CANDIDATES.map((f) => rawFileUrls(repo, entry.ref, f, sources));
  const pkgUrl = rawFileUrls(repo, entry.ref, 'package.json', sources);
  const readmeUrls = MARKET_README_CANDIDATES.map((f) => rawFileUrls(repo, entry.ref, f, sources));

  // 竞速取第一个成功的候选文件：各候选（含其镜像 URL）并发发起，任一命中立即结算，
  // 不必等其余候选（否则 7 个 README 候选逐个串行会拖慢整页）。
  const fetchFirstOkAny = (candidateUrlLists, budgetMs) => {
    return new Promise((resolve) => {
      let settled = false;
      const done = (v) => { if (!settled) { settled = true; resolve(v); } };
      const budget = setTimeout(() => done(null), budgetMs);
      let pending = 0;
      for (const urls of candidateUrlLists) {
        pending += 1;
        raceFilesAny(urls, {}).then((r) => {
          if (settled) return;
          if (r.ok) { done(r); return; }
          pending -= 1;
          if (pending === 0) done(null);
        });
      }
    });
  };

  const runPack = async () => {
    const r = await fetchFirstOkAny(packScans, FETCH_TIMEOUT_MS);
    if (!r || !r.ok) return;
    const hp = parseHotpackJson(r.text) || dshpackToHotpack(r.text);
    if (hp) { manifest = hp; entry.hasPack = true; return; }
    manifestErr = 'hotpack/.dshpack 解析失败';
  };
  const runPkg = async () => {
    const r = await raceFilesAny(pkgUrl, {});
    if (r.ok) {
      try {
        const j = JSON.parse(r.text);
        pkgName = j && j.name; pkgVersion = j && j.version;
      } catch (e) { /* 忽略 */ }
    }
  };
  const runReadme = async () => {
    const r = await fetchFirstOkAny(readmeUrls, FETCH_TIMEOUT_MS);
    if (r && r.ok) {
      entry.intro = extractIntro(r.text);
      entry.install = extractInstall(r.text);
    }
  };

  await Promise.all([runPack(), runPkg(), runReadme()]);

  entry.version = pkgVersion || (manifest && manifest.version) || '';
  entry.npmName = pkgName || '';
  if (!manifest) {
    if (pkgName) manifest = buildGithubPluginPack(repo, entry.ref, pkgName, pkgVersion, meta);
    else if (!manifestErr) manifestErr = '未找到 package.json 或 hotpack/.dshpack 清单，无法生成导入包';
  }
  entry.importable = Boolean(manifest);
  entry.importError = manifest ? '' : (manifestErr || '无法生成导入包');
  entry.manifest = manifest;
  return entry;
}

// 兼容宿主端 parseHotpack 的核心校验（prototype 内联精简版；
// M-51/R-v5-2：与 shared-core parseHotpack 的接受/拒绝行为等价，由跨语言断言测试锁定）
function parseHotpackJson(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { return null; }
  if (!data || data.hotpack !== '1.0') return null;
  // 版本必填（精确版本校验在安装侧；此处保证缺 version 直接拒绝，与权威解析器一致）
  if (!data.id || !data.name || !data.version || !Array.isArray(data.plugins)) return null;
  if (data.plugins.length < 1 || data.plugins.length > 5) return null;
  for (const p of data.plugins) {
    if (!p || typeof p !== 'object') return null;
    if (!p.id || !/^[a-z0-9][a-z0-9_-]{0,39}$/.test(p.id)) return null;
    if (!p.name || typeof p.name !== 'string' || p.name.trim() === '') return null;
    if (p.version && !/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(p.version)) return null;
  }
  return data;
}

/* ---- 4. 仓库搜索：按标签分页拉取仓库列表 ---- */
async function searchMarketRepos(topic, q, page, sources) {
  // 选中的来源通道同时发起，取第一个成功响应（"哪个快用哪个"）
  const urls = apiSearchUrls(topic, q, page, sources);
  const r = await raceFetchAny(urls, { headers: { Accept: 'application/vnd.github+json' } });
  if (!r.ok) return { ok: false, error: r.error || '网络请求失败' };
  let json;
  try { json = JSON.parse(r.text); } catch (e) { return { ok: false, error: '响应不是合法 JSON' }; }
  if (!json || !Array.isArray(json.items)) return { ok: false, error: (json && json.message) || '响应结构异常' };
  const items = json.items.filter((it) => it && it.fork !== true);
  return {
    ok: true,
    total: json.total_count || items.length,
    url: r.url,
    fetchedVia: hostOf(r.url),
    items: items.map((it) => ({
      repo: it.full_name,
      // H-10（v5 阶段 4）：ref 过 validateSourceRef（允许合法 /，拒 .. / 纯点 / 控制字符）
      ref: validateSourceRef(it.default_branch || 'main') ? (it.default_branch || 'main') : 'main',
      name: it.name,
      author: it.owner && it.owner.login,
      stars: it.stargazers_count || 0,
      forks: it.forks_count || 0,
      license: it.license && it.license.spdx_id,
      description: it.description || '',
      topics: it.topics || [],
      updatedAt: it.updated_at
    }))
  };
}

// 并发受限地拉取前 N 个仓库的详情
/* ---- 5. 市场加载：搜索 → 并发详情 → 分页去重 → 缓存 ---- */
async function loadMarket(params) {
  const topic = sanitizeTopic(params && params.topic !== undefined ? params.topic : marketTopic);
  const q = (params && params.q) || marketQuery || '';
  const page = (params && params.page) || 1;
  const sources = (params && params.sources) || marketSources || null;
  const refresh = Boolean(params && params.refresh);
  marketTopic = topic || MARKET_DEFAULT_TOPIC;
  marketQuery = q;
  marketSources = sources;
  marketPage = page;
  marketLoading = true;
  marketAppending = page > 1; // 加载更多时不清空已有卡片
  marketError = '';

  // 缓存：仅第一页可命中；加载更多（page>1）与 refresh 都绕过缓存直接抓取
  const cacheKey = marketCacheKey();
  if (!refresh && page === 1) {
    try {
      const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
      if (cached && cached.entries && cached.entries.length) {
        marketData = cached.entries;
        marketTotal = cached.total || marketData.length;
        marketCachedAt = cached.cachedAt || '';
        marketFetchedVia = cached.fetchedVia || '';
        marketLoading = false;
        renderMarket();
        return { ok: true, cached: true, entries: marketData, total: marketTotal, sources, cachedAt: marketCachedAt, fetchedVia: marketFetchedVia };
      }
    } catch (e) { /* 缓存读取失败忽略 */ }
  }

  renderMarket(); // 立即展示 loading
  const search = await searchMarketRepos(marketTopic, q, page, sources);
  if (!search.ok) {
    marketLoading = false;
    marketAppending = false;
    marketError = '抓取失败：' + search.error + '。已回退到内置示例目录。';
    renderMarket();
    return { ok: false, error: search.error };
  }

  // 分页去重：只抓取尚未加载的仓库，已加载的不再重复抓取
  // 第 1 页必须从空集开始去重，否则“刷新”时旧数据会把本次结果全部判为已加载，列表被清空
  const loadedRepos = new Set((page === 1 ? [] : marketData).map((e) => e.repo));
  const metas = search.items.slice(0, 12).filter((m) => !loadedRepos.has(m.repo));

  // 立即渲染元数据卡片（详情占位），不等待详情返回
  const metaEntries = metas.map(metaEntry);
  marketData = page === 1 ? metaEntries : [...marketData, ...metaEntries];
  marketTotal = search.total;
  marketFetchedVia = search.fetchedVia || '';
  marketLoading = false;
  marketAppending = false;
  renderMarket(); // 列表已展示

  // 并发抓详情：谁先返回谁先填入对应卡片，不等待其余
  let idx = 0;
  const worker = async () => {
    while (idx < metas.length) {
      const m = metas[idx++];
      try {
        const entry = await fetchRepoDetail(m.repo, m.ref, m, sources);
        const i = marketData.findIndex((e) => e.repo === m.repo);
        if (i >= 0) marketData[i] = { ...marketData[i], ...entry, detailPending: false };
        patchMarketCard(marketData[i]);
      } catch (e) { /* 单条详情失败：保留列表占位，不阻塞其他 */ }
    }
  };
  const workers = [];
  for (let i = 0; i < Math.min(MARKET_DETAIL_CONCURRENCY, metas.length || 1); i++) workers.push(worker());
  Promise.all(workers).then(() => {
    if (page === 1) {
      try {
        localStorage.setItem(cacheKey, JSON.stringify({ topic: marketTopic, sources, entries: marketData, total: search.total, cachedAt: new Date().toISOString(), fetchedVia: marketFetchedVia }));
      } catch (e) { /* file:// 模式无 localStorage */ }
    }
  });
  return { ok: true, cached: false, entries: marketData, total: search.total, sources, cachedAt: null, fetchedVia: marketFetchedVia };
}

// 多选标签筛选：空数组=全部；否则命中任一选中标签即通过
function matchFilters(tags) {
  if (!marketFilters.length) return true;
  const set = tags || [];
  return marketFilters.some((f) => set.includes(f));
}

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);

}

function download(filename, text, mime = 'application/json') {
  const blob = new Blob([text], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 800);
}

function marketEntryToImport(entry) {

    bundles: (m.plugins || []).map((pl) => ({

/* ---- 6. 市场渲染层：卡片与页面 ---- */
function installedPluginNames() {
  var out = {};
  var rows = (window.__pluginsData && window.__pluginsData.length ? window.__pluginsData : (state.plugins || []));
  rows.forEach(function (r) {
    if (!r) return;
    if (r.id) out[String(r.id).toLowerCase()] = true;
    if (r.name) out[String(r.name).toLowerCase()] = true;
  });
  return out;
}

function marketEntryInstalled(e) {
  if (!e) return false;
  var names = installedPluginNames();
  var cands = [];
  if (e.npmName) cands.push(e.npmName);
  if (e.name) cands.push(e.name);
  var m = e.manifest || {};
  (m.plugins || []).forEach(function (p) { if (p && p.name) cands.push(p.name); });
  return cands.some(function (c) { return names[String(c).toLowerCase()] === true; });
}

function marketInstallSpec(e) {
  var m = e.manifest || {};
  var plugins = Array.isArray(m.plugins) ? m.plugins : [];
  if (e.npmName) return e.version ? e.npmName + "@" + e.version : e.npmName;
  for (var i = 0; i < plugins.length; i++) {
    var p = plugins[i] || {};
    var src = p.source || {};
    if (src.type === "github" && src.repo) {
      return "https://codeload.github.com/" + src.repo + "/tar.gz/refs/" + (src.ref || e.ref || "main");
    }
    if (src.type === "npm" && p.name) {
      return p.version && p.version !== "latest" ? p.name + "@" + p.version : p.name;
    }
    if (p.name && !src.type) return p.name;
  }
  if (e.repo) return "https://codeload.github.com/" + e.repo + "/tar.gz/refs/" + (e.ref || "main");
  return "";
}
function renderMarketCard(e) {
  const accent = '#0e7c6b';
  const letter = (e.name || e.repo).trim().slice(0, 1);

  const metaBits = [];
  metaBits.push(e.author || '—');
  metaBits.push('⭐ ' + (e.stars || 0));
  if (e.version) metaBits.push('v' + e.version);
  if (e.license) metaBits.push(e.license);
  const installed = marketEntryInstalled(e);
  const hasPackBadge = installed
    ? '<span class="badge ok">已安装</span>'

    ? '<span class="badge neutral">加载中</span>'
    : (e.hasPack ? '<span class="badge ok">内置清单</span>' : '<span class="badge neutral">单插件</span>'));
  const installBtn = pending
    ? `<button class="btn sm" disabled>${ICONS.plus} 详情加载中…</button>`
    : (installed
      ? `<span class="badge ok">${ICONS.check} 已安装</span>`
      : (e.importable
      ? `<button class="btn sm primary" data-mkt-install="${esc(e.repo)}">${ICONS.plus} 安装</button>`
      : `<button class="btn sm" disabled title="${esc(e.importError || '无法生成导入包')}">${ICONS.plus} 不可导入</button>`));
  const installHtml = e.install
    ? `<details class="mkt-details"><summary>安装方法</summary><pre class="mkt-pre">${esc(e.install)}</pre></details>`
    : '';
  return `
    <div class="pack" data-repo="${esc(e.repo)}">
      <div class="pack-top">
        <div class="pack-icon" style="background:${accent}">${esc(letter)}</div>
        <div class="pack-title">

    </div>`;
}

/** 连接测试：standalone 直接 fetch 最小请求；EXE 经外壳 aiTest 消息（结果由 __aiTestResult 回传）。 */
async function aiTestConnection() {
  const preset = AI_PRESETS[aiProviderSel] || AI_PRESETS.deepseek;
  const baseURL = aiBaseUrlMem.trim() || preset.baseURL;
  const model = aiModelMem.trim() || preset.model;
  const apiKey = aiKeyMem.trim();
  const btn = $('aiTestBtn');
  if (btn) btn.disabled = true;
  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.postMessage('aiTest:' + JSON.stringify({ model, apiKey, baseURL }));
    return; // 结果经 __aiTestResult 回传（外壳用页面 Key/端点，未填时以外壳配置兜底）
  }
  if (!apiKey) { toast('未填写 API Key：无法测试（本地模拟不需要端点）'); if (btn) btn.disabled = false; return; }
  if (!/^https:\/\//i.test(baseURL)) { toast('Base URL 必须以 https:// 开头（TLS 铁律）'); if (btn) btn.disabled = false; return; }
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    let res;
    try {
      res = await fetch(baseURL.replace(/\/+$/, '') + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
        body: JSON.stringify({ model, messages: [{ role: 'user', content: 'ping' }], max_tokens: 8, temperature: 0 }),
        signal: ctrl.signal
      });
    } finally { clearTimeout(timer); }
    if (res.ok) toast('✓ 连接成功：' + model);
    else {
      const t = (await res.text()).slice(0, 160).replace(apiKey, '***');
      toast('连接失败 HTTP ' + res.status + '：' + t);
    }
  } catch (e) {
    toast('连接失败：' + String((e && e.message) || e));
  }
  if (btn) btn.disabled = false;
}
/** EXE 外壳测试结果回传（true=成功）。 */
window.__aiTestResult = (ok, msg) => {
  const btn = $('aiTestBtn');
  if (btn) btn.disabled = false;
  toast(ok ? ('✓ 连接成功' + (msg ? '：' + msg : '')) : ('连接失败：' + (msg || '请检查配置')));
};

/** 助理文本轻渲染：先 esc 再处理（代码围栏 > 行内代码 > 加粗 > 标题加粗；链接剥为纯文本）。
 *  顺序保证安全：<>& 已转义后匹配 "**" 不会产生新标签；围栏内容整体转义，绝不当 HTML。 */
function fmtAiText(text) {
  const blocks = [];
  let s = String(text == null ? '' : text)
    .replace(/```([\s\S]*?)```/g, (m, code) => {
      blocks.push(code);
      return '\u0000FB' + (blocks.length - 1) + '\u0000';
    });
  s = esc(s)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/^\|[\s:|-]+\|\s*$/gm, '') // 表格分隔行（|---|）降级丢弃
    .replace(/^\|(.+)\|\s*$/gm, (m, inner) => inner.split('|').map((x) => x.trim()).filter(Boolean).join(' · ')) // 表格行 → 纯文本
    .replace(/^#{1,3} (.+)$/gm, '<b>$1</b>');
  return s.replace(/\u0000FB(\d+)\u0000/g, (m, i) => '<pre><code>' + esc(blocks[+i]) + '</code></pre>');
}

/** 消息气泡 + 产物卡片 HTML（头像按每条消息的发信人设渲染：历史消息不随当前人设漂移）。 */
function msgHtml(m, persona) {
  if (m.role === 'user') {
    return `<div class="ai-msg user"><div class="ai-avatar">您</div><div class="ai-bubble">${esc(m.text)}</div></div>`;
  }
  const content = m.text;
  const packCard = m.pack ? packCardHtml(m.pack, m.diff, m.uid) : '';
  const av = m.error ? '!' : personaBadge(m.persona || persona);
  return `<div class="ai-msg assistant${m.error ? ' err' : ''}"><div class="ai-avatar${m.error ? ' av-err' : ''}">${av}</div><div class="ai-bubble">${fmtAiText(content)}</div></div>${packCard}`;
}

/** 产物卡片（频道内嵌：包名 + 插件清单 + diff 徽标 + 操作；data-pid 绑定消息 uid——按钮读自己的卡，刷新/多卡不错位）。 */
function packCardHtml(pack, diff, uid) {
  const d = diff || { added: [], removed: [], changed: [] };
  const diffHtml = (d.added.length + d.removed.length + d.changed.length) > 0
    ? `<div class="ai-diff">${d.added.length ? `<b class="add">+ 新增 ${d.added.length}</b>` : ''}${d.removed.length ? `<b class="del">- 移除 ${d.removed.length}</b>` : ''}${d.changed.length ? `<b class="chg">~ 调整 ${d.changed.length}</b>` : ''}</div>`
    : '';
  const plugs = (pack.plugins || []).map((p) => `<div class="p"><span class="dot"></span><span class="pn">${esc(p.name)}@${esc(p.version)}</span><span class="pv">${esc(p.id)}</span></div>`).join('');
  return `<div class="ai-pack-card" data-pid="${esc(uid || '')}">
    <div class="head"><span class="pack-mark">包</span><span class="name">${esc(pack.name)}</span><span class="meta">${(pack.plugins || []).length} 个插件 ${diffHtml}</span></div>
    <div class="ai-plugins">${plugs}</div>
    <div class="acts">
      <button class="btn primary sm ai-act-import">一键导入</button>
      <button class="btn sm ai-act-copy-manifest">复制 JSON</button>
      <button class="btn sm ai-act-copy-readme">复制 README</button>
      <button class="btn sm ai-act-export">导出到桌面</button>
    </div>
  </div>`;
}

function keywordHits(text) {
  const t = text.toLowerCase();
  const hits = [];
  const map = [
    ['文献', 'research'], ['论文', 'research'], ['科研', 'research'], ['引用', 'research'], ['综述', 'research'],
    ['视频', 'video'], ['剪辑', 'video'], ['字幕', 'video'], ['分镜', 'video'], ['封面', 'video'],
    ['自媒体', 'social'], ['选题', 'social'], ['文案', 'social'], ['热点', 'social'],
    ['考研', 'kaoyan'], ['背诵', 'kaoyan'], ['闪卡', 'kaoyan'], ['真题', 'kaoyan'], ['语法', 'kaoyan'],
    ['开发', 'fullstack'], ['代码', 'fullstack'], ['测试', 'fullstack'], ['部署', 'fullstack'], ['全栈', 'fullstack'],
    ['笔记', 'notes'], ['知识库', 'notes'], ['书摘', 'notes'], ['收藏', 'notes']
  ];
  for (const [kw, id] of map) if (t.includes(kw.toLowerCase())) hits.push(id);
  return [...new Set(hits)];
}

/** 从 LLM 响应提取 JSON（容忍 ```json 代码围栏与说明文字）。 */
function extractJson(text) {
  if (typeof text !== 'string' || text.trim() === '') return null;
  let t = text.trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fence) t = fence[1].trim();
  try {
    return JSON.parse(t);
  } catch {
    const start = t.indexOf('{');
    const end = t.lastIndexOf('}');
    if (start >= 0 && end > start) {
      try { return JSON.parse(t.slice(start, end + 1)); } catch { /* 落空 */ }
    }
  }
  return null;
}

/**
 * AI 装配间（多厂商，OpenAI 兼容协议；人设化对话式装配）：
 *  - 填写了 API Key → 真实调用（LLM 产物经内联 parseHotpackJson 权威校验，再转

 * key 安全：仅本次会话内存读取，不写入 localStorage、不打印、不落盘。
 */
const AI_PRESETS = {

  opencode: { baseURL: 'https://opencode.ai/zen/go/v1', model: 'ox-alpha-free' },
  openrouter: { baseURL: 'https://openrouter.ai/api/v1', model: 'deepseek/deepseek-chat' },
  siliconflow: { baseURL: 'https://api.siliconflow.cn/v1', model: 'deepseek-ai/DeepSeek-V3' },
  moonshot: { baseURL: 'https://api.moonshot.cn/v1', model: 'kimi-k2' },
  zhipu: { baseURL: 'https://open.bigmodel.cn/api/paas/v4', model: 'glm-4.5' },
  minimax: { baseURL: 'https://api.minimaxi.com/v1', model: 'MiniMax-M2.7' },
  custom: { baseURL: '', model: '' }
};
/** hotpack 1.0 → dshpack manifest（导入/导出所用形态）。 */
function toDshpack(hp) {
  return {
    packId: hp.id,
    name: hp.name,
    version: hp.version,
    description: hp.description || '',
    tags: hp.tags || [],
    scene: (hp.id || 'custom').replace(/^pack\.ai\./, '').slice(0, 40) || 'custom',
    bundles: (hp.plugins || []).map((p) => ({
      name: p.name,
      version: p.version,
      role: p.id || '工具',
      ...(p.source && p.source.type !== 'npm' ? { source: p.source } : {})
    })),
    conflicts: [],
    memory: [],
    market: { author: 'AI Pack Assembler', license: 'MIT', stars: 0, generatedBy: 'dsh-pack-hub prototype' }
  };
}

/** 轮次开始（原型与 EXE 注入共用：会话续接/按钮锁定/欢迎卡移除/typing/清空输入一条龙）。 */
function beginTurn(text, persona) {
  if (!aiSession) aiSession = { id: 'ai-' + Date.now().toString(36), persona, messages: [], pack: null };
  else aiSession.persona = persona;
  aiSession.messages.push({ role: 'user', content: text });
  aiMessages.push({ role: 'user', text });
  const wl = document.querySelector('.ai-welcome');
  if (wl) wl.remove();
  const ph = $('reqInput');
  if (ph) ph.placeholder = '继续说…（Enter 发送，Shift+Enter 换行）';
  appendMsgEl({ role: 'user', text }, persona);
  aiRunning = true;
  const sb = $('composeBtn'); if (sb) sb.disabled = true;
  const nsb = $('aiNewSessionBtn'); if (nsb) nsb.disabled = true;
  showTyping();
}
/** 轮次结束状态恢复（发送/新会话解锁、轮次徽标、持久化、回焦输入框）。 */
function endTurnState() {
  aiRunning = false;
  const sb = $('composeBtn'); if (sb) sb.disabled = false;
  const nsb = $('aiNewSessionBtn'); if (nsb) nsb.disabled = false;
  const badge = $('aiTurnBadge');
  if (badge) badge.textContent = '第 ' + aiMessages.filter((m) => m.role === 'user').length + ' 轮';
  aiPersist();
  const inp = $('reqInput'); if (inp) inp.focus();
}
/** 成功轮：助手消息（可带产物）+ 状态恢复。result={manifest,readme} 随消息持久化（刷新后按钮仍可用）。 */
function finishAssistTurn(text, packHp, diff, persona, result) {
  hideTyping();
  aiSession.messages.push({ role: 'assistant', content: text });
  const msg = { role: 'assistant', text, persona, pack: packHp || null, diff: diff || null, uid: 'm' + (++msgSeq) };
  if (result) msg.result = result;
  aiMessages.push(msg);
  appendMsgEl(msg, persona);
  endTurnState();
}
/** 失败轮：错误气泡 + 状态恢复（不污染 LLM 会话上下文）。 */
function failAssistTurn(text, persona) {
  hideTyping();
  aiMessages.push({ role: 'assistant', text, persona, error: true, uid: 'm' + (++msgSeq) });
  appendMsgEl(aiMessages[aiMessages.length - 1], persona);
  endTurnState();
}

/** LLM 原文 → 权威校验 → 产物/回复（原型与 EXE 注入共用同一套校验与话术）。 */
function processAiRaw(content, persona, isFirstTurn, input) {
  const box = $('logBox');
  const manifest = extractJson(content);
  const hp = manifest ? parseHotpackJson(JSON.stringify(manifest)) : null;
  if (hp) {
    const dsh = toDshpack(hp);
    const readme = aiReadme(dsh, input);
    const diff = diffHotpack(aiSession.pack, hp);
    aiSession.pack = hp;
    aiResult = { name: dsh.name, tags: dsh.tags, manifest: dsh, readme };
    logLine(box, isFirstTurn
      ? '[2/2] 校验通过，生成 pack + README…'
      : '产物已更新：新增 ' + diff.added.length + ' · 移除 ' + diff.removed.length + ' · 调整 ' + diff.changed.length, 'ok');
    finishAssistTurn(aiReaction(persona, dsh.name, dsh.bundles.length), hp, diff, persona, { manifest: dsh, readme });
    return;
  }
  const invalid = 'AI 产物未通过 hotpack 1.0 校验（plugins 必须非空）';
  if (manifest || isFirstTurn) {
    // 有 JSON 但校验失败（含对话轮"改清单失败"——不静默回退成闲聊）；首轮无 JSON 同样报错
    logLine(box, '失败：' + invalid, 'err');
    failAssistTurn(aiErrorText(persona, invalid, true), persona);
    return;
  }
  // 对话轮无产物：纯文本回复（LLM 自带人设语气）
  logLine(box, '对话回复（无产物变更）', 'ok');
  finishAssistTurn(content.trim(), null, null, persona);
}

async function compose() {
  const input = $('reqInput').value.trim();
  if (!input || aiRunning) return;
  const apiKey = aiKeyMem.trim();
  const providerId = aiProviderSel;
  const preset = AI_PRESETS[providerId] || AI_PRESETS.deepseek;
  const baseURL = aiBaseUrlMem.trim() || preset.baseURL;
  const model = aiModelMem.trim() || preset.model;
  const persona = ($('aiPersona').value || 'maid');
  const isFirstTurn = !aiSession || aiSession.messages.length === 0 || !aiSession.pack;
  beginTurn(input, persona);
  $('reqInput').value = '';
  $('reqInput').style.height = 'auto';
  const box = $('logBox');

  if (apiKey !== '') {
    // ---- 真实 LLM（首轮组装 / 对话轮，多厂商 OpenAI 兼容协议；人设注入） ----
    if (!/^https:\/\//i.test(baseURL)) {
      logLine(box, '失败：Base URL 必须 https://（TLS 铁律）', 'err');
      failAssistTurn(aiErrorText(persona, 'Base URL 必须 https:// 才能装配（TLS 铁律）', true), persona);
      return;
    }
    logLine(box, (isFirstTurn ? '[1/2] ' : '[1/1] ') + '调用 ' + (providerId === 'custom' ? baseURL : providerId) + ' 装配师（' + model + '，人设=' + persona + '）…', 'warn');
    try {
      const messages = [{ role: 'system', content: buildAiSystem(persona, isFirstTurn ? 'assembly' : 'chat') }];
      if (isFirstTurn) {
        messages.push({ role: 'user', content: '用户需求：' + input + '\n请输出对应的 hotpack 1.0 插件包清单 JSON。' });
      } else {
        for (const m of aiSession.messages.slice(0, -1)) messages.push({ role: m.role, content: m.content });
        const packCtx = aiSession.pack ? '当前已装配的 hotpack 1.0 清单：\n' + JSON.stringify(aiSession.pack) + '\n\n' : '';
        messages.push({ role: 'user', content: packCtx + '用户新指令：' + input + '\n（如需修改清单，输出完整新 JSON；否则正常对话回复）' });
      }
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 90000);
      let res;
      try {
        res = await fetch(baseURL.replace(/\/+$/, '') + '/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
          body: JSON.stringify({
            model,
            messages,
            temperature: 0.8, // 与桌面端统一：0.8 更自然
            max_tokens: 2048,
            stream: false
          }),
          signal: ctrl.signal
        });
      } finally {
        clearTimeout(timer);
      }
      if (!res.ok) {
        const body = (await res.text()).slice(0, 300).replace(apiKey, '***');
        throw new Error('AI 服务 HTTP ' + res.status + '：' + body);
      }
      const json = await res.json();
      const content = json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content;
      if (typeof content !== 'string' || content.trim() === '') throw new Error('AI 响应缺少内容');
      logLine(box, '  LLM 响应 ' + content.length + ' 字符（model=' + (json.model || model) + '）', 'ok');
      processAiRaw(content, persona, isFirstTurn, input);
    } catch (e) {
      logLine(box, '失败：' + String(e.message || e), 'err');
      failAssistTurn(aiErrorText(persona, String(e.message || e), true), persona);
    }
    return;
  }

  // ---- 本地模拟（无 Key；产物标注） ----
  if (!isFirstTurn) {

  const rootPacks = CATALOG.filter((p) => keywordHits(input).includes(p.id.replace('pack-', '')));

    } else {

      };
      const readme = [

        '',
        '由 DSH AI 装配间（本地模拟，未配置 API Key）根据需求生成：' + input,
        '',

        ...bundles.map((b) => '- `' + b.name + '@' + b.version + '` · ' + b.role),

      ].join('\n');
      const hp = {

      };
      aiSession.pack = hp;

      logLine(box, '完成：pack + README 已就绪（本地模拟）', 'ok');

}

/** 新旧 hotpack 产物差异（按插件 id 匹配）。 */
function diffHotpack(oldHp, newHp) {
  const oldList = oldHp && oldHp.plugins ? oldHp.plugins : [];
  const newList = newHp && newHp.plugins ? newHp.plugins : [];
  const oldById = new Map(oldList.map((p) => [p.id, p]));
  const newById = new Map(newList.map((p) => [p.id, p]));
  const added = [];
  const removed = [];
  const changed = [];
  const kept = [];
  for (const p of newList) {
    const prev = oldById.get(p.id);
    if (!prev) { added.push(p); continue; }
    if (prev.name !== p.name || prev.version !== p.version) changed.push({ id: p.id, from: prev.version, to: p.version });
    else kept.push(p);
  }
  for (const p of oldList) if (!newById.has(p.id)) removed.push(p);
  return { added, removed, changed, kept };
}

      <button class="btn primary" id="addMcpBtn">＋ 新增 MCP</button>
    </div>
    <div class="section-head" style="margin-top:18px"><div><h2>MCP 市场</h2><div class="sub">暂无内置示例，可手动新增本地 MCP</div></div></div>
    <div class="empty">暂无 MCP 市场条目</div>`;
  const add = $('addMcpBtn');
  if (add) add.addEventListener('click', () => {
    const name = $('newMcpName').value.trim();
    const transport = $('newMcpTransport').value;
    const command = $('newMcpCmd').value.trim();
    const args = $('newMcpArgs').value.trim();
    if (!name) return;
    // M-52（v5 阶段 4）：command/args 白名单——拒绝 shell 元字符/控制字符/空白
    const safeMcp = sanitizeMcpCommand(command, args);
    if (!safeMcp.ok) { alert(safeMcp.error); return; }
    const payload = { name, transport, command: safeMcp.command, args: safeMcp.args, url: safeMcp.command };
    if (window.chrome && window.chrome.webview) { window.chrome.webview.postMessage('addMcp:' + JSON.stringify(payload)); return; }
    state.mcps = state.mcps || [];
    state.mcps.push({ id: name, name, enabled: false, transport, command: safeMcp.command, args: safeMcp.args, url: safeMcp.command });
    save(); renderMcp();
  });

  document.querySelectorAll('[data-test-mcp]').forEach((b) => b.addEventListener('click', () => {
    if (window.chrome && window.chrome.webview) { window.chrome.webview.postMessage('startMcp:' + b.dataset.testMcp); return; }
    alert('测试需在 DSH Desktop 的 WebView 中运行');
  }));
  document.querySelectorAll('[data-del-mcp]').forEach((b) => b.addEventListener('click', () => {
    removeMcp(b.dataset.delMcp);
  }));
}
function renderCheck() {
  const checks = getChecks();
  $('view-check').innerHTML = `
    <div class="section-head">

      <div style="display:flex;gap:8px">
        <button class="btn" id="recheck">${ICONS.refresh} 重新自检</button>
        <button class="btn" id="fixEnv">${ICONS.restart} 一键修复环境</button>
        <button class="btn primary" id="installHarness">${ICONS.download} 自动安装/更新官方客户端</button>
      </div>
    </div>
    <div class="check-list">
      ${checks.map((c) => `
        <div class="check-row">
          <span class="badge ${c.status === 'ok' ? 'ok' : c.status === 'update' ? 'warn' : 'err'}">${c.status === 'ok' ? ICONS.check : ICONS.warn}</span>
          <div><div class="name">${c.name}</div><div class="desc">${c.desc}</div></div>
          <div class="val">${esc(c.val)}</div>
          <div style="font-size:12px;color:var(--muted);min-width:110px;text-align:right">${esc(c.text)}</div>
        </div>`).join('')}
    </div>
    <div class="section-head"><div><h2>内置 Skill/MCP 管理器</h2><div class="sub">dseam-skillmcp（原 dsh-skill-mcp-panel 开源改名适配，MIT） · 随 EXE 自动安装</div></div></div>
    <div class="check-list">
      <div class="check-row">
        <span class="badge ${state.panelInstalled ? 'ok' : 'warn'}">${state.panelInstalled ? ICONS.check : ICONS.download}</span>
        <div><div class="name">dseam-skillmcp</div><div class="desc">本地：${esc(state.panelInstalled || '未安装')} · 内置：${esc(state.panelLatest || '0.8.0-pre')}</div></div>
        <div class="val">${esc(state.panelInstalled && state.panelInstalled === state.panelLatest ? '已内置' : '可安装')}</div>
        <div style="display:flex;gap:8px;margin-left:auto">
          <button class="btn sm primary" id="panelInstallBtn">${state.panelInstalled ? '重装内置管理器' : '安装内置管理器'}</button>
          <button class="btn sm" id="panelPageBtn">发布页</button>
        </div>
      </div>
    </div>
    ${getConflicts().length ? `
      <div class="section-head"><div><h2>冲突矩阵</h2></div></div>
      <div class="check-list">
        ${getConflicts().map((c) => `
          <div class="check-row">
            <span class="badge err">冲突</span>
            <div><div class="name">${esc(c.packId)}</div><div class="desc">${esc(c.reason)}</div></div>
            <div style="font-size:12px">${esc(c.suggest)}</div>
          </div>`).join('')}
      </div>` : ''}
    <div class="section-head"><div><h2>外部包</h2></div></div>
    <div class="pack-list">
      <div class="check-row">
        <span class="badge neutral">${ICONS.upload}</span>
        <div><div class="name">导入 .dshpack.json</div><div class="desc">本地文件 · 校验 packId / bundles / requires</div></div>
        <button class="btn primary" id="importBtn3" style="margin-left:auto">${ICONS.upload} 选择文件</button>
      </div>
    </div>`;
  $('recheck').addEventListener('click', () => { if (window.chrome && window.chrome.webview) { window.chrome.webview.postMessage('recheck'); return; } toast('自检完成，状态已更新'); renderCheck(); });
  const panelInstall = $('panelInstallBtn');
  if (panelInstall) panelInstall.addEventListener('click', () => {
    if (window.chrome && window.chrome.webview) { window.chrome.webview.postMessage(state.panelInstalled ? 'updatePanel' : 'installPanel'); return; }
    toast('浏览器预览模式：请在 Dseam世界 桌面端中安装');
  });
  const panelPage = $('panelPageBtn');
  if (panelPage) panelPage.addEventListener('click', () => {
    if (window.chrome && window.chrome.webview) { window.chrome.webview.postMessage('openPanelPage'); return; }
    window.open('https://github.com/ARFCON/dsh-hotplug-hub/releases/tag/v0.9.8', '_blank');
  });
  const ih = $('installHarness');
  if (ih) ih.addEventListener('click', () => {
    if (window.chrome && window.chrome.webview) { toast('正在获取官方 DSH Desktop 安装包（约 70MB），请稍候…'); window.chrome.webview.postMessage('installHarness'); return; }
    window.open('https://github.com/myYangyunfan/dsh_desktop/releases/latest', '_blank');
  });
  const fe = $('fixEnv');
  if (fe) fe.addEventListener('click', () => {
    if (window.chrome && window.chrome.webview) { toast('正在检查并修复 Node/pnpm/官方客户端环境，可能需要几分钟…'); window.chrome.webview.postMessage('autoInstallEnv'); return; }

    const name = nameEl.textContent;

      b.style.marginLeft = '8px';
      b.textContent = label;

        if (window.chrome && window.chrome.webview) { window.chrome.webview.postMessage(msg); return; }
        toast('请在 Dseam世界 桌面端执行');

      row.appendChild(b);
    };
    if (name === 'DSH 版本') mk('⬇ 自动安装/更新', 'primary', 'installHarness');
    if (name === '本程序版本') { mk('检查更新', 'primary', 'checkUpdate'); mk('下载新版本', '', 'downloadProject'); }
  });
}

function simulateConflicts(rows) {
  const out = [];
  const activeBundles = new Map();
  rows.filter((i) => i.active).forEach((row) => {
    const p = packOf(row.packId);
    if (!p) return;
    p.bundles.forEach((b) => {
      if (activeBundles.has(b.name)) {
        const prev = activeBundles.get(b.name);
        if (prev.version !== b.version) out.push({ packId: p.id, reason: `${b.name} 版本冲突 ${prev.version} vs ${b.version}`, suggest: '停用其中一个包或更新到同一版本' });
      } else {
        activeBundles.set(b.name, b);
      }
    });
  });
  const contentCollision = new Set();
  rows.filter((i) => i.active).forEach((row) => {
    const p = packOf(row.packId);
    if (!p) return;
    p.bundles.forEach((b) => {
      if (!contentCollision.has(b.role)) contentCollision.add(b.role);
      else if (!out.some((c) => c.packId === p.id && c.reason.includes('重复角色'))) out.push({ packId: p.id, reason: `重复角色：${b.role}`, suggest: '保留角色更完整的包' });
    });
  });
  return [...new Map(out.map((o) => [o.packId + o.reason, o])).values()];
}
function getConflicts() {
  return simulateConflicts(state.installed);
}

function renderAll() {
  renderShell();
  renderCurrent();
}

function bindGlobal() {
  document.addEventListener('click', (e) => {
    const inst = e.target.closest('[data-install]');
    if (inst) { installPack(inst.dataset.install); return; }
    const tog = e.target.closest('[data-toggle]');
    if (tog) { togglePack(tog.dataset.toggle, tog); return; }
    const un = e.target.closest('[data-uninstall]');
    if (un) { uninstallPack(un.dataset.uninstall); return; }
    const mem = e.target.closest('[data-mem]');
    if (mem) { toast('记忆包保持全局激活'); return; }
    const sk = e.target.closest('[data-skill]');
    if (sk) {
      const id = sk.dataset.skill;
      if (window.chrome && window.chrome.webview) {
        const row = (window.__skillsData || []).find((s) => s.id === id);
        const on = row ? !!row.enabled : false;
        window.chrome.webview.postMessage((on ? 'disableSkill:' : 'enableSkill:') + id);
      } else {
        const row = (state.skills || []).find((s) => s.id === id);
        if (row) { row.enabled = !row.enabled; save(); renderSkills(); }
      }
      return;
    }
    // H-12（v5 阶段 4）：删除按钮经 addEventListener 绑定（不再内联 onclick，杜绝 XSS 面）
    const rm = e.target.closest('[data-remove-skill]');
    if (rm) {
      const id = rm.dataset.removeSkill;
      removeSkill(id);
      return;
    }
    const mc = e.target.closest('[data-mcp]');
    if (mc) {
      const id = mc.dataset.mcp;
      if (window.chrome && window.chrome.webview) {
        const row = (window.__mcpsData || []).find((m) => m.id === id);
        const on = row ? !!row.enabled : false;
        window.chrome.webview.postMessage((on ? 'disableMcp:' : 'enableMcp:') + id);
      } else {
        const row = (state.mcps || []).find((m) => m.id === id);
        if (row) { row.enabled = !row.enabled; save(); renderMcp(); }
      }
      return;
    }
  });
  $('importFile').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        importPacks([data]);
      } catch (err) {
        toast('文件不是合法 JSON');
      }
    };
    reader.readAsText(file);
  });
}

function installPack(id) {
  const p = packOf(id);
  if (!p || isInstalled(id)) { if (isInstalled(id)) toast('该包已安装'); return; }
  const conflicts = getConflicts().filter((c) => c.packId === id);
  showDialog('安装 ' + p.name,
    `<div class="body">
      <div>packId：<code>${esc(p.id)}</code></div>
      <div>版本：<code>${esc(p.version)}</code></div>
      <div>插件：${(p.bundles || []).map((b) => `<code>${esc(b.name)}</code>`).join('、')}</div>
      ${conflicts.length ? `<div style="color:var(--red)">已检测到 ${conflicts.length} 项冲突，安装后需处理。</div>` : ''}
      <div>安装会修改当前 profile，完成后需要重启。</div>
      <div class="sub" style="margin-top:6px">导入兼容性以实际安装校验为准（原型内联校验器与安装端契约保持一致，见 shared-core CONTRACT.md）。</div>
    </div>`,
    () => {
      state.installed.push({ packId: id, active: true, installedAt: today(), status: 'healthy' });
      state.pendingRestart += 1;
      save(); renderAll(); switchView('hub');
      toast(p.name + ' 已安装，重启后生效');
    }, '确认安装');
}

function installMarketEntry(repo) {
  const e = marketData.find((x) => x.repo === repo);
  if (!e) { toast("未找到该条目"); return; }
  if (e.detailPending) { toast("详情加载中，请稍候再试"); return; }
  if (e.importError || !e.importable) { toast("不可安装：" + (e.importError || "无可用清单")); return; }
  if (marketEntryInstalled(e)) { toast("该插件已安装在本地插件目录"); return; }
  const spec = marketInstallSpec(e);
  if (!spec) { toast("无法生成插件安装源"); return; }
  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.postMessage("addPlugin:" + JSON.stringify({ name: spec, source: "" }));
    toast("已提交安装：" + (e.npmName || e.name || e.repo) + "，完成后会在插件管理显示");
  } else {
    toast("请在 DSH Desktop 中使用该功能");
  }
}
function togglePack(id, el) {
  const row = installedRow(id);
  if (!row) return;
  const next = !row.active;
  const p = packOf(id);
  if (next && p) {
    const tmp = [...state.installed.filter((x) => x.packId !== id), { ...row, active: true }];
    const conflicts = simulateConflicts(tmp).filter((c) => c.packId === id);
    if (conflicts.length) {
      showDialog('存在冲突', `<div class="body">${conflicts.map((c) => '<div>' + esc(c.reason) + '</div>').join('')}<div>建议先停用冲突包或选择替换版本。</div></div>`, () => {});
      return;
    }
  }
  row.active = next;
  state.pendingRestart += 1;
  save(); renderAll();
  toast(next ? p.name + ' 已激活' : p.name + ' 已停用');
}

function uninstallPack(id) {
  const p = packOf(id);
  if (!p) return;
  showDialog('卸载 ' + p.name,
    `<div class="body">将移除该包关联的插件与 receipt。此操作需要重启后完全生效。</div>`,
    () => {
      state.installed = state.installed.filter((i) => i.packId !== id);
      state.pendingRestart += 1;
      save(); renderAll();
      toast(p.name + ' 已卸载');
    }, '卸载');
}

function importPacks(list) {
  const ok = [];
  const bad = [];
  list.forEach((data) => {
    if (!data || typeof data !== 'object' || !data.packId || !data.bundles || !Array.isArray(data.bundles) || !data.name) {
      bad.push(data && data.name ? data.name : '未知包');
      return;
    }
    const id = data.packId;
    if (isInstalled(id) || state.imported.some((p) => p.id === id)) { bad.push(data.name + '（已存在）'); return; }
    const norm = {
      id,
      name: data.name,
      author: data.market && data.market.author ? data.market.author : '本地导入',
      stars: data.market && data.market.stars ? data.market.stars : 0,
      version: data.version || '0.0.0',
      tags: data.tags || [],
      desc: data.description || '',
      bundles: data.bundles.map((b) => ({ name: b.package || b.name, role: b.role || '工具', version: b.version || '0.0.0' })),
      memory: data.memory || [],
      accent: '#3d5a6c',
      imported: true
    };
    state.imported.push(norm);
    ok.push(norm);
  });
  if (ok.length) {
    state.installed.push(...ok.map((p) => ({ packId: p.id, active: true, installedAt: today(), status: 'healthy' })));
    state.pendingRestart += ok.length;
    save(); renderAll(); switchView('hub');
    toast(ok.map((p) => p.name).join('、') + ' 已导入');
  }
  if (bad.length) toast('跳过：' + bad.join('、'));
}

function today() {
  return new Date().toISOString().slice(0, 10);
}

document.addEventListener('DOMContentLoaded', () => {
  aiRestore(); // AI 装配间会话续接（刷新/重启）
  bindGlobal();
  renderAll();
});
</script>
