<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH 插座中枢 · 原型</title>
<style>
:root {
  --bg: #f1f2ec;
  --panel: #fffef9;
  --ink: #17201d;
  --muted: #66736e;
  --line: #d9ddd4;
  --teal: #0e7c6b;
  --teal-dark: #0f2f2a;
  --teal-soft: #dceeea;
  --teal-hover: #0a6a5c;
  --amber: #b45309;
  --amber-soft: #fbeede;
  --red: #b3261e;
  --red-soft: #fbe7e4;
  --green: #1a7f4b;
  --sidebar-ink: #e7f0ec;
  --nav-ink: #d9e7e0;
  --surface-dark: #10241f;
  --surface-dark-ink: #cde8dd;
  --green-soft: #e7f5eb;
  --neutral-soft: #f0f2ec;
  --font-sans: ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --rad-sm: 6px;
  --rad: 8px;
  --rad-lg: 10px;
  --rad-full: 20px;
  --shadow-toast: 0 8px 24px rgba(0,0,0,.2);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  letter-spacing: 0;
}
button { font: inherit; color: inherit; }
.app {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  min-height: 100vh;
}
.sidebar {
  background: var(--teal-dark);
  color: var(--sidebar-ink);
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.14);
}
.brand-mark {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  background: var(--sidebar-ink);
  border-radius: var(--rad);
  color: var(--teal-dark);
}
.brand-name { font-weight: 700; font-size: 15px; line-height: 1.2; }
.brand-sub { font-size: 11px; opacity: 0.72; margin-top: 3px; }
.nav { display: grid; gap: 4px; }
.nav button {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 10px 12px;
  border: 0; border-radius: var(--rad);
  background: transparent; color: var(--nav-ink);
  text-align: left; cursor: pointer;
  font-size: 14px;
}
.nav button:hover { background: rgba(255, 255, 255, 0.08); }
.nav button.active { background: var(--teal); color: #fff; }
.nav .n-count {
  margin-left: auto; font-size: 11px;
  background: rgba(255,255,255,.16); border-radius: var(--rad-lg); padding: 2px 8px;
}
.nav button.active .n-count { background: rgba(255,255,255,.24); }
.side-foot {
  margin-top: auto;
  background: rgba(255,255,255,0.07);
  border-radius: var(--rad);
  padding: 12px;
  display: grid;
  gap: 8px;
  font-size: 12px;
}
.side-row { display: flex; justify-content: space-between; gap: 8px; }
.side-row .v { color: #fff; font-weight: 600; }
.side-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--amber); color: #fff;
  border-radius: var(--rad-lg); padding: 4px 10px; font-size: 12px; font-weight: 600;
}
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 22px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
.topbar h1 { margin: 0; font-size: 18px; }
.topbar .ctx { font-size: 12px; color: var(--muted); }
.topbar .spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: #f7f8f3;
  color: var(--muted); border-radius: var(--rad-full); padding: 5px 12px; font-size: 12px;
}
.pill.good { color: var(--green); background: var(--green-soft); border-color: #bfe0c6; }
.pill.warn { color: var(--amber); background: var(--amber-soft); border-color: #efd3ae; }
.wrap { padding: 22px; display: grid; gap: 18px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--rad); padding: 14px 16px;
}
.stat .label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.stat .num { font-size: 26px; font-weight: 700; margin-top: 8px; }
.stat .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.section-head h2 { margin: 0; font-size: 15px; }
.section-head .sub { font-size: 12px; color: var(--muted); }
.toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--rad); padding: 12px;
}
.search {
  flex: 1 1 240px; min-width: 180px;
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); border-radius: var(--rad);
  padding: 8px 10px; background: #fff;
}
.search input {
  border: 0; outline: 0; background: transparent; width: 100%; font: inherit;
  color: var(--ink);
}
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: #fff; color: var(--muted);
  border-radius: var(--rad-full); padding: 6px 12px; font-size: 12px; cursor: pointer;
}
.chip.on { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  border-radius: var(--rad); padding: 8px 12px; font-size: 13px; cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: #b8c1b6; background: #f8faf6; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.primary:hover { background: var(--teal-hover); }
.btn.danger { color: var(--red); border-color: #e6b7b1; }
.btn.danger:hover { background: var(--red-soft); }
.btn.sm { padding: 5px 9px; font-size: 12px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.pack-list, .pack-grid, .mem-list, .check-list { display: grid; gap: 10px; }
.pack-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pack {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--rad); padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.pack-top, .mem-top { display: flex; align-items: flex-start; gap: 10px; }
.pack-icon {
  width: 38px; height: 38px; border-radius: var(--rad); flex: 0 0 auto;
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px;
}
.pack-title { flex: 1; min-width: 0; }
.pack-title h3 { margin: 0; font-size: 15px; line-height: 1.35; }
.pack-title .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  font-size: 11px; color: var(--muted);
  background: #f1f3ed; border: 1px solid var(--line);
  padding: 2px 8px; border-radius: var(--rad-lg);
}
.plugins { display: grid; gap: 4px; }
.plugin-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--muted);
  padding: 5px 8px; background: #f6f8f3; border: 1px solid #e9ece4; border-radius: var(--rad-sm);
}
.plugin-row .role { margin-left: auto; color: var(--ink); }
.pack-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; }
.pack-foot .spacer { flex: 1; }
.switch {
  width: 42px; height: 24px; border-radius: 16px;
  border: 1px solid var(--line); background: #d6dbd2;
  position: relative; cursor: pointer; transition: background 0.15s;
  flex: 0 0 auto;
}
.switch::after {
  content: ""; position: absolute; width: 18px; height: 18px;
  border-radius: 50%; background: #fff; top: 2px; left: 2px;
  transition: left 0.15s; box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
.switch[aria-checked="true"] { background: var(--teal); border-color: var(--teal); }
.switch[aria-checked="true"]::after { left: 20px; }
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; border-radius: var(--rad-lg); padding: 3px 9px; font-weight: 600;
}
.badge.ok { background: var(--green-soft); color: var(--green); }
.badge.warn { background: var(--amber-soft); color: var(--amber); }
.badge.err { background: var(--red-soft); color: var(--red); }
.badge.neutral { background: var(--neutral-soft); color: var(--muted); }
.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--rad); padding: 16px;
}
.ai-pane { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 14px; }
.ai-main, .ai-side { display: grid; gap: 12px; align-content: start; }
.req-box {
  width: 100%; min-height: 120px; resize: vertical;
  border: 1px solid var(--line); border-radius: var(--rad); background: #fff;
  padding: 12px; font: inherit; color: var(--ink);
}
.req-box:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
.log-box {
  background: var(--surface-dark); color: var(--surface-dark-ink); border-radius: var(--rad);
  font-family: var(--font-mono);
  font-size: 12px; line-height: 1.7; padding: 12px 14px;
  min-height: 220px; max-height: 360px; overflow-y: auto;
  white-space: pre-wrap;
}
.log-box .ok { color: #7fd6a8; }
.log-box .warn { color: #f3c076; }
.result {
  display: none;
  border: 1px solid var(--teal); background: #f2faf7; border-radius: var(--rad); padding: 14px;
}
.result.show { display: block; }
.result h3 { margin: 0 0 8px; font-size: 14px; }
.json-pre {
  background: #fff; border: 1px solid var(--line); border-radius: var(--rad);
  padding: 10px; font-family: var(--font-mono);
  font-size: 11px; max-height: 220px; overflow: auto; white-space: pre;
  margin: 0;
}
.check-row {
  display: flex; align-items: center; gap: 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--rad);
  padding: 12px 14px;
}
.check-row .name { font-size: 13px; font-weight: 600; }
.check-row .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.check-row .val { margin-left: auto; font-size: 13px; font-family: var(--font-mono); }
.check-row .act { margin-left: 4px; }
.mem-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.mem { background: var(--panel); border: 1px solid var(--line); border-radius: var(--rad); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.kw { font-size: 11px; color: var(--teal); background: var(--teal-soft); border-radius: var(--rad-lg); padding: 2px 8px; }
.empty { color: var(--muted); font-size: 13px; padding: 12px; text-align: center; }
.dialog-backdrop {
  position: fixed; inset: 0; background: rgba(10, 24, 20, 0.45);
  display: none; align-items: center; justify-content: center; z-index: 30; padding: 16px;
}
.dialog-backdrop.show { display: flex; }
.dialog {
  width: min(520px, 100%);
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--rad);
  padding: 18px;
  display: grid; gap: 12px;
}
.dialog h3 { margin: 0; font-size: 16px; }
.dialog .body { font-size: 13px; color: var(--muted); line-height: 1.6; }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--surface-dark); color: #fff; border-radius: var(--rad); padding: 10px 16px;
  font-size: 13px; z-index: 40; box-shadow: var(--shadow-toast);
  opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
.footnote { font-size: 11px; color: var(--muted); }

/* ===== 插件包市场（真实 GitHub 数据源）样式 ===== */
.mkt-banner { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; }
.mkt-banner.err { background: var(--red-soft, rgba(220,38,38,0.12)); color: var(--red, #dc2626); }
.mkt-banner.ok { background: var(--green-soft, rgba(16,185,129,0.12)); color: var(--green, #10b981); }
.mkt-tags { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.mkt-tags-toggle { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line, rgba(128,128,128,0.35)); background: transparent; color: var(--ink); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; align-self: flex-start; }
.mkt-tags-toggle:hover { border-color: var(--teal); }
.mkt-tags-label { font-weight: 600; }
.mkt-tags-count { font-size: 12px; color: var(--teal); background: rgba(14,124,107,0.12); padding: 1px 8px; border-radius: 999px; }
.mkt-tags-count.muted { color: var(--muted); background: rgba(128,128,128,0.12); }
.mkt-tags-caret { font-size: 11px; color: var(--muted); transition: transform 0.15s; }
.mkt-tags-panel { display: none; }
.mkt-tags-panel.open { display: flex; }
.mkt-topic-wrap { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.mkt-topic { width: 130px; padding: 7px 10px; border: 1px solid var(--border, rgba(128,128,128,0.35)); border-radius: 8px; background: transparent; color: inherit; font-size: 13px; }
.mkt-topic:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
.mkt-select { padding: 7px 10px; border: 1px solid var(--border, rgba(128,128,128,0.35)); border-radius: 8px; background: transparent; color: inherit; font-size: 13px; }
.mkt-select:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
.mkt-source { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.mkt-source-label { font-size: 12px; color: var(--muted); margin-right: 2px; }
.mkt-desc { font-size: 13px; color: var(--muted); line-height: 1.55; margin: 8px 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.mkt-link { font-size: 12px; color: var(--teal); text-decoration: none; }
.mkt-link:hover { text-decoration: underline; }
.mkt-details { margin: 6px 0; font-size: 12px; }
.mkt-details summary { cursor: pointer; color: var(--teal); font-size: 12px; }
.mkt-pre { background: rgba(0,0,0,0.06); border: 1px solid var(--border, rgba(128,128,128,0.3)); border-radius: 8px; padding: 10px; font-family: monospace; font-size: 11px; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; line-height: 1.5; }
@media (max-width: 1000px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pack-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ai-pane { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .app { grid-template-columns: 72px minmax(0, 1fr); }
  .brand-name, .brand-sub, .nav span, .nav .n-count, .side-foot { display: none; }
  .sidebar { padding: 12px 10px; }
  .nav button { justify-content: center; padding: 10px 0; }
  .grid-4, .pack-grid, .mem-list { grid-template-columns: 1fr; }
  .wrap { padding: 14px; }
  .topbar { padding: 12px 14px; }
}

.mem-body{font-size:12.5px;color:var(--muted);line-height:1.6;white-space:pre-wrap;word-break:break-word}
.mem-edit{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin-top:14px}
.mem-ta{width:100%;min-height:120px;margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--rad-sm);font:inherit;font-size:12.5px;resize:vertical;background:#fff;color:var(--ink)}
.mem-ta:focus,.search:focus{outline:2px solid var(--teal);outline-offset:0}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2v7a3 3 0 0 1-3 3H4"/><path d="M15 2v7a3 3 0 0 0 3 3h2"/><path d="M6 12v2a6 6 0 0 0 6 6h0a6 6 0 0 0 6-6v-2"/><path d="M12 20v2"/></svg>
      </div>
      <div>
        <div class="brand-name">Dseam世界</div>
        <div class="brand-sub">Dseam v0.9.6</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main class="main">
    <header class="topbar"></header>
    <div class="wrap">
      <section id="view-memory" class="view hidden"></section>
      <section id="view-check" class="view hidden"></section>
        <section id="view-skills" class="view hidden"></section>
        <section id="view-plugins" class="view hidden"></section>
        <section id="view-mcp" class="view hidden"></section>
    </div>
  </main>
</div>
<div class="dialog-backdrop" id="dlgBackdrop">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h3 id="dlgTitle"></h3>
    <div class="body" id="dlgBody"></div>
    <div class="actions">
      <button class="btn" id="dlgCancel">取消</button>
      <button class="btn primary" id="dlgOk">确认</button>
    </div>
  </div>
</div>
<input type="file" id="importFile" hidden accept=".json,application/json">
<div class="toast" id="toast"></div>

<script>
const NAV = [
  { id: 'memory', label: '记忆中枢', icon: 'brain' },
  { id: 'skills', label: 'Skill 管理', icon: 'spark' },
  { id: 'plugins', label: '插件管理', icon: 'box' },
  { id: 'check', label: '自检更新', icon: 'shield' },
  { id: 'mcp', label: 'MCP 管理', icon: 'box' }
];

const ICONS = {
  box: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>',
  store: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9 6 3h12l2 6"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M5 12v8h14v-8"/><path d="M9 20v-5h6v5"/></svg>',
  spark: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/></svg>',
  brain: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2a2.5 2.5 0 0 0-2.5 2.5v.55A3.5 3.5 0 0 0 3 8.5 3.5 3.5 0 0 0 5.5 12 3.5 3.5 0 0 0 3 15.5a3.5 3.5 0 0 0 4 3.45V20a2 2 0 0 0 4 0v-.55A3.5 3.5 0 0 0 15 16a3.5 3.5 0 0 0 2.5-3.5A3.5 3.5 0 0 0 15 9a3.5 3.5 0 0 0 2.5-3.5A3.5 3.5 0 0 0 13.5 2H13"/><path d="M9.5 2c.83 0 1.5.67 1.5 1.5V8"/></svg>',
  shield: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>',

function renderMemory() {

  const filtered = q ? rows.filter((m) => ((m.title || '') + ' ' + (m.body || '') + ' ' + (m.keywords || []).join(' ')).toLowerCase().includes(q)) : rows;
  const emptyHint = isWebView
    ? '还没有真实记忆，读取文档后会自动写入 memory-hub'
    : '记忆中枢已接入 ~/.dsh/memory-hub，请在 DSH Desktop 中查看真实记忆。';
  $('view-memory').innerHTML = `
    <div class="section-head">

      </div>
    </div>
    <div class="mem-list">
      ${filtered.length ? filtered.map(memoryRowHtml).join('') : `<div class="empty">${emptyHint}</div>`}
    </div>`;
  const refresh = $('memRefresh');
  if (refresh) refresh.addEventListener('click', () => {
    if (window.chrome && window.chrome.webview) { window.chrome.webview.postMessage('listMemory'); return; }
    renderMemory();
  });
  const search = $('memSearch');
  if (search) search.addEventListener('input', renderMemory);
  document.querySelectorAll('[data-del-memory]').forEach((b) => b.addEventListener('click', () => {
    const id = b.dataset.delMemory;
    if (!confirm('删除这条记忆？删除后不可恢复。')) return;
    if (window.chrome && window.chrome.webview) { window.chrome.webview.postMessage('deleteMemory:' + id); return; }
    state.memories = (state.memories || []).filter((m) => m.id !== id);
    save(); renderMemory();
  }));
  document.querySelectorAll('[data-edit-memory]').forEach((b) => b.addEventListener('click', () => {
    const id = b.dataset.editMemory;
    const row = rows.find((m) => m.id === id) || {};
    const form = $('memEditForm');
    if (form) form.remove();
    const box = document.createElement('div');
    box.id = 'memEditForm';
    box.className = 'mem-edit';
    box.innerHTML = `
      <div class="section-head"><div><h3>编辑记忆</h3><div class="sub">修改后保存，更新 updatedAt</div></div></div>
      <div class="toolbar">
        <input class="search" id="memEditTitle" placeholder="标题" value="${esc(row.title || '')}">
        <input class="search" id="memEditType" placeholder="类型 user/project/reference/feedback" value="${esc(row.type || '')}">
      </div>
      <div class="toolbar">
        <input class="search" id="memEditKeywords" placeholder="关键词，逗号分隔" value="${esc((row.keywords || []).join(', '))}">
      </div>
      <textarea id="memEditBody" class="mem-ta" placeholder="记忆正文">${esc(row.body || '')}</textarea>
      <div class="pack-foot" style="margin-top:10px">
        <div class="spacer"></div>
        <button class="btn" id="memEditCancel">取消</button>
        <button class="btn primary" id="memEditSave">保存修改</button>
      </div>`;
    $('view-memory').appendChild(box);
    $('memEditCancel').addEventListener('click', () => box.remove());
    $('memEditSave').addEventListener('click', () => {
      const title = $('memEditTitle').value.trim();
      const type = $('memEditType').value.trim();
      const keywords = $('memEditKeywords').value.split(',').map((k) => k.trim()).filter(Boolean);
      const body = $('memEditBody').value;
      if (!title && !body) return;
      const payload = { id, title, type, keywords, body };
      if (window.chrome && window.chrome.webview) { window.chrome.webview.postMessage('saveMemory:' + JSON.stringify(payload)); return; }
      const target = (state.memories || []).find((m) => m.id === id);
      if (target) { target.title = title || target.title; target.type = type || target.type; target.keywords = keywords; target.body = body; }
      save(); box.remove(); renderMemory();
    });
  }));
}

    const install = $('skillSourceInstall');
    if (install) install.addEventListener('click', () => {
      const boxes = document.querySelectorAll('[data-pick-skill]:checked');
      const paths = Array.from(boxes).map((b) => { const row = sourceRows.find((s) => s.id === b.dataset.pickSkill); return row ? row.path : null; }).filter(Boolean);
      if (!paths.length) { toast('请先勾选要安装的 Skill'); return; }
      window.chrome.webview.postMessage('addSkillSource:' + JSON.stringify({ paths }));
    });
    document.querySelectorAll('[data-pick-skill]').forEach((cb) => cb.addEventListener('change', () => {
      window.__skillPicks = Array.from(document.querySelectorAll('[data-pick-skill]:checked')).map((b) => b.dataset.pickSkill);
    }));
  }
}

function renderPlugins() {

    const input = $('pluginAddInput');
    const spec = input ? input.value.trim() : '';
    if (!spec) { toast('请输入插件名或地址'); return; }
    if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage('addPlugin:' + JSON.stringify({ name: spec, source: '' }));

  document.querySelectorAll('#view-plugins [data-plugin-toggle]').forEach((btn) => {

function renderMcp() {
  const rows = (window.chrome && window.chrome.webview && window.__mcpsData) || state.mcps || [];
  $('view-mcp').innerHTML = `
    <div class="section-head">
      <div><h2>MCP 管理</h2><div class="sub">统一读写 dsh-skill-mcp-panel 受管块 · 支持 STDIO / streamable-http</div></div>

      ${rows.length ? rows.map(mcpRowHtml).join('') : '<div class="empty">还没有 MCP 服务器</div>'}
    </div>
    <div class="toolbar">
      <input class="search" id="newMcpName" placeholder="MCP 名称（如 godot-mcp）">
      <select class="search" id="newMcpTransport" style="max-width:160px">
        <option value="stdio">STDIO 命令</option>
        <option value="streamable-http">HTTP 地址</option>
      </select>
      <input class="search" id="newMcpCmd" placeholder="STDIO 命令，如 npx 或 http 地址">

  document.querySelectorAll('[data-test-mcp]').forEach((b) => b.addEventListener('click', () => {
    if (window.chrome && window.chrome.webview) { window.chrome.webview.postMessage('startMcp:' + b.dataset.testMcp); return; }
    alert('测试需在 DSH Desktop 的 WebView 中运行');

  document.querySelectorAll('[data-del-mcp]').forEach((b) => b.addEventListener('click', () => {

function renderCheck() {

      <div style="display:flex;gap:8px">
        <button class="btn" id="recheck">${ICONS.refresh} 重新自检</button>
        <button class="btn primary" id="updateDsh" ${state.dshVersion === state.latestVersion ? 'disabled' : ''}>${ICONS.download} 更新 DSH</button>
      </div>
    </div>
    <div class="check-list">
      ${checks.map((c) => `
        <div class="check-row">
          <span class="badge ${c.status === 'ok' ? 'ok' : c.status === 'update' ? 'warn' : 'err'}">${c.status === 'ok' ? ICONS.check : ICONS.warn}</span>
          <div><div class="name">${c.name}</div><div class="desc">${c.desc}</div></div>
          <div class="val">${esc(c.val)}</div>
          <div style="font-size:12px;color:var(--muted);min-width:110px;text-align:right">${esc(c.text)}</div>
        </div>`).join('')}
    </div>
    <div class="section-head"><div><h2>内置 Skill/MCP 管理器</h2><div class="sub">dseam-skillmcp（原 dsh-skill-mcp-panel 开源改名适配，MIT） · 随 EXE 自动安装</div></div></div>
    <div class="check-list">
      <div class="check-row">
        <span class="badge ${state.panelInstalled ? 'ok' : 'warn'}">${state.panelInstalled ? ICONS.check : ICONS.download}</span>
        <div><div class="name">dseam-skillmcp</div><div class="desc">本地：${esc(state.panelInstalled || '未安装')} · 内置：${esc(state.panelLatest || '0.8.0-pre')}</div></div>
        <div class="val">${esc(state.panelInstalled && state.panelInstalled === state.panelLatest ? '已内置' : '可安装')}</div>
        <div style="display:flex;gap:8px;margin-left:auto">
          <button class="btn sm primary" id="panelInstallBtn">${state.panelInstalled ? '重装内置管理器' : '安装内置管理器'}</button>

          <div class="check-row">

            <div style="font-size:12px">${esc(c.suggest)}</div>

    <div class="section-head"><div><h2>外部包</h2></div></div>
    <div class="pack-list">
      <div class="check-row">

        <div><div class="name">导入 .dshpack.json</div><div class="desc">本地文件 · 校验 packId / bundles / requires</div></div>
        <button class="btn primary" id="importBtn3" style="margin-left:auto">${ICONS.upload} 选择文件</button>

    window.open('https://github.com/ARFCON/dsh-hotplug-hub/releases/tag/v0.9.6', '_blank');
  });
  const up = $('updateDsh');
  if (up) up.addEventListener('click', () => {

      state.dshVersion = state.latestVersion;
      state.pendingRestart += 1;
      save(); renderAll();

function simulateConflicts(rows) {
  const out = [];
  const activeBundles = new Map();
  rows.filter((i) => i.active).forEach((row) => {
    const p = packOf(row.packId);
    if (!p) return;
    p.bundles.forEach((b) => {
      if (activeBundles.has(b.name)) {
        const prev = activeBundles.get(b.name);
        if (prev.version !== b.version) out.push({ packId: p.id, reason: `${b.name} 版本冲突 ${prev.version} vs ${b.version}`, suggest: '停用其中一个包或更新到同一版本' });
      } else {
        activeBundles.set(b.name, b);
      }
    });
  });
  const contentCollision = new Set();
  rows.filter((i) => i.active).forEach((row) => {
    const p = packOf(row.packId);
    if (!p) return;
    p.bundles.forEach((b) => {
      if (!contentCollision.has(b.role)) contentCollision.add(b.role);
      else if (!out.some((c) => c.packId === p.id && c.reason.includes('重复角色'))) out.push({ packId: p.id, reason: `重复角色：${b.role}`, suggest: '保留角色更完整的包' });
    });
  });
  return [...new Map(out.map((o) => [o.packId + o.reason, o])).values()];
}
function getConflicts() {
  return simulateConflicts(state.installed);
}

function renderAll() {
  renderShell();
  renderCurrent();
}

function bindGlobal() {
  document.addEventListener('click', (e) => {
    const inst = e.target.closest('[data-install]');
    if (inst) { installPack(inst.dataset.install); return; }
    const tog = e.target.closest('[data-toggle]');
    if (tog) { togglePack(tog.dataset.toggle, tog); return; }
    const un = e.target.closest('[data-uninstall]');
    if (un) { uninstallPack(un.dataset.uninstall); return; }
    const mem = e.target.closest('[data-mem]');
    if (mem) { toast('记忆包保持全局激活'); return; }
    const sk = e.target.closest('[data-skill]');
    if (sk) {
      const id = sk.dataset.skill;
      if (window.chrome && window.chrome.webview) {
        const row = (window.__skillsData || []).find((s) => s.id === id);
        const on = row ? !!row.enabled : false;
        window.chrome.webview.postMessage((on ? 'disableSkill:' : 'enableSkill:') + id);
      } else {
        const row = (state.skills || []).find((s) => s.id === id);
        if (row) { row.enabled = !row.enabled; save(); renderSkills(); }
      }
      return;
    }
    const mc = e.target.closest('[data-mcp]');
    if (mc) {
      const id = mc.dataset.mcp;
      if (window.chrome && window.chrome.webview) {
        const row = (window.__mcpsData || []).find((m) => m.id === id);
        const on = row ? !!row.enabled : false;
        window.chrome.webview.postMessage((on ? 'disableMcp:' : 'enableMcp:') + id);
      } else {
        const row = (state.mcps || []).find((m) => m.id === id);
        if (row) { row.enabled = !row.enabled; save(); renderMcp(); }
      }
      return;
    }
  });
  $('importFile').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        importPacks([data]);
      } catch (err) {
        toast('文件不是合法 JSON');
      }
    };
    reader.readAsText(file);
  });
}

function installPack(id) {
  const p = packOf(id);
  if (!p || isInstalled(id)) { if (isInstalled(id)) toast('该包已安装'); return; }
  const conflicts = getConflicts().filter((c) => c.packId === id);
  showDialog('安装 ' + p.name,
    `<div class="body">
      <div>packId：<code>${esc(p.id)}</code></div>
      <div>版本：<code>${esc(p.version)}</code></div>
      <div>插件：${(p.bundles || []).map((b) => `<code>${esc(b.name)}</code>`).join('、')}</div>
      ${conflicts.length ? `<div style="color:var(--red)">已检测到 ${conflicts.length} 项冲突，安装后需处理。</div>` : ''}
      <div>安装会修改当前 profile，完成后需要重启。</div>
    </div>`,
    () => {
      state.installed.push({ packId: id, active: true, installedAt: today(), status: 'healthy' });
      state.pendingRestart += 1;
      save(); renderAll(); switchView('skills');
      toast(p.name + ' 已安装，重启后生效');
    }, '确认安装');
}

function togglePack(id, el) {
  const row = installedRow(id);
  if (!row) return;
  const next = !row.active;
  const p = packOf(id);
  if (next && p) {
    const tmp = [...state.installed.filter((x) => x.packId !== id), { ...row, active: true }];
    const conflicts = simulateConflicts(tmp).filter((c) => c.packId === id);
    if (conflicts.length) {
      showDialog('存在冲突', `<div class="body">${conflicts.map((c) => '<div>' + esc(c.reason) + '</div>').join('')}<div>建议先停用冲突包或选择替换版本。</div></div>`, () => {});
      return;
    }
  }
  row.active = next;
  state.pendingRestart += 1;
  save(); renderAll();
  toast(next ? p.name + ' 已激活' : p.name + ' 已停用');
}

function uninstallPack(id) {
  const p = packOf(id);
  if (!p) return;
  showDialog('卸载 ' + p.name,
    `<div class="body">将移除该包关联的插件与 receipt。此操作需要重启后完全生效。</div>`,
    () => {
      state.installed = state.installed.filter((i) => i.packId !== id);
      state.pendingRestart += 1;
      save(); renderAll();
      toast(p.name + ' 已卸载');
    }, '卸载');
}

function importPacks(list) {
  const ok = [];
  const bad = [];
  list.forEach((data) => {
    if (!data || typeof data !== 'object' || !data.packId || !data.bundles || !Array.isArray(data.bundles) || !data.name) {
      bad.push(data && data.name ? data.name : '未知包');
      return;
    }
    const id = data.packId;
    if (isInstalled(id) || state.imported.some((p) => p.id === id)) { bad.push(data.name + '（已存在）'); return; }
    const norm = {
      id,
      name: data.name,
      author: data.market && data.market.author ? data.market.author : '本地导入',
      stars: data.market && data.market.stars ? data.market.stars : 0,
      version: data.version || '0.0.0',
      tags: data.tags || [],
      desc: data.description || '',
      bundles: data.bundles.map((b) => ({ name: b.package || b.name, role: b.role || '工具', version: b.version || '0.0.0' })),
      memory: data.memory || [],
      accent: '#3d5a6c',
      imported: true
    };
    state.imported.push(norm);
    ok.push(norm);
  });
  if (ok.length) {
    state.installed.push(...ok.map((p) => ({ packId: p.id, active: true, installedAt: today(), status: 'healthy' })));
    state.pendingRestart += ok.length;
    save(); renderAll(); switchView('skills');
    toast(ok.map((p) => p.name).join('、') + ' 已导入');
  }
  if (bad.length) toast('跳过：' + bad.join('、'));
}

function today() {
  return new Date().toISOString().slice(0, 10);
}

document.addEventListener('DOMContentLoaded', () => {
  bindGlobal();
  renderAll();
});
</script>
